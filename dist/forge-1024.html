       let s = row[off + i] - m[i];\r\n        for (let j = 0; j < i; j++) s -= L[i * d + j] * y[j];\r\n        y[i] = s / L[i * d + i];\r\n      }\r\n      let q = 0;\r\n      for (let i = 0; i < d; i++) q += y[i] * y[i];\r\n      return q;\r\n    };\r\n    if (x.ndim === 1) {\r\n      const xd = dataOf(x, 'x');\r\n      if (xd.length !== d) throw new ForgeError('E_SHAPE', `x: 期望长度 ${d}，得到 ${xd.length}`);\r\n      return Math.exp(logNorm - 0.5 * quad(xd, 0));\r\n    }\r\n    if (x.ndim === 2) {\r\n      const [n, cols] = x.shape;\r\n      if (cols !== d) throw new ForgeError('E_SHAPE', `x: 期望每行长度 ${d}，得到 ${cols}`);\r\n      const out = new Float64Array(n);\r\n      for (let r = 0; r < n; r++) out[r] = Math.exp(logNorm - 0.5 * quad(x.data, r * d));\r\n      return new Tensor(out, [n]);\r\n    }\r\n    throw new ForgeError('E_SHAPE', `x: 期望 1D [d] 或 2D [n,d]，得到 ndim=${x.ndim}`);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.mvn.sample', arity: 4,\r\n  sig: '(seed: number, n: number, mu: Tensor[d], Sigma: Tensor[d,d]) -> Tensor[n,d]',\r\n  doc: '多元正态抽样：x = μ + L·z，Σ = L·Lᵀ（Cholesky），z ~ N(0, I_d)',\r\n  ref: 'Tong, The Multivariate Normal Distribution（Cholesky 抽样法）',\r\n  inv: '同种子可复现；大样本协方差 → Σ',\r\n  impl: (seed, n, mu, Sigma) => {\r\n    num(seed, 'seed'); nonNeg(n | 0, 'n');\r\n    const m = dataOf(mu, 'mu');\r\n    const d = m.length;\r\n    if (!(Sigma instanceof Tensor) || Sigma.shape.length !== 2 || Sigma.shape[0] !== d || Sigma.shape[1] !== d) {\r\n      throw new ForgeError('E_SHAPE', `Sigma: 期望 [${d},${d}] 方阵`);\r\n    }\r\n    const L = choleskyLower(dataOf(Sigma, 'Sigma'), d);\r\n    const rng = createRng(seed);\r\n    const g = normalGen(rng);\r\n    const out = new Float64Array(n * d);\r\n    for (let r = 0; r < n; r++) {\r\n      const z = new Float64Array(d);\r\n      for (let i = 0; i < d; i++) z[i] = g();\r\n      for (let i = 0; i < d; i++) {\r\n        let s = m[i];\r\n        for (let j = 0; j <= i; j++) s += L[i * d + j] * z[j];\r\n        out[r * d + i] = s;\r\n      }\r\n    }\r\n    return new Tensor(out, [n, d]);\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 七、信息论（8 条：D6-061 … D6-068）\r\n// ============================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.entropy', arity: 1,\r\n  sig: '(p: Tensor) -> number',\r\n  doc: '香农熵（nat）：H(p) = −Σ p_i ln p_i（0·ln0 = 0；自动归一化）',\r\n  ref: 'Shannon 1948；Cover & Thomas, Elements of Information Theory §2.1',\r\n  inv: 'H ≥ 0；H ≤ ln|X|，均匀分布取等',\r\n  impl: (p) => {\r\n    const { d, s } = probVecOf(p, 'p');\r\n    let h = 0;\r\n    for (const v of d) if (v > 0) h -= (v / s) * Math.log(v / s);\r\n    return h;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.crossEntropy', arity: 2,\r\n  sig: '(p: Tensor, q: Tensor) -> number',\r\n  doc: '交叉熵（nat）：H(p,q) = −Σ p_i ln q_i（p>0 且 q_i=0 时返回 +∞）',\r\n  ref: 'Cover & Thomas, Elements of Information Theory §2.2',\r\n  inv: 'H(p,q) ≥ H(p)，等号当且仅当 p = q',\r\n  impl: (p, q) => {\r\n    const P = probVecOf(p, 'p');\r\n    const Q = probVecOf(q, 'q');\r\n    if (P.d.length !== Q.d.length) throw new ForgeError('E_VALUE', 'crossEntropy: p 与 q 长度须一致');\r\n    let h = 0;\r\n    for (let i = 0; i < P.d.length; i++) {\r\n      const pi = P.d[i] / P.s;\r\n      if (pi <= 0) continue;\r\n      if (Q.d[i] <= 0) return Infinity;\r\n      h -= pi * Math.log(Q.d[i] / Q.s);\r\n    }\r\n    return h;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.klDiv', arity: 2,\r\n  sig: '(p: Tensor, q: Tensor) -> number',\r\n  doc: 'KL 散度（nat）：D(p‖q) = Σ p_i ln(p_i/q_i)；p>0 且 q_i=0 时返回 +∞',\r\n  ref: 'Kullback & Leibler 1951（KL 散度原始文献）',\r\n  inv: 'D(p‖p) = 0；D ≥ 0（Gibbs 不等式）；不对称',\r\n  impl: (p, q) => {\r\n    const P = probVecOf(p, 'p');\r\n    const Q = probVecOf(q, 'q');\r\n    if (P.d.length !== Q.d.length) throw new ForgeError('E_VALUE', 'klDiv: p 与 q 长度须一致');\r\n    let d = 0;\r\n    for (let i = 0; i < P.d.length; i++) {\r\n      const pi = P.d[i] / P.s;\r\n      if (pi <= 0) continue;\r\n      if (Q.d[i] <= 0) return Infinity;\r\n      d += pi * Math.log(pi / (Q.d[i] / Q.s));\r\n    }\r\n    return d;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.jsDiv', arity: 2,\r\n  sig: '(p: Tensor, q: Tensor) -> number',\r\n  doc: 'JS 散度（nat）：½D(p‖m) + ½D(q‖m)，m = (p+q)/2',\r\n  ref: 'Lin 1991（JS divergence）；Endres & Schindelin 2003',\r\n  inv: '0 ≤ JS ≤ ln 2；JS(p,p) = 0；对称',\r\n  impl: (p, q) => {\r\n    const P = probVecOf(p, 'p');\r\n    const Q = probVecOf(q, 'q');\r\n    if (P.d.length !== Q.d.length) throw new ForgeError('E_VALUE', 'jsDiv: p 与 q 长度须一致');\r\n    const n = P.d.length;\r\n    const m = new Float64Array(n);\r\n    for (let i = 0; i < n; i++) m[i] = 0.5 * (P.d[i] / P.s + Q.d[i] / Q.s);\r\n    let js = 0;\r\n    for (let i = 0; i < n; i++) {\r\n      const mi = m[i];\r\n      if (mi <= 0) continue;\r\n      const pi = P.d[i] / P.s, qi = Q.d[i] / Q.s;\r\n      if (pi > 0) js += 0.5 * pi * Math.log(pi / mi);\r\n      if (qi > 0) js += 0.5 * qi * Math.log(qi / mi);\r\n    }\r\n    return js;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.mutualInfo', arity: 1,\r\n  sig: '(joint: Tensor[m,n]) -> number',\r\n  doc: '互信息（nat）：I(X;Y) = Σ_ij P_ij ln(P_ij / (P_i·P_j))（自动归一化）',\r\n  ref: 'Cover & Thomas, Elements of Information Theory §2.3；Shannon 1948',\r\n  inv: 'I ≥ 0；独立时为 0；I ≤ min(H(X), H(Y))',\r\n  impl: (joint) => {\r\n    if (!(joint instanceof Tensor) || joint.ndim !== 2) {\r\n      throw new ForgeError('E_SHAPE', 'mutualInfo: joint 须为 2D Tensor [m,n]');\r\n    }\r\n    const [m, n] = joint.shape;\r\n    const J = dataOf(joint, 'joint');\r\n    let s = 0;\r\n    for (const v of J) { if (v < 0) throw new ForgeError('E_VALUE', 'mutualInfo: 联合概率不能为负'); s += v; }\r\n    if (!(s > 0)) throw new ForgeError('E_VALUE', 'mutualInfo: 联合概率和须 > 0');\r\n    const px = new Float64Array(m), py = new Float64Array(n);\r\n    for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) { px[i] += J[i * n + j]; py[j] += J[i * n + j]; }\r\n    let mi = 0;\r\n    for (let i = 0; i < m; i++) {\r\n      for (let j = 0; j < n; j++) {\r\n        const pij = J[i * n + j] / s;\r\n        if (pij <= 0) continue;\r\n        mi += pij * Math.log(pij / ((px[i] / s) * (py[j] / s)));\r\n      }\r\n    }\r\n    return mi;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.wasserstein1', arity: null,\r\n  sig: '(x: Tensor, y: Tensor) -> number | (mu1: number, sigma1: number, mu2: number, sigma2: number) -> number',\r\n  doc: '一阶 Wasserstein 距离：两样本（等长）取排序后平均绝对差；四个数值参数时按正态闭式 W1 = |μ1−μ2|',\r\n  ref: 'Vallender 1974；Olkin & Pukelsheim 1982（正态间 W1 = |μ1−μ2|）',\r\n  inv: 'W1 ≥ 0；W1(x,x) = 0；满足三角不等式',\r\n  impl: (a, b, c = undefined, d = undefined) => {\r\n    if (a instanceof Tensor && b instanceof Tensor && c === undefined) {\r\n      const x = Array.from(dataOf(a, 'x')).sort((u, v) => u - v);\r\n      const y = Array.from(dataOf(b, 'y')).sort((u, v) => u - v);\r\n      if (x.length !== y.length) throw new ForgeError('E_VALUE', 'wasserstein1: 两样本须等长');\r\n      let s = 0;\r\n      for (let i = 0; i < x.length; i++) s += Math.abs(x[i] - y[i]);\r\n      return s / x.length;\r\n    }\r\n    if (isNum(a) && isNum(b) && isNum(c) && isNum(d)) {\r\n      positive(b, 'sigma1'); positive(d, 'sigma2');\r\n      return Math.abs(a - c); // 正态间 1-Wasserstein 与尺度无关：W1 = |μ1−μ2|\r\n    }\r\n    throw new ForgeError('E_TYPE', 'wasserstein1: 需要 (Tensor,Tensor) 或 (mu1,sigma1,mu2,sigma2)');\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.hellinger', arity: 2,\r\n  sig: '(p: Tensor, q: Tensor) -> number',\r\n  doc: 'Hellinger 距离：H(p,q) = √(½ Σ (√p_i − √q_i)²)',\r\n  ref: 'Jeffreys 1946；Le Cam 1964（Hellinger 距离）',\r\n  inv: '0 ≤ H ≤ 1；H(p,p) = 0；H²(p,q) ≤ TVD(p,q)',\r\n  impl: (p, q) => {\r\n    const P = probVecOf(p, 'p');\r\n    const Q = probVecOf(q, 'q');\r\n    if (P.d.length !== Q.d.length) throw new ForgeError('E_VALUE', 'hellinger: p 与 q 长度须一致');\r\n    let s = 0;\r\n    for (let i = 0; i < P.d.length; i++) {\r\n      const diff = Math.sqrt(P.d[i] / P.s) - Math.sqrt(Q.d[i] / Q.s);\r\n      s += diff * diff;\r\n    }\r\n    return Math.sqrt(0.5 * s);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.info.tvd', arity: 2,\r\n  sig: '(p: Tensor, q: Tensor) -> number',\r\n  doc: '全变差距离：TVD(p,q) = ½ Σ |p_i − q_i|',\r\n  ref: 'Cover & Thomas, Elements of Information Theory（total variation）',\r\n  inv: '0 ≤ TVD ≤ 1；TVD(p,p) = 0',\r\n  impl: (p, q) => {\r\n    const P = probVecOf(p, 'p');\r\n    const Q = probVecOf(q, 'q');\r\n    if (P.d.length !== Q.d.length) throw new ForgeError('E_VALUE', 'tvd: p 与 q 长度须一致');\r\n    let s = 0;\r\n    for (let i = 0; i < P.d.length; i++) s += Math.abs(P.d[i] / P.s - Q.d[i] / Q.s);\r\n    return 0.5 * s;\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 八、矩与统计量（10 条：D6-069 … D6-078）\r\n// 口径说明：variance/std/skewness/kurtosis/cov 均为总体矩（÷n，MLE 口径）；\r\n// kurtosis 为超额峰度（m4/m2² − 3，正态为 0）；quantile 用线性插值（numpy 'linear'）。\r\n// ============================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.mean', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '样本均值：x̄ = (1/n) Σ x_i',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: 'min(data) ≤ mean ≤ max(data)',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    let s = 0;\r\n    for (const v of d) s += v;\r\n    return s / d.length;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.variance', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '样本方差（总体口径）：m2 = (1/n) Σ (x_i − x̄)²',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: 'variance ≥ 0；常数序列为 0',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    return centralMoments(d)[1];\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.std', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '样本标准差（总体口径）：√m2',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: 'std ≥ 0；std² = variance',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    return Math.sqrt(centralMoments(d)[1]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.skewness', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '样本偏度：m3 / m2^{3/2}（总体中心矩口径）',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: '对称分布 ≈ 0；右偏 > 0，左偏 < 0',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    const [, m2, m3] = centralMoments(d);\r\n    if (m2 === 0) return 0;\r\n    return m3 / Math.pow(m2, 1.5);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.kurtosis', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '样本超额峰度：m4 / m2² − 3（正态为 0，均匀为 −1.2）',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: '重尾 > 0；均匀分布 ≈ −1.2',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    const [, m2, , m4] = centralMoments(d);\r\n    if (m2 === 0) return 0;\r\n    return m4 / (m2 * m2) - 3;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.cov', arity: 2,\r\n  sig: '(x: Tensor, y: Tensor) -> number',\r\n  doc: '样本协方差（总体口径）：(1/n) Σ (x_i − x̄)(y_i − ȳ)',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: 'cov(x,x) = variance(x)；两序列须等长',\r\n  impl: (x, y) => {\r\n    const dx = dataOf(x, 'x');\r\n    const dy = dataOf(y, 'y');\r\n    if (dx.length !== dy.length) throw new ForgeError('E_VALUE', `cov: 两序列须等长（${dx.length} vs ${dy.length}）`);\r\n    const n = dx.length;\r\n    let mx = 0, my = 0;\r\n    for (let i = 0; i < n; i++) { mx += dx[i]; my += dy[i]; }\r\n    mx /= n; my /= n;\r\n    let s = 0;\r\n    for (let i = 0; i < n; i++) s += (dx[i] - mx) * (dy[i] - my);\r\n    return s / n;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.corr', arity: 2,\r\n  sig: '(x: Tensor, y: Tensor) -> number',\r\n  doc: 'Pearson 相关系数：cov(x,y) / (σ_x·σ_y)',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: '−1 ≤ corr ≤ 1；corr(x,x) = 1；任一序列为常数时抛 E_NUMERICAL',\r\n  impl: (x, y) => {\r\n    const dx = dataOf(x, 'x');\r\n    const dy = dataOf(y, 'y');\r\n    if (dx.length !== dy.length) throw new ForgeError('E_VALUE', `corr: 两序列须等长（${dx.length} vs ${dy.length}）`);\r\n    const n = dx.length;\r\n    let mx = 0, my = 0;\r\n    for (let i = 0; i < n; i++) { mx += dx[i]; my += dy[i]; }\r\n    mx /= n; my /= n;\r\n    let sxy = 0, sxx = 0, syy = 0;\r\n    for (let i = 0; i < n; i++) {\r\n      const ax = dx[i] - mx, ay = dy[i] - my;\r\n      sxy += ax * ay; sxx += ax * ax; syy += ay * ay;\r\n    }\r\n    if (sxx === 0 || syy === 0) throw new ForgeError('E_NUMERICAL', 'corr: 序列为常数，相关系数无定义');\r\n    return sxy / Math.sqrt(sxx * syy);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.quantile', arity: 2,\r\n  sig: '(data: Tensor, q: number) -> number',\r\n  doc: '分位数（线性插值，numpy \"linear\" 口径）：h = (n−1)q，x_⌊h⌋ + (h−⌊h⌋)(x_⌊h⌋+1 − x_⌊h⌋)',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1（分位数定义）',\r\n  inv: '0 ≤ q ≤ 1；min ≤ quantile ≤ max；关于 q 单调不减',\r\n  impl: (data, q) => {\r\n    const d = dataOf(data);\r\n    unitInterval(q, 'q');\r\n    const xs = Array.from(d).sort((a, b) => a - b);\r\n    const n = xs.length;\r\n    const h = (n - 1) * q;\r\n    const lo = Math.floor(h);\r\n    if (lo >= n - 1) return xs[n - 1];\r\n    return xs[lo] + (h - lo) * (xs[lo + 1] - xs[lo]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.median', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '中位数：quantile(data, 0.5)',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: 'min ≤ median ≤ max；对偶数个取中间两值均值',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    const xs = Array.from(d).sort((a, b) => a - b);\r\n    const n = xs.length;\r\n    const mid = n >> 1;\r\n    return n % 2 === 1 ? xs[mid] : 0.5 * (xs[mid - 1] + xs[mid]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.stat.mad', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '中位数绝对偏差：median(|x_i − median(x)|)',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1（稳健统计量）',\r\n  inv: 'mad ≥ 0；对离群点稳健',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    const xs = Array.from(d).sort((a, b) => a - b);\r\n    const n = xs.length;\r\n    const mid = n >> 1;\r\n    const med = n % 2 === 1 ? xs[mid] : 0.5 * (xs[mid - 1] + xs[mid]);\r\n    const ad = Array.from(d, v => Math.abs(v - med)).sort((a, b) => a - b);\r\n    const m2i = ad.length >> 1;\r\n    return ad.length % 2 === 1 ? ad[m2i] : 0.5 * (ad[m2i - 1] + ad[m2i]);\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 九、贝叶斯与估计（10 条：D6-079 … D6-088）\r\n// ============================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.update', arity: 2,\r\n  sig: '(prior: Tensor, likelihood: Tensor) -> Tensor',\r\n  doc: '贝叶斯更新（离散网格）：后验 ∝ 先验 × 似然，返回归一化后验',\r\n  ref: 'DeGroot, Optimal Statistical Decisions；Gelman et al., Bayesian Data Analysis ch.2',\r\n  inv: 'Σ posterior = 1；两序列等长且非负',\r\n  impl: (prior, likelihood) => {\r\n    const P = dataOf(prior, 'prior');\r\n    const L = dataOf(likelihood, 'likelihood');\r\n    if (P.length !== L.length) throw new ForgeError('E_VALUE', `bayes.update: 先验与似然须等长（${P.length} vs ${L.length}）`);\r\n    const out = new Float64Array(P.length);\r\n    let s = 0;\r\n    for (let i = 0; i < P.length; i++) {\r\n      if (P[i] < 0 || L[i] < 0) throw new ForgeError('E_VALUE', 'bayes.update: 先验与似然不能为负');\r\n      out[i] = P[i] * L[i];\r\n      s += out[i];\r\n    }\r\n    if (!(s > 0)) throw new ForgeError('E_VALUE', 'bayes.update: 先验×似然全为 0，后验无定义');\r\n    for (let i = 0; i < out.length; i++) out[i] /= s;\r\n    return new Tensor(out, P.length === 1 ? [1] : [P.length]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.posteriorPredictive', arity: 2,\r\n  sig: '(posterior: Tensor[k], likelihood: Tensor[k,m]) -> Tensor[m]',\r\n  doc: '后验预测分布：P(x̃|data) = Σ_j posterior_j · L(j, x̃)，likelihood 行对应参数、列对应观测',\r\n  ref: 'DeGroot, Optimal Statistical Decisions；Gelman et al., BDA ch.1',\r\n  inv: '输出非负且（按列）和为 1 当 likelihood 每行归一化时',\r\n  impl: (posterior, likelihood) => {\r\n    const P = dataOf(posterior, 'posterior');\r\n    if (!(likelihood instanceof Tensor) || likelihood.ndim !== 2 || likelihood.shape[0] !== P.length) {\r\n      throw new ForgeError('E_SHAPE', `posteriorPredictive: likelihood 须为 [${P.length}, m] 的 2D Tensor`);\r\n    }\r\n    const L = dataOf(likelihood, 'likelihood');\r\n    const m = likelihood.shape[1];\r\n    let ps = 0;\r\n    for (const v of P) { if (v < 0) throw new ForgeError('E_VALUE', 'posteriorPredictive: 后验不能为负'); ps += v; }\r\n    const out = new Float64Array(m);\r\n    for (let j = 0; j < P.length; j++) {\r\n      const w = P[j] / ps;\r\n      for (let i = 0; i < m; i++) out[i] += w * L[j * m + i];\r\n    }\r\n    return new Tensor(out, [m]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.evidence', arity: 2,\r\n  sig: '(prior: Tensor, likelihood: Tensor) -> number',\r\n  doc: '证据（边际似然）：Z = Σ_i prior_i · likelihood_i，即后验归一化常数',\r\n  ref: 'DeGroot, Optimal Statistical Decisions；Gelman et al., BDA ch.1',\r\n  inv: 'Z ≥ 0；先验已归一化时 Z ∈ [0,1]',\r\n  impl: (prior, likelihood) => {\r\n    const P = dataOf(prior, 'prior');\r\n    const L = dataOf(likelihood, 'likelihood');\r\n    if (P.length !== L.length) throw new ForgeError('E_VALUE', 'evidence: 先验与似然须等长');\r\n    let s = 0;\r\n    for (let i = 0; i < P.length; i++) s += P[i] * L[i];\r\n    return s;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.mapNormal', arity: 4,\r\n  sig: '(data: Tensor, priorMu: number, priorSigma: number, sigma: number) -> number',\r\n  doc: '正态均值 MAP（方差已知 σ²，先验 N(μ0,σ0²)）：μ̂ = (μ0/σ0² + n·x̄/σ²)/(1/σ0² + n/σ²)',\r\n  ref: 'Gelman et al., Bayesian Data Analysis ch.2（正态-正态共轭）',\r\n  inv: 'σ0 > 0，σ > 0；后验为_normal_时 MAP = 后验均值',\r\n  impl: (data, priorMu, priorSigma, sigma) => {\r\n    const d = dataOf(data);\r\n    num(priorMu, 'priorMu'); positive(priorSigma, 'priorSigma'); positive(sigma, 'sigma');\r\n    const n = d.length;\r\n    let xbar = 0;\r\n    for (const v of d) xbar += v;\r\n    xbar /= n;\r\n    const prec = 1 / (priorSigma * priorSigma) + n / (sigma * sigma);\r\n    return (priorMu / (priorSigma * priorSigma) + n * xbar / (sigma * sigma)) / prec;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.mleNormal', arity: 1,\r\n  sig: '(data: Tensor) -> Tensor[2]',\r\n  doc: '正态 MLE：返回 [μ̂, σ̂]，σ̂ 为 ÷n 口径的总体标准差',\r\n  ref: 'Evans & Rosenthal, Probability and Statistics（MLE）',\r\n  inv: 'σ̂ ≥ 0',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    const [m1, m2] = centralMoments(d);\r\n    return Tensor.fromFlat([m1, Math.sqrt(m2)], [2]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.mleBernoulli', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '伯努利 MLE：p̂ = x̄（数据须在 [0,1]）',\r\n  ref: 'Johnson, Kotz & Kemp, Discrete Univariate Distributions',\r\n  inv: '0 ≤ p̂ ≤ 1',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    let s = 0;\r\n    for (const v of d) { unitInterval(v, 'data'); s += v; }\r\n    return s / d.length;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.mlePoisson', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '泊松 MLE：λ̂ = x̄（数据须 ≥ 0）',\r\n  ref: 'Johnson, Kotz & Kemp, Discrete Univariate Distributions',\r\n  inv: 'λ̂ ≥ 0',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    let s = 0;\r\n    for (const v of d) { nonNeg(v, 'data'); s += v; }\r\n    return s / d.length;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.mleExponential', arity: 1,\r\n  sig: '(data: Tensor) -> number',\r\n  doc: '指数 MLE：λ̂ = 1/x̄（数据须 ≥ 0 且均值 > 0）',\r\n  ref: 'Johnson, Kotz & Balakrishnan, Continuous Univariate Distributions, Vol. 1',\r\n  inv: 'λ̂ > 0',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    let s = 0;\r\n    for (const v of d) { nonNeg(v, 'data'); s += v; }\r\n    const mean = s / d.length;\r\n    if (!(mean > 0)) throw new ForgeError('E_VALUE', 'mleExponential: 数据均值为 0，λ̂ 无定义');\r\n    return 1 / mean;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.credibleInterval', arity: null,\r\n  sig: '(mu: number, sigma: number, level: number = 0.95) -> Tensor[2]',\r\n  doc: '正态后验可信区间：[μ ± z_{1−(1−level)/2}·σ]，z 由逆正态分位函数计算',\r\n  ref: 'Gelman et al., Bayesian Data Analysis ch.2（可信区间）',\r\n  inv: 'σ > 0，0 < level < 1；区间关于 μ 对称',\r\n  impl: (mu, sigma, level = 0.95) => {\r\n    num(mu, 'mu'); positive(sigma, 'sigma'); num(level, 'level');\r\n    if (!(level > 0 && level < 1)) throw new ForgeError('E_VALUE', `credibleInterval: level 须在 (0,1)，得到 ${level}`);\r\n    const z = normalQuantileRaw(1 - (1 - level) / 2);\r\n    return Tensor.fromFlat([mu - z * sigma, mu + z * sigma], [2]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.bayes.conjugateNormal', arity: 5,\r\n  sig: '(n: number, xbar: number, priorMu: number, priorSigma: number, dataSigma: number) -> Tensor[2]',\r\n  doc: '正态-正态共轭后验（数据方差已知 σ²）：返回 [μ_n, σ_n]，σ_n² = 1/(1/σ0² + n/σ²)，μ_n = (μ0/σ0² + n·x̄/σ²)·σ_n²',\r\n  ref: 'Gelman et al., Bayesian Data Analysis ch.2；DeGroot, Optimal Statistical Decisions',\r\n  inv: 'n ≥ 0，σ0 > 0，σ > 0；与闭式解逐位一致',\r\n  impl: (n, xbar, priorMu, priorSigma, dataSigma) => {\r\n    nonNeg(n | 0, 'n'); num(xbar, 'xbar'); num(priorMu, 'priorMu'); positive(priorSigma, 'priorSigma'); positive(dataSigma, 'dataSigma');\r\n    const N = n | 0;\r\n    const prec = 1 / (priorSigma * priorSigma) + N / (dataSigma * dataSigma);\r\n    const muN = (priorMu / (priorSigma * priorSigma) + N * xbar / (dataSigma * dataSigma)) / prec;\r\n    return Tensor.fromFlat([muN, 1 / Math.sqrt(prec)], [2]);\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 十、采样方法（6 条：D6-089 … D6-094）\r\n// ============================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.samp.inverseCdf', arity: 4,\r\n  sig: '(seed: number, n: number, xs: Tensor, cdf: Tensor) -> Tensor[n]',\r\n  doc: '通用逆变换采样：对分段线性 CDF（断点 xs/cdf 值）求逆并插值，xs 须严格递增',\r\n  ref: 'Devroye 1986, Non-Uniform Random Variate Generation（inverse CDF method）',\r\n  inv: 'xs 严格递增、cdf 单调不减；同种子可复现',\r\n  impl: (seed, n, xs, cdf) => {\r\n    num(seed, 'seed'); nonNeg(n | 0, 'n');\r\n    const x = dataOf(xs, 'xs');\r\n    const y = dataOf(cdf, 'cdf');\r\n    if (x.length !== y.length) throw new ForgeError('E_SHAPE', `inverseCdf: xs 与 cdf 须等长（${x.length} vs ${y.length}）`);\r\n    if (x.length < 2) throw new ForgeError('E_VALUE', 'inverseCdf: 至少需要 2 个断点');\r\n    for (let i = 1; i < x.length; i++) if (!(x[i] > x[i - 1])) throw new ForgeError('E_VALUE', 'inverseCdf: xs 必须严格递增');\r\n    for (let i = 1; i < y.length; i++) if (y[i] < y[i - 1]) throw new ForgeError('E_VALUE', 'inverseCdf: cdf 值必须单调不减');\r\n    const rng = createRng(seed);\r\n    const out = new Float64Array(n);\r\n    const last = y.length - 1;\r\n    for (let s = 0; s < n; s++) {\r\n      const u = Math.min(Math.max(rng.next(), y[0]), y[last]);\r\n      let lo = 0, hi = last;\r\n      while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (y[mid] <= u) lo = mid; else hi = mid; }\r\n      const dy = y[lo + 1] - y[lo];\r\n      const t = dy > 0 ? (u - y[lo]) / dy : 0;\r\n      out[s] = x[lo] + t * (x[lo + 1] - x[lo]);\r\n    }\r\n    return new Tensor(out, [n]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.samp.rejection', arity: 2,\r\n  sig: '(seed: number, n: number) -> Tensor[n]',\r\n  doc: '拒绝采样生成 N(0,1)：建议分布 Laplace(0,1)，包络常数 M = √(2e/π) ≈ 1.3155，接受率 ≈ 0.76',\r\n  ref: 'von Neumann 1951（拒绝采样）；Marsaglia & Bray 1964（正态的 Laplace 包络）',\r\n  inv: '接受概率 φ(x)/(M·g(x)) ≤ 1；同种子可复现；矩 → (0,1)',\r\n  impl: (seed, n) => {\r\n    num(seed, 'seed'); nonNeg(n | 0, 'n');\r\n    const rng = createRng(seed);\r\n    const M = Math.sqrt(2 * Math.E / Math.PI);\r\n    const out = new Float64Array(n);\r\n    let i = 0;\r\n    while (i < n) {\r\n      const u = rng.next();\r\n      // Laplace(0,1) 逆变换\r\n      const x = u < 0.5 ? Math.log(2 * u) : -Math.log(2 * (1 - u));\r\n      const v = rng.next();\r\n      // φ(x) / g(x) = √(2/π)·e^{−x²/2+|x|} ≤ M（|x|=1 处取等）\r\n      const ratio = Math.sqrt(2 / Math.PI) * Math.exp(-0.5 * x * x + Math.abs(x));\r\n      if (v * M < ratio) out[i++] = x;\r\n    }\r\n    return new Tensor(out, [n]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.samp.metropolis', arity: 3,\r\n  sig: '(seed: number, n: number, step: number) -> Tensor[n]',\r\n  doc: '一维随机游走 Metropolis（目标 N(0,1)）：提议 y = x + step·N(0,1)，接受率 min(1, e^{−(y²−x²)/2})；前 10% 作 burn-in',\r\n  ref: 'Metropolis, Rosenbluth, Rosenbluth, Teller & Teller 1953',\r\n  inv: 'step > 0；同种子可复现；矩 → (0,1)（容差 10%）',\r\n  impl: (seed, n, step) => {\r\n    num(seed, 'seed'); nonNeg(n | 0, 'n'); positive(step, 'step');\r\n    const rng = createRng(seed);\r\n    const g = normalGen(rng);\r\n    const burn = Math.max(1, Math.floor(n / 10));\r\n    let x = 0;\r\n    const out = new Float64Array(n);\r\n    for (let i = 0; i < n + burn; i++) {\r\n      const y = x + step * g();\r\n      // 目标对数密度之差（正态化常数抵消）\r\n      const logRatio = -0.5 * (y * y - x * x);\r\n      let u = rng.next();\r\n      if (u < 1e-300) u = 1e-300;\r\n      if (Math.log(u) < logRatio) x = y;\r\n      if (i >= burn) out[i - burn] = x;\r\n    }\r\n    return new Tensor(out, [n]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.samp.boxMuller', arity: 2,\r\n  sig: '(seed: number, n: number) -> Tensor[n]',\r\n  doc: 'Box-Muller 标准正态：u1,u2 ~ U(0,1)，r = √(−2 ln u1)，z1 = r·cos(2πu2)，z2 = r·sin(2πu2)',\r\n  ref: 'Box & Muller, Annals of Mathematical Statistics 29(2), 1958',\r\n  inv: '同种子完全可复现；大样本矩 → (0,1)',\r\n  impl: (seed, n) => {\r\n    num(seed, 'seed'); nonNeg(n | 0, 'n');\r\n    const rng = createRng(seed);\r\n    const out = new Float64Array(n);\r\n    let i = 0;\r\n    while (i < n) {\r\n      let u1 = rng.next();\r\n      if (u1 < 1e-300) u1 = 1e-300;\r\n      const u2 = rng.next();\r\n      const r = Math.sqrt(-2 * Math.log(u1));\r\n      out[i++] = r * Math.cos(2 * Math.PI * u2);\r\n      if (i < n) out[i++] = r * Math.sin(2 * Math.PI * u2);\r\n    }\r\n    return new Tensor(out, [n]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.samp.marsagliaPolar', arity: 2,\r\n  sig: '(seed: number, n: number) -> Tensor[n]',\r\n  doc: 'Marsaglia 极坐标法标准正态：单位圆盘内取点 (u,v)，s = u²+v²，f = √(−2 ln s/s)，输出 (u·f, v·f)',\r\n  ref: 'Marsaglia & Bray, CACM 7(1), 1964',\r\n  inv: '同种子完全可复现；大样本矩 → (0,1)',\r\n  impl: (seed, n) => {\r\n    num(seed, 'seed'); nonNeg(n | 0, 'n');\r\n    const rng = createRng(seed);\r\n    const out = new Float64Array(n);\r\n    let i = 0;\r\n    while (i < n) {\r\n      const u = rng.range(-1, 1), v = rng.range(-1, 1);\r\n      const s = u * u + v * v;\r\n      if (s >= 1 || s === 0) continue;\r\n      const f = Math.sqrt(-2 * Math.log(s) / s);\r\n      out[i++] = u * f;\r\n      if (i < n) out[i++] = v * f;\r\n    }\r\n    return new Tensor(out, [n]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.samp.stratified', arity: 2,\r\n  sig: '(seed: number, n: number) -> Tensor[n]',\r\n  doc: '分层抽样 U(0,1)：第 i 层 [(i/n), (i+1)/n) 内取一个均匀点，(i+U)/n',\r\n  ref: 'Cochran, Sampling Techniques §5.2（分层抽样/JIPS）',\r\n  inv: '每层恰一个样本；均值估计量方差 = 1/(12n³)（粗蒙特卡洛 1/(12n) 的 1/n²）',\r\n  impl: (seed, n) => {\r\n    num(seed, 'seed'); nonNeg(n | 0, 'n');\r\n    if (n < 1) throw new ForgeError('E_VALUE', 'stratified: n 须 ≥ 1');\r\n    const rng = createRng(seed);\r\n    const out = new Float64Array(n);\r\n    for (let i = 0; i < n; i++) out[i] = (i + rng.next()) / n;\r\n    return new Tensor(out, [n]);\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 十一、拟合检验（4 条：D6-095 … D6-098）\r\n// ============================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.test.ks', arity: null,\r\n  sig: \"(data: Tensor, dist: 'normal'|'uniform'|'exponential', ...params) -> {D, pValue, n}\",\r\n  doc: '一样本 Kolmogorov-Smirnov 检验：D = sup|F_n − F|，p 值用 Massey 1951 渐近式 Q(λ)，λ = (√n+0.12+0.11/√n)·D',\r\n  ref: 'Massey 1951（Kolmogorov 分布临界值）；Stephens 1974（EDF 统计量修正）',\r\n  inv: '0 ≤ D ≤ 1；同分布假设下 p 值近似均匀',\r\n  impl: (data, dist, ...ps) => {\r\n    const d = dataOf(data);\r\n    const n = d.length;\r\n    const sorted = Array.from(d).sort((a, b) => a - b);\r\n    let F;\r\n    if (dist === 'normal') {\r\n      const mu = num(ps[0], 'mu'), sigma = positive(ps[1], 'sigma');\r\n      F = (x) => normCdf((x - mu) / sigma);\r\n    } else if (dist === 'uniform') {\r\n      const a = num(ps[0], 'a'), b = num(ps[1], 'b');\r\n      if (!(b > a)) throw new ForgeError('E_VALUE', 'ks: uniform 需要 b > a');\r\n      F = (x) => (x < a ? 0 : x > b ? 1 : (x - a) / (b - a));\r\n    } else if (dist === 'exponential') {\r\n      const rate = positive(ps[0], 'rate');\r\n      F = (x) => (x < 0 ? 0 : -Math.expm1(-rate * x));\r\n    } else {\r\n      throw new ForgeError('E_VALUE', `ks: 不支持的参考分布 \"${dist}\"（支持 normal / uniform / exponential）`);\r\n    }\r\n    let D = 0;\r\n    for (let i = 0; i < n; i++) {\r\n      const f = F(sorted[i]);\r\n      // 经验 CDF 在 x_(i) 处为 (i+1)/n，左极限为 i/n\r\n      D = Math.max(D, (i + 1) / n - f, f - i / n);\r\n    }\r\n    return { D, pValue: ksPValue(D, n), n };\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.test.ks2Sample', arity: 2,\r\n  sig: '(x: Tensor, y: Tensor) -> {D, pValue, n1, n2}',\r\n  doc: '两样本 Kolmogorov-Smirnov 检验：D = sup|F1 − F2|，有效样本量 ne = n1·n2/(n1+n2)，p 值同 Massey 渐近式',\r\n  ref: 'Smirnov 1939；Massey 1951（两样本 KS 分布）',\r\n  inv: '0 ≤ D ≤ 1；同分布假设下 p 值近似均匀',\r\n  impl: (x, y) => {\r\n    const dx = Array.from(dataOf(x, 'x')).sort((a, b) => a - b);\r\n    const dy = Array.from(dataOf(y, 'y')).sort((a, b) => a - b);\r\n    const n1 = dx.length, n2 = dy.length;\r\n    const all = [...new Set([...dx, ...dy])].sort((a, b) => a - b);\r\n    let D = 0;\r\n    let i = 0, j = 0;\r\n    for (const v of all) {\r\n      while (i < n1 && dx[i] <= v) i++;\r\n      while (j < n2 && dy[j] <= v) j++;\r\n      D = Math.max(D, Math.abs(i / n1 - j / n2));\r\n    }\r\n    const ne = (n1 * n2) / (n1 + n2);\r\n    return { D, pValue: ksPValue(D, ne), n1, n2 };\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.test.chi2Gof', arity: 2,\r\n  sig: '(observed: Tensor, expected: Tensor) -> {statistic, df, pValue}',\r\n  doc: '卡方拟合优度检验：χ² = Σ (O_i − n·p_i)²/(n·p_i)，df = K−1，p = Q(df/2, χ²/2)（上不完全伽马）',\r\n  ref: 'Pearson 1900（卡方准则）；Cochran 1952（GOF 适用条件）',\r\n  inv: 'χ² ≥ 0；p ∈ [0,1]；观测与期望概率等长',\r\n  impl: (observed, expected) => {\r\n    const O = dataOf(observed, 'observed');\r\n    const { d: E, s } = probVecOf(expected, 'expected');\r\n    if (O.length !== E.length) throw new ForgeError('E_VALUE', `chi2Gof: 观测与期望须等长（${O.length} vs ${E.length}）`);\r\n    let n = 0;\r\n    for (const v of O) { nonNeg(v, 'observed'); n += v; }\r\n    if (!(n > 0)) throw new ForgeError('E_VALUE', 'chi2Gof: 观测总数须 > 0');\r\n    let stat = 0;\r\n    for (let i = 0; i < O.length; i++) {\r\n      const ei = n * (E[i] / s);\r\n      if (ei <= 0) throw new ForgeError('E_VALUE', 'chi2Gof: 期望频数须 > 0');\r\n      stat += (O[i] - ei) ** 2 / ei;\r\n    }\r\n    const df = O.length - 1;\r\n    const pValue = df >= 1 ? gammaq(df / 2, stat / 2) : NaN;\r\n    return { statistic: stat, df, pValue };\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.test.jarqueBera', arity: 1,\r\n  sig: '(data: Tensor) -> {statistic, pValue, skewness, kurtosis}',\r\n  doc: 'Jarque-Bera 正态性检验：JB = (n/6)(S² + K²/4)，S 为偏度、K 为超额峰度；p = e^{−JB/2}（χ²₂ 生存函数）',\r\n  ref: 'Jarque & Bera, International Statistical Review 55(2), 1987',\r\n  inv: 'JB ≥ 0；正态样本 JB → χ²₂；p ∈ [0,1]',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    const n = d.length;\r\n    if (n < 4) throw new ForgeError('E_VALUE', 'jarqueBera: 样本量须 ≥ 4');\r\n    const [, m2, m3, m4] = centralMoments(d);\r\n    if (m2 === 0) return { statistic: 0, pValue: 1, skewness: 0, kurtosis: 0 };\r\n    const S = m3 / Math.pow(m2, 1.5);\r\n    const K = m4 / (m2 * m2) - 3;\r\n    const jb = (n / 6) * (S * S + K * K / 4);\r\n    return { statistic: jb, pValue: Math.exp(-jb / 2), skewness: S, kurtosis: K };\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 十二、数值工具（4 条：D6-099 … D6-102）\r\n// ============================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.util.trapz', arity: null,\r\n  sig: '(y: Tensor, x?: Tensor) -> number',\r\n  doc: '复合梯形积分：Σ ½(y_i + y_{i−1})·Δx；省略 x 时按单位间距',\r\n  ref: '数值分析复合梯形公式（误差 O(h²)）',\r\n  inv: 'x 省略或与 y 等长且严格递增',\r\n  impl: (y, x = undefined) => {\r\n    const ys = dataOf(y, 'y');\r\n    let xs = null;\r\n    if (x !== undefined) {\r\n      if (!(x instanceof Tensor)) throw new ForgeError('E_TYPE', `x: 期望 Tensor，得到 ${typeof x}`);\r\n      xs = dataOf(x, 'x');\r\n      if (xs.length !== ys.length) throw new ForgeError('E_SHAPE', `trapz: x 与 y 须等长（${xs.length} vs ${ys.length}）`);\r\n      for (let i = 1; i < xs.length; i++) if (!(xs[i] > xs[i - 1])) throw new ForgeError('E_VALUE', 'trapz: x 必须严格递增');\r\n    }\r\n    let s = 0;\r\n    for (let i = 1; i < ys.length; i++) s += 0.5 * (ys[i] + ys[i - 1]) * (xs ? xs[i] - xs[i - 1] : 1);\r\n    return s;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.util.normalQuantile', arity: 1,\r\n  sig: '(p: number) -> number',\r\n  doc: '逆正态分位函数 Φ⁻¹(p)：Acklam 有理逼近 + Halley 修正，精度 ~1e-12',\r\n  ref: 'P.J. Acklam（Beasley-Springer-Moro 族逆正态算法）；Halley 迭代',\r\n  inv: '0 < p < 1；单调递增；normalQuantile(Φ(x)) ≈ x',\r\n  impl: (p) => {\r\n    num(p, 'p');\r\n    if (!(p > 0 && p < 1)) throw new ForgeError('E_VALUE', `normalQuantile: p 须在 (0,1)，得到 ${p}`);\r\n    return normalQuantileRaw(p);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.util.distSummary', arity: null,\r\n  sig: \"(dist: string, ...params) -> {dist, params, mean, variance, entropy}\",\r\n  doc: '分布摘要（均值/方差/熵，nat）：支持 normal/uniform/exponential/laplace/logistic/gamma/beta/pareto/rayleigh/weibull/chi2',\r\n  ref: 'Johnson, Kotz & Balakrishnan, Continuous Univariate Distributions（各分布矩与熵闭式）',\r\n  inv: 'variance ≥ 0；熵对集中分布可为负（微分熵性质）',\r\n  impl: (dist, ...ps) => {\r\n    let mean = 0, variance = 0, entropy = 0;\r\n    if (dist === 'normal') {\r\n      const mu = num(ps[0], 'mu'), sigma = positive(ps[1], 'sigma');\r\n      mean = mu; variance = sigma * sigma; entropy = 0.5 * Math.log(2 * Math.PI * Math.E * variance);\r\n    } else if (dist === 'uniform') {\r\n      const a = num(ps[0], 'a'), b = num(ps[1], 'b');\r\n      if (!(b > a)) throw new ForgeError('E_VALUE', 'distSummary: uniform 需要 b > a');\r\n      mean = 0.5 * (a + b); variance = (b - a) ** 2 / 12; entropy = Math.log(b - a);\r\n    } else if (dist === 'exponential') {\r\n      const rate = positive(ps[0], 'rate');\r\n      mean = 1 / rate; variance = 1 / (rate * rate); entropy = 1 - Math.log(rate);\r\n    } else if (dist === 'laplace') {\r\n      const mu = num(ps[0], 'mu'), b = positive(ps[1], 'b');\r\n      mean = mu; variance = 2 * b * b; entropy = 1 + Math.log(2 * b);\r\n    } else if (dist === 'logistic') {\r\n      const mu = num(ps[0], 'mu'), s = positive(ps[1], 's');\r\n      mean = mu; variance = Math.PI * Math.PI * s * s / 3; entropy = 2 + Math.log(s);\r\n    } else if (dist === 'gamma') {\r\n      const k = positive(ps[0], 'shape'), rate = positive(ps[1], 'rate');\r\n      mean = k / rate; variance = k / (rate * rate);\r\n      entropy = k - Math.log(rate) + lgamma(k) + (1 - k) * digamma(k);\r\n    } else if (dist === 'beta') {\r\n      const a = positive(ps[0], 'a'), b = positive(ps[1], 'b');\r\n      mean = a / (a + b); variance = a * b / ((a + b) ** 2 * (a + b + 1));\r\n      entropy = lgamma(a) + lgamma(b) - lgamma(a + b)\r\n        - (a - 1) * digamma(a) - (b - 1) * digamma(b) + (a + b - 2) * digamma(a + b);\r\n    } else if (dist === 'pareto') {\r\n      const xm = positive(ps[0], 'xm'), alpha = num(ps[1], 'alpha');\r\n      if (!(alpha > 2)) throw new ForgeError('E_VALUE', `distSummary: pareto 方差要求 alpha > 2，得到 ${alpha}`);\r\n      mean = alpha * xm / (alpha - 1);\r\n      variance = alpha * xm * xm / ((alpha - 1) ** 2 * (alpha - 2));\r\n      entropy = Math.log(xm / alpha) + 1 + 1 / alpha;\r\n    } else if (dist === 'rayleigh') {\r\n      const sigma = positive(ps[0], 'sigma');\r\n      mean = sigma * Math.sqrt(Math.PI / 2);\r\n      variance = (4 - Math.PI) / 2 * sigma * sigma;\r\n      entropy = 1 + Math.log(sigma / Math.SQRT2) + EULER_GAMMA / 2;\r\n    } else if (dist === 'weibull') {\r\n      const k = positive(ps[0], 'shape'), scale = positive(ps[1], 'scale');\r\n      const g1 = Math.exp(lgamma(1 + 1 / k));\r\n      mean = scale * g1;\r\n      variance = scale * scale * (Math.exp(lgamma(1 + 2 / k)) - g1 * g1);\r\n      entropy = EULER_GAMMA * (1 - 1 / k) + Math.log(scale / k) + 1;\r\n    } else if (dist === 'chi2') {\r\n      const df = positive(ps[0], 'df');\r\n      mean = df; variance = 2 * df;\r\n      entropy = Math.log(2 * Math.exp(lgamma(df / 2))) + (1 - df / 2) * digamma(df / 2) + df / 2;\r\n    } else {\r\n      throw new ForgeError('E_VALUE', `distSummary: 不支持的分布 \"${dist}\"`);\r\n    }\r\n    return { dist, params: ps.slice(), mean, variance, entropy };\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: 6, name: 'prob.util.sampleMoments', arity: 1,\r\n  sig: '(data: Tensor) -> {mean, variance, skewness, kurtosis}',\r\n  doc: '样本矩摘要（总体口径）：均值、方差、偏度 m3/m2^{3/2}、超额峰度 m4/m2² − 3，供与理论矩对比',\r\n  ref: 'Kendall & Stuart, The Advanced Theory of Statistics, Vol.1',\r\n  inv: '方差为 0 时 skewness/kurtosis 记为 0',\r\n  impl: (data) => {\r\n    const d = dataOf(data);\r\n    const [m1, m2, m3, m4] = centralMoments(d);\r\n    return {\r\n      mean: m1,\r\n      variance: m2,\r\n      skewness: m2 === 0 ? 0 : m3 / Math.pow(m2, 1.5),\r\n      kurtosis: m2 === 0 ? 0 : m4 / (m2 * m2) - 3,\r\n    };\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 底部自检：本域必须恰好注册 102 条指令，否则导入即抛错。\r\n// ============================================================================\r\nif (opsByDomain(6).length !== 102) {\r\n  throw new ForgeError('E_VALUE', `D6 域应注册 102 条微指令，实际 ${opsByDomain(6).length}`);\r\n}\r\n",
"src/ops/d7-ml.mjs":"// 域7 机器学习 ML（102 条微指令）\r\n// 对标：scikit-learn 经典估计器族（linear_model / naive_bayes / tree / ensemble /\r\n//       svm / neighbors / cluster / decomposition / preprocessing / feature_selection / metrics），\r\n//       统计侧参考 Hastie, Tibshirani & Friedman《Elements of Statistical Learning》2nd ed. (2009)。\r\n// 组织：A 回归 12 / B 线性分类 10 / C 判别与朴素贝叶斯 8 / D 树与集成 14 / E SVM 与核 10 /\r\n//       F 近邻 4 / G 聚类 13 / H 降维 8 / I 预处理 9 / J 特征选择 3 / K 指标 7 / L 工具 4 = 102。\r\n// 约定：\r\n//   1) fit 返回可 JSON 序列化的纯对象 state（内部数组一律普通 Array，不用 Float64Array）；\r\n//   2) predict 统一签名 (state, X)；\r\n//   3) 预处理类指令返回 {X: Tensor, ...参数}，便于逆变换与管线复用；\r\n//   4) 随机数一律来自 createRng(seed)（PCG32），禁止 Math.random；\r\n//   5) 数值稳健：log/除零 eps 保护、softmax 减最大值、协方差加 ridge 再 Cholesky。\r\n// 依赖：仅 src/core 与 src/ops/d3-linalg.mjs（D3 <- D7 分层）。\r\nimport { defineOp, opsByDomain, exec } from '../core/registry.mjs';\r\nimport { ForgeError } from '../core/errors.mjs';\r\nimport { Tensor, expectTensor, expectNumber, createRng } from '../core/index.mjs';\r\nimport '../ops/d3-linalg.mjs';\r\n\r\nconst D = 7;\r\nlet _s = 0;\r\nconst nid = () => `D${D}-${String(++_s).padStart(3, '0')}`;\r\n\r\n// =====================================================================\r\n// 零、内部小工具（非指令）\r\n// =====================================================================\r\nconst _EPS = 1e-12;\r\n\r\nfunction _asMat(X, who = 'X') {\r\n  expectTensor(X, who);\r\n  if (X.ndim === 1) return X.reshape(X.shape[0], 1);\r\n  if (X.ndim !== 2) throw new ForgeError('E_SHAPE', `${who} 需为 1D/2D Tensor，当前 [${X.shape}]`);\r\n  return X;\r\n}\r\n\r\nfunction _asVec(v, who = 'y') {\r\n  expectTensor(v, who);\r\n  if (v.ndim === 2 && (v.shape[0] === 1 || v.shape[1] === 1)) return v.flatten();\r\n  if (v.ndim !== 1) throw new ForgeError('E_SHAPE', `${who} 需为向量 Tensor，当前 [${v.shape}]`);\r\n  return v;\r\n}\r\n\r\n// Tensor[n,d] -> number[][]\r\nfunction _rows(X) {\r\n  const [n, d] = X.shape;\r\n  const out = new Array(n);\r\n  for (let i = 0; i < n; i++) {\r\n    const r = new Array(d);\r\n    for (let j = 0; j < d; j++) r[j] = X.data[i * d + j];\r\n    out[i] = r;\r\n  }\r\n  return out;\r\n}\r\n\r\n// number[][] -> Tensor[n,d]\r\nfunction _T2(rows) {\r\n  const n = rows.length;\r\n  if (n === 0) throw new ForgeError('E_SHAPE', '空矩阵不可构造 Tensor');\r\n  const d = rows[0].length;\r\n  const flat = new Float64Array(n * d);\r\n  for (let i = 0; i < n; i++) {\r\n    if (rows[i].length !== d) throw new ForgeError('E_SHAPE', '矩阵行长度不一致');\r\n    for (let j = 0; j < d; j++) flat[i * d + j] = rows[i][j];\r\n  }\r\n  return new Tensor(flat, [n, d]);\r\n}\r\n\r\nconst _T1 = (a) => new Tensor(Float64Array.from(a), [a.length]);\r\nconst _flat = (t) => Array.from(t.data);\r\nconst _dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };\r\nconst _sum = (a) => { let s = 0; for (const v of a) s += v; return s; };\r\nconst _mean = (a) => (a.length ? _sum(a) / a.length : 0);\r\nconst _clone = (a) => a.slice();\r\n\r\nfunction _dist2(a, b) {\r\n  let s = 0;\r\n  for (let i = 0; i < a.length; i++) { const t = a[i] - b[i]; s += t * t; }\r\n  return s;\r\n}\r\nfunction _dist1(a, b) {\r\n  let s = 0;\r\n  for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);\r\n  return s;\r\n}\r\n\r\n// 列均值 / 列样本标准差\r\nfunction _colMean(R, d) {\r\n  const m = new Array(d).fill(0);\r\n  for (const r of R) for (let j = 0; j < d; j++) m[j] += r[j];\r\n  for (let j = 0; j < d; j++) m[j] /= R.length;\r\n  return m;\r\n}\r\nfunction _center(R, m) { return R.map((r) => r.map((v, j) => v - m[j])); }\r\n\r\n// 线性求解：优先 Cholesky（SPD），失败回退 LU；ridge 加到对角\r\nfunction _solve(M, b, ridge = 0) {\r\n  const p = M.length;\r\n  const A = M.map((row, i) => row.map((v, j) => v + (i === j ? ridge : 0)));\r\n  try {\r\n    return _flat(exec('linalg.solveSPD', [_T2(A), _T1(b)]));\r\n  } catch {\r\n    return _flat(exec('linalg.solve', [_T2(A), _T1(b)]));\r\n  }\r\n}\r\n\r\n// 最小二乘（QR 路径，秩亏回退 SVD 伪逆）\r\nfunction _lstsq(A, b) {\r\n  const r = exec('linalg.lstsq', [_T2(A), _T1(b)]);\r\n  return _flat(r.x);\r\n}\r\n\r\n// 对称特征分解：返回 {values: number[], vectors: number[][]}（vectors[k] = 第 k 个特征向量，按列取）\r\nfunction _eigSym(M) {\r\n  const r = exec('linalg.eigenSym', [_T2(M)]);\r\n  const values = Array.from(r.values.data);\r\n  const V = _rows(r.vectors);\r\n  const p = values.length;\r\n  const vectors = new Array(p);\r\n  for (let k = 0; k < p; k++) {\r\n    const v = new Array(p);\r\n    for (let i = 0; i < p; i++) v[i] = V[i][k];\r\n    vectors[k] = v;\r\n  }\r\n  return { values, vectors };\r\n}\r\n\r\n// 矩阵逆（回退：岭正则后再求逆）\r\nfunction _inv(M) {\r\n  try { return _rows(exec('linalg.inverse', [_T2(M)])); } catch { return null; }\r\n}\r\n\r\nfunction _choleskyLogDet(M) {\r\n  try {\r\n    const L = exec('linalg.cholesky', [_T2(M)]);\r\n    let ld = 0;\r\n    for (let i = 0; i < M.length; i++) {\r\n      const v = L.data[i * M.length + i];\r\n      ld += 2 * Math.log(Math.max(v, 1e-300));\r\n    }\r\n    return ld;\r\n  } catch { return 0; }\r\n}\r\n\r\n// 稳定 sigmoid（分象限避免 exp 溢出）\r\nfunction _sigmoid(z) {\r\n  return z >= 0 ? 1 / (1 + Math.exp(-z)) : Math.exp(z) / (1 + Math.exp(z));\r\n}\r\n\r\n// 稳定 softmax（减最大值），in-place 写入 out，返回行和\r\nfunction _softmaxRow(z, out) {\r\n  let mx = -Infinity;\r\n  for (const v of z) if (v > mx) mx = v;\r\n  let s = 0;\r\n  for (let k = 0; k < z.length; k++) { const e = Math.exp(z[k] - mx); out[k] = e; s += e; }\r\n  if (!(s > 0)) { for (let k = 0; k < z.length; k++) out[k] = 1 / z.length; return 1; }\r\n  for (let k = 0; k < z.length; k++) out[k] /= s;\r\n  return s;\r\n}\r\n\r\n// 二分类标签规范化：返回 {neg, pos, t: 0/1 数组}\r\nfunction _binLabels(ys) {\r\n  const uniq = Array.from(new Set(ys)).sort((a, b) => a - b);\r\n  if (uniq.length !== 2) {\r\n    throw new ForgeError('E_VALUE', `二分类需要恰好 2 个不同标签，实际 ${uniq.length} 个`);\r\n  }\r\n  const neg = uniq[0], pos = uniq[1];\r\n  return { neg, pos, t: ys.map((v) => (v === pos ? 1 : 0)) };\r\n}\r\n\r\n// 类别清单（升序 _autoGamma(R) {\r\n  const ds = [];\r\n  for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) ds.push(_dist2(R[i], R[j]));\r\n  ds.sort((a, b) => a - b);\r\n  const med = ds.length ? ds[Math.floor(ds.length / 2)] : 1;\r\n  return 1 / (2 * Math.max(med, 1e-12));\r\n}\r\n\r\n// 调整兰德指数（ARI）\r\nfunction _ari(a, b) {\r\n  const n = a.length;\r\n  if (n !== b.length) throw new ForgeError('E_SHAPE', `ARI 标签长度不符: ${n} vs ${b.length}`);\r\n  const cc = new Map(), ca = new Map(), cb = new Map();\r\n  for (let i = 0; i < n; i++) {\r\n    const key = `${a[i]}|${b[i]}`;\r\n    cc.set(key, (cc.get(key) || 0) + 1);\r\n    ca.set(a[i], (ca.get(a[i]) || 0) + 1);\r\n    cb.set(b[i], (cb.get(b[i]) || 0) + 1);\r\n  }\r\n  const C2 = (v) => v * (v - 1) / 2;\r\n  let sIJ = 0;\r\n  for (const v of cc.values()) sIJ += C2(v);\r\n  let sA = 0;\r\n  for (const v of ca.values()) sA += C2(v);\r\n  let sB = 0;\r\n  for (const v of cb.values()) sB += C2(v);\r\n  const comb = C2(n);\r\n  if (comb === 0) return 0;\r\n  const exp = (sA * sB) / comb;\r\n  const max = (sA + sB) / 2;\r\n  if (Math.abs(max - exp) < 1e-15) return 0;\r\n  return (sIJ - exp) / (max - exp);\r\n}\r\n\r\n// 轮廓系数（逐样本）\r\nfunction _silhouetteSamples(R, labels) {\r\n  const n = R.length;\r\n  const D = Array.from({ length: n }, () => new Array(n).fill(0));\r\n  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {\r\n    const v = Math.sqrt(_dist2(R[i], R[j]));\r\n    D[i][j] = v; D[j][i] = v;\r\n  }\r\n  const groups = new Map();\r\n  for (let i = 0; i < n; i++) {\r\n    if (!groups.has(labels[i])) groups.set(labels[i], []);\r\n    groups.get(labels[i]).push(i);\r\n  }\r\n  const out = new Array(n).fill(0);\r\n  if (groups.size < 2) return out;\r\n  for (let i = 0; i < n; i++) {\r\n    const own = groups.get(labels[i]);\r\n    let a = 0;\r\n    for (const j of own) if (j !== i) a += D[i][j];\r\n    a = own.length > 1 ? a / (own.length - 1) : 0;\r\n    let b = Infinity;\r\n    for (const [lab, mem] of groups) {\r\n      if (lab === labels[i]) continue;\r\n      let s = 0;\r\n      for (const j of mem) s += D[i][j];\r\n      b = Math.min(b, s / mem.length);\r\n    }\r\n    const den = Math.max(a, b);\r\n    out[i] = den > 0 ? (b - a) / den : 0;\r\n  }\r\n  return out;\r\n}\r\n\r\n// 等宽离散化（用于互信息估计）\r\nfunction _discretize(a, bins) {\r\n  let mn = Infinity, mx = -Infinity;\r\n  for (const v of a) { if (v < mn) mn = v; if (v > mx) mx = v; }\r\n  if (!(mx > mn)) return a.map(() => 0);\r\n  const w = (mx - mn) / bins;\r\n  return a.map((v) => Math.min(bins - 1, Math.max(0, Math.floor((v - mn) / w - 1e-12))));\r\n}\r\n\r\n// 熵（自然对数）\r\nfunction _entropy(counts, total) {\r\n  let h = 0;\r\n  for (const v of counts) if (v > 0) { const p = v / total; h -= p * Math.log(p); }\r\n  return h;\r\n}\r\n\r\n// —— A 组公用：把 X 增广为 [1, x] 并做最小二乘 ——\r\nfunction _linregCore(X, y) {\r\n  const R = _rows(X), ys = _flat(y);\r\n  const A = R.map((r) => [1, ...r]);\r\n  const w = _lstsq(A, ys);\r\n  return { R, ys, intercept: w[0], coef: w.slice(1), w };\r\n}\r\n\r\n// —— 逻辑回归：阻尼牛顿（IRLS）+ Armijo 回溯 ——\r\nfunction _logLoss(A, t, w) {\r\n  let L = 0;\r\n  for (let i = 0; i < A.length; i++) {\r\n    const p = Math.min(1 - 1e-15, Math.max(1e-15, _sigmoid(_dot(w, A[i]))));\r\n    L -= t[i] * Math.log(p) + (1 - t[i]) * Math.log(1 - p);\r\n  }\r\n  return L;\r\n}\r\nfunction _fitLogReg(A, t, iters, ridge) {\r\n  const n = A.length, p = A[0].length;\r\n  let w = new Array(p).fill(0);\r\n  let L = _logLoss(A, t, w);\r\n  const maxIt = iters === undefined ? 100 : Math.max(1, Math.floor(iters));\r\n  for (let it = 0; it < maxIt; it++) {\r\n    const pr = new Array(n);\r\n    for (let i = 0; i < n; i++) pr[i] = _sigmoid(_dot(w, A[i]));\r\n    const g = new Array(p).fill(0);\r\n    for (let i = 0; i < n; i++) {\r\n      const e = pr[i] - t[i], r = A[i];\r\n      for (let j = 0; j < p; j++) g[j] += e * r[j];\r\n    }\r\n    let gn = 0;\r\n    for (const v of g) gn += v * v;\r\n    gn = Math.sqrt(gn);\r\n    if (gn < 1e-12) break;\r\n    const H = Array.from({ length: p }, () => new Array(p).fill(0));\r\n    for (let i = 0; i < n; i++) {\r\n      const ww = Math.max(pr[i] * (1 - pr[i]), 1e-10), r = A[i];\r\n      for (let a = 0; a < p; a++) {\r\n        const ra = r[a];\r\n        if (ra === 0) continue;\r\n        for (let b = a; b < p; b++) H[a][b] += ww * ra * r[b];\r\n      }\r\n    }\r\n    for (let a = 0; a < p; a++) {\r\n      for (let b = a + 1; b < p; b++) H[b][a] = H[a][b];\r\n      H[a][a] += ridge;\r\n    }\r\n    let dir;\r\n    try {\r\n      const s = _solve(H, g, 0);\r\n      dir = s.map((v) => -v);\r\n    } catch {\r\n      dir = g.map((v) => -v / Math.max(1, gn));\r\n    }\r\n    if (!dir.every(Number.isFinite)) dir = g.map((v) => -v / Math.max(1, gn));\r\n    let nl = _logLoss(A, t, w.map((v, i) => v + dir[i]));\r\n    let tries = 0;\r\n    while (!(nl < L) && tries < 40) {\r\n      dir = dir.map((v) => v * 0.5);\r\n      nl = _logLoss(A, t, w.map((v, i) => v + dir[i]));\r\n      tries++;\r\n    }\r\n    if (!(nl < L)) break;\r\n    const nw = w.map((v, i) => v + dir[i]);\r\n    if (!nw.every(Number.isFinite)) break;\r\n    const drop = L - nl;\r\n    w = nw; L = nl;\r\n    if (L < 1e-14 || drop < 1e-16) break;\r\n  }\r\n  return { w, loss: L };\r\n}\r\n\r\n// =====================================================================\r\n// 一、A 回归（12 条）：linreg / ridge / lasso / elasticNet / poly / robust\r\n// =====================================================================\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.linreg.fit', arity: 2,\r\n  sig: '(Tensor X[n,d], Tensor y[n]) -> object state',\r\n  doc: '普通最小二乘闭式解（增广截距列后走 QR 最小二乘）',\r\n  ref: 'Gauss 1809 / Legendre 1805；Golub & Van Loan《Matrix Computations》§5.3',\r\n  inv: '残差正交于设计矩阵：Aᵀ(y−Aŵ)≈0（A=[1,X]）',\r\n  impl: (X, y) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    if (n < 1) throw new ForgeError('E_VALUE', '至少需要 1 个样本');\r\n    const { R, ys, intercept, coef } = _linregCore(X, y);\r\n    const fitted = R.map((r) => intercept + _dot(coef, r));\r\n    return { kind: 'ml.linreg', n, d, intercept, coef, fitted, rank: Math.min(n, d + 1) };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.linreg.predict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor y[m]',\r\n  doc: '线性回归预测 ŷ = intercept + X·coef',\r\n  ref: 'Hastie, Tibshirani & Friedman, ESL 2nd ed., 2009, §3.2',\r\n  inv: 'predict(fit(X,y), X) 等于 fit 时的 fitted 值',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    return _T1(R.map((r) => state.intercept + _dot(state.coef, r)));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.ridge.fit', arity: 3,\r\n  sig: '(Tensor X[n,d], Tensor y[n], number lambda=1) -> object state',\r\n  doc: '岭回归：最小化 (1/(2n))‖Xw−y‖² + (λ/2)‖w‖²，即解 (XᵀX+nλI)w=Xᵀy（Cholesky）',\r\n  ref: 'Hoerl & Kennard, Ridge Regression: Biased Estimation for Nonorthogonal Problems, 1970',\r\n  inv: 'λ→0 时退化为普通最小二乘；λ→∞ 时系数趋于 0；λ 与样本量无关（按样本平均的目标）',\r\n  impl: (X, y, lambda) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const lam = lambda === undefined ? 1 : expectNumber(lambda, 'lambda');\r\n    if (lam < 0) throw new ForgeError('E_VALUE', `lambda 必须 >= 0，当前 ${lam}`);\r\n    const R = _rows(X), ys = _flat(y);\r\n    const mx = _colMean(R, d), my = _mean(ys);\r\n    const Rc = _center(R, mx), yc = ys.map((v) => v - my);\r\n    const G = Array.from({ length: d }, () => new Array(d).fill(0));\r\n    for (let a = 0; a < d; a++) for (let b = a; b < d; b++) {\r\n      let s = 0;\r\n      for (const r of Rc X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const ys = _flat(y);\r\n    const classes = _classesOf(ys);\r\n    const K = classes.length;\r\n    if (K < 2) throw new ForgeError('E_VALUE', 'softmax 需要至少 2 个类别');\r\n    const eta = lr === undefined ? 0.1 : expectNumber(lr, 'lr');\r\n    if (!(eta > 0)) throw new ForgeError('E_VALUE', `lr 必须 > 0，当前 ${eta}`);\r\n    const maxIt = iters === undefined ? 500 : Math.max(1, Math.floor(iters));\r\n    const A = _rows(X).map((r) => [1, ...r]);\r\n    const p = d + 1;\r\n    const W = Array.from({ length: p }, () => new Array(K).fill(0));\r\n    const probs = new Array(K);\r\n    let loss = 0;\r\n    for (let it = 0; it < maxIt; it++) {\r\n      const G = Array.from({ length: p }, () => new Array(K).fill(0));\r\n      loss = 0;\r\n      for (let i = 0; i < n; i++) {\r\n        const z = new Array(K);\r\n        for (let k = 0; k < K; k++) z[k] = _dot(W.map((row) => row[k]), A[i]);\r\n        _softmaxRow(z, probs);\r\n        const ti = classes.indexOf(ys[i]);\r\n        loss -= Math.log(Math.max(probs[ti], 1e-300));\r\n        for (let k = 0; k < K; k++) {\r\n          const e = probs[k] - (k === ti ? 1 : 0);\r\n          for (let j = 0; j < p; j++) G[j][k] += e * A[i][j];\r\n        }\r\n      }\r\n      for (let j = 0; j < p; j++) for (let k = 0; k < K; k++) W[j][k] -= (eta / n) * G[j][k];\r\n      loss /= n;\r\n    }\r\n    return { kind: 'ml.softmax', n, d, classes, W, loss, lr: eta, iters: maxIt };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.softmax.predict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor labels[m]',\r\n  doc: 'softmax 回归硬分类（返回原始类别值）',\r\n  ref: 'Bridle 1990',\r\n  inv: '预测标签必属于 state.classes',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    const classes = state.classes, K = classes.length, W = state.W;\r\n    const probs = new Array(K);\r\n    const z = new Array(K);\r\n    return _T1(R.map((r) => {\r\n      const a = [1, ...r];\r\n      for (let k = 0; k < K; k++) z[k] = _dot(W.map((row) => row[k]), a);\r\n      _softmaxRow(z, probs);\r\n      let bi = 0;\r\n      for (let k = 1; k < K; k++) if (probs[k] > probs[bi]) bi = k;\r\n      return classes[bi];\r\n    }));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.softmax.predictProba', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor P[m,K]',\r\n  doc: 'softmax 回归类后验概率矩阵',\r\n  ref: 'Bridle 1990；Bishop PRML §4.3.4',\r\n  inv: '每行元素非负且和为 1',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    const classes = state.classes, K = classes.length, W = state.W;\r\n    const out = new Float64Array(R.length * K);\r\n    const probs = new Array(K), z = new Array(K);\r\n    R.forEach((r, i) => {\r\n      const a = [1, ...r];\r\n      for (let k = 0; k < K; k++) z[k] = _dot(W.map((row) => row[k]), a);\r\n      _softmaxRow(z, probs);\r\n      for (let k = 0; k < K; k++) out[i * K + k] = probs[k];\r\n    });\r\n    return new Tensor(out, [R.length, K]);\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.perceptron.fit', arity: 4,\r\n  sig: '(Tensor X[n,d], Tensor y[n], number lr=0.1, number epochs=200) -> object state',\r\n  doc: '经典感知机：错分即更新 w ← w + η·y·x',\r\n  ref: 'Rosenblatt, The Perceptron: A Probabilistic Model for Information Storage, 1958',\r\n  inv: '线性可分数据上有限步内收敛（错分数 → 0）',\r\n  impl: (X, y, lr, epochs) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const ys = _flat(y);\r\n    const { neg, pos } = _binLabels(ys);\r\n    const eta = lr === undefined ? 0.1 : expectNumber(lr, 'lr');\r\n    if (!(eta > 0)) throw new ForgeError('E_VALUE', `lr 必须 > 0，当前 ${eta}`);\r\n    const ep = epochs === undefined ? 200 : Math.max(1, Math.floor(epochs));\r\n    const R = _rows(X);\r\n    const t = ys.map((v) => (v === pos ? 1 : -1));\r\n    const w = new Array(d).fill(0);\r\n    let b = 0, updates = 0;\r\n    for (let e = 0; e < ep; e++) {\r\n      let errs = 0;\r\n      for (let i = 0; i < n; i++) {\r\n        const z = t[i] * (_dot(w, R[i]) + b);\r\n        if (z <= 0) {\r\n          for (let j = 0; j < d; j++) w[j] += eta * t[i] * R[i][j];\r\n          b += eta * t[i];\r\n          updates++; errs++;\r\n        }\r\n      }\r\n      if (errs === 0) break;\r\n    }\r\n    return { kind: 'ml.perceptron', n, d, negLabel: neg, posLabel: pos, w, b, lr: eta, epochs: ep, updates };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.perceptron.predict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor labels[m]',\r\n  doc: '感知机预测：sign(wᵀx + b)',\r\n  ref: 'Rosenblatt 1958',\r\n  inv: '预测标签 ∈ {negLabel, posLabel}',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    return _T1(R.map((r) => (_dot(state.w, r) + state.b >= 0 ? state.posLabel : state.negLabel)));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.lda.fit', arity: 2,\r\n  sig: '(Tensor X[n,d], Tensor y[n]) -> object state',\r\n  doc: '线性判别分析：类等协方差 + 高斯似然的对数线性判别函数',\r\n  ref: 'Fisher, The Use of Multiple Measurements in Taxonomic Problems, 1936；Hastie et al., ESL 2009 §4.3',\r\n  inv: '判别得分 δ_k 线性于 x；两类等协方差时等价于 Bayes 最优分类器',\r\n  impl: (X, y) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const R = _rows(X), ys = _flat(y);\r\n    const classes = _classesOf(ys);\r\n    const K = classes.length;\r\n    if (K < 2) throw new ForgeError('E_VALUE', 'LDA 需要至少 2 个类别');\r\n    const groups = classes.map((c) => R.filter((_, i) => ys[i] === c));\r\n    const means = groups.map((g) => _colMean(g, d));\r\n    const prior = groups.map((g) => g.length / n);\r\n    // 合并协方差（无偏，分母 n−K）\r\n    const S = Array.from({ length: d }, () => new Array(d).fill(0));\r\n    for (let k = 0; k < K; k++) {\r\n      for (const r of groups[k]) {\r\n        const c = r.map((v, j) => v - means[k][j]);\r\n        for (let a = 0; a < d; a++) for (let b = 0; b < d; b++) S[a][b] += c[a] * c[b];\r\n      }\r\n    }\r\n    const den = Math.max(1, n - K);\r\n    for (let a = 0; a < d; a++) for (let b = 0; b < d; b++) S[a][b] /= den;\r\n    let tr = 0;\r\n    for (let a = 0; a < d; a++) tr += S[a][a];\r\n    const ridge = 1e-8 * (1 + tr / d);\r\n    const SinvMu = means.map((m) => _solve(S, m, ridge));\r\n    const consts = means.map((m, k) => -0.5 * _dot(m, SinvMu[k]) + Math.log(Math.max(prior[k], _EPS)));\r\n    return { kind: 'ml.lda', n, d, classes, means, prior, S, SinvMu, consts, ridge };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.lda.predict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor labels[m]',\r\n  doc: 'LDA 预测：argmax_k (xᵀΣ⁻¹μ_k + const_k)',\r\n  ref: 'Fisher 1936；Hastie et al., ESL 2009 §4.3',\r\n  inv: '决策边界为超平面（分段线性）',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    const K = state.classes.length;\r\n    return _T1(R.map((r) => {\r\n      let bi = 0, bv = -Infinity;\r\n      for (let k = 0; k < K; k++) {\r\n        const s = _dot(r, state.SinvMu[k]) + state.consts[k];\r\n        if (s > bv) { bv = s; bi = k; }\r\n      }\r\n      return state.classes[bi];\r\n    }));\r\n  },\r\n});\r\n\r\n// =====================================================================\r\n// 三、C 判别与朴素贝叶斯（8 条）：qda / nb.gaussian / nb.multinomial / nb.bernoulli\r\n// =====================================================================\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.qda.fit', arity: 2,\r\n  sig: '(Tensor X[n,d], Tensor y[n]) -> object state',\r\n  doc: '二次判别分析：每类各估计一个协方差矩阵',\r\n  ref: 'Hastie et al., ESL 2009 §4.3；McLachlan《Discriminant Analysis and Statistical Pattern Recognition》1992',\r\n  inv: '决策边界为二次曲面；类内协方差相等时退化为 LDA',\r\n  impl: (X, y) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const R = _rows(X), ys = _flat(y);\r\n    const classes = _classesOf(ys);\r\n    const K = classes.length;\r\n    if (K < 2) throw new ForgeError('E_VALUE', 'QDA 需要至少 2 个类别');\r\n    const groups = classes.map((c) => R.filter((_, i) => ys[i] === c));\r\n    const means = groups.map((g) => _colMean(g, d));\r\n    const prior = groups.map((g) => g.length / n);\r\n    const covs = [], invs = [], logdets = [];\r\n    for (let k = 0; k < K; k++) {\r\n      const S = Array.from({ length: d }, () => new Array(d).fill(0));\r\n      const nk = Math.max(1, groups[k].length - 1);\r\n      for (const r of groups[k]) {\r\n        const c = r.map((v, j) => v - means[k][j]);\r\n        for (let a = 0; a < d; a++) for (let b = 0; b < d; b++) S[a][b] += c[a] * c[b];\r\n      }\r\n      for (let a = 0; a < d; a++) for (let b = 0; b < d; b++) S[a][b] /= nk;\r\n      let tr = 0;\r\n      for (let a = 0; a < d; a++) tr += S[a][a];\r\n      const ridge = 1e-6 * (1 + tr / d);\r\n      const Sr = S.map((row, i) => row.map((v, j) => v + (i === j ? ridge : 0)));\r\n      covs.push(Sr);\r\n      invs.push(_inv(Sr));\r\n      logdets.push(_choleskyLogDet(Sr));\r\n    }\r\n    return { kind: 'ml.qda', n, d, classes, means, prior, covs, invs, logdets };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.qda.predict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor labels[m]',\r\n  doc: 'QDA 预测：−½(x−μ_k)ᵀΣ_k⁻¹(x−μ_k) − ½log|Σ_k| + log π_k 取最大',\r\n  ref: 'Hastie et al., ESL 2009 §4.3',\r\n  inv: '预测标签必属于 state.classes',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    const K = state.classes.length;\r\n    return _T1(R.map((r) => {\r\n      let bi = 0, bv = -Infinity;\r\n      for (let k = 0; k < K; k++) {\r\n        const c = r.map((v, j) => v - state.means[k][j]);\r\n        const quad = _dot(c, state.invs[k].map((row) => _dot(row, c)));\r\n        const s = -0.5 * quad - 0.5 * state.logdets[k] + Math.log(Math.max(state.prior[k], _EPS));\r\n        if (s > bv) { bv = s; bi = k; }\r\n      }\r\n      return state.classes[bi];\r\n    }));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.nb.gaussianFit', arity: 2,\r\n  sig: '(Tensor X[n,d], Tensor y[n]) -> object state',\r\n  doc: '高斯朴素贝叶斯：各类各维独立估计均值与方差',\r\n  ref: 'Duda & Hart, Pattern Classification and Scene Analysis, 1973；Hastie et al., ESL 2009 §6.6.3',\r\n  inv: '后验 log P(y=k|x) ∝ log π_k + Σ_j log N(x_j; μ_kj, σ²_kj)',\r\n  impl: (X, y) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const R = _rows(X), ys = _flat(y);\r\n    const classes = _classesOf(ys);\r\n    const groups = classes.map((c) => R.filter((_, i) => ys[i] === c));\r\n    const means = groups.map((g) => _colMean(g, d));\r\n    const vars = means.map((m, k) => {\r\n      const g = groups[k], nk = Math.max(1, g.length - 1);\r\n      return m.map((_, j) => {\r\n        let s = 0;\r\n        for (const r of g) s += (r[j] - m[j]) ** 2;\r\n        return Math.max(s / nk, 1e-9);\r\n      });\r\n    });\r\n    return {\r\n      kind: 'ml.nb.gaussian', n, d, classes,\r\n      prior: groups.map((g) => g.length / n),\r\n      means, vars,\r\n    };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.nb.gaussianPredict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor labels[m]',\r\n  doc: '高斯朴素贝叶斯最大后验预测',\r\n  ref: 'Duda & Hart 1973；Hastie et al., ESL 2009 §6.6.3',\r\n  inv: '两类等方差高斯且均值已知时准确率趋近 Bayes 最优',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    const K = state.classes.length, d = state.d;\r\n    return _T1(R.map((r) => {\r\n      let bi = 0, bv = -Infinity;\r\n      for (let k = 0; k < K; k++) {\r\n        let s = Math.log(Math.max(state.prior[k], _EPS));\r\n        for (let j = 0; j < d; j++) {\r\n          const v = state.vars[k][j];\r\n          s += -0.5 * Math.log(2 * Math.PI * v) - ((r[j] - state.means[k][j]) ** 2) / (2 * v);\r\n        }\r\n        if (s > bv) { bv = s; bi = k; }\r\n      }\r\n      return state.classes[bi];\r\n    }));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.nb.multinomialFit', arity: 3,\r\n  sig: '(Tensor X[n,d], Tensor y[n], number alpha=1) -> object state',\r\n  doc: '多项式朴素贝叶斯（文本计数模型）：Laplace/Lidstone 平滑的对数似然',\r\n  ref: 'McCallum & Nigam, A Comparison of Event Models for Naive Bayes Text Classification, AAAI-98',\r\n  inv: '每类 θ_k 在特征维上归一：Σ_j θ_kj = 1',\r\n  impl: (X, y, alpha) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const a = alpha === undefined ? 1 : expectNumber(alpha, 'alpha');\r\n    if (a < 0) throw new ForgeError('E_VALUE', `alpha 必须 >= 0，当前 ${a}`);\r\n    const R = _rows(X), ys = _flat(y);\r\n    const classes = _classesOf(ys);\r\n    const groups = classes.map((c) => R.filter((_, i) => ys[i] === c));\r\n    const logTheta = groups.map((g) => {\r\n      const cnt = new Array(d).fill(0);\r\n      let tot = 0;\r\n      for (const r of g) for (let j = 0; j < d; j++) { cnt[j] += Math.max(0, r[j]); tot += Math.max(0, r[j]); }\r\n      return cnt.map((c) => Math.log((c + a) / (tot + a * d)));\r\n    });\r\n    return {\r\n      kind: 'ml.nb.multinomial', n, d, classes, alpha: a,\r\n      prior: groups.map((g) => g.length / n), logTheta,\r\n    };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.nb.multinomialPredict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor labels[m]',\r\n  doc: '多项式朴素贝叶斯预测',\r\n  ref: 'McCallum & Nigam, AAAI-98',\r\n  inv: '得分 = log π_k + Σ_j x_j·log θ_kj',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    const K = state.classes.length, d = state.d;\r\n    return _T1(R.map((r) => {\r\n      let bi = 0, bv = -Infinity;\r\n      for (let k = 0; k < K; k++) {\r\n        let s = Math.log(Math.max(state.prior[k], _EPS));\r\n        for (let j = 0; j < d; j++) s += Math.max(0, r[j]) * state.logTheta[k][j];\r\n        if (s > bv) { bv = s; bi = k; }\r\n      }\r\n      return state.classes[bi];\r\n    }));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.nb.bernoulliFit', arity: 3,\r\n  sig: '(Tensor X[n,d], Tensor y[n], number alpha=1) -> object state',\r\n  doc: '伯努利朴素贝叶斯：特征二值化后估计 P(x_j=1|y=k)',\r\n  ref: 'McCallum & Nigam, AAAI-98；Hastie et al., ESL 2009 §6.6.3',\r\n  inv: '估计概率截断到 [ε, 1−ε]，保证 log 有界',\r\n  impl: (X, y, alpha) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const a = alpha === undefined ? 1 : expectNumber(alpha, 'alpha');\r\n    if (a < 0) throw new ForgeError('E_VALUE', `alpha 必须 >= 0，当前 ${a}`);\r\n    const R = _rows(X), ys = _flat(y);\r\n    const classes = _classesOf(ys);\r\n    const groups = classes.map((c) => R.filter((_, i) => ys[i] === c));\r\n    const p = groups.map((g) => {\r\n      const nk = Math.max(1, g.length);\r\n      const cnt = new Array(d).fill(0);\r\n      for (const r of g) for (let j = 0; j < d; j++) if (r[j] > 0) cnt[j]++;\r\n      return cnt.map((c) => Math.min(1 - 1e-12, Math.max(1e-12, (c + a) / (nk + 2 * a))));\r\n    });\r\n    return {\r\n      kind: 'ml.nb.bernoulli', n, d, classes, alpha: a,\r\n      prior: groups.map((g) => g.length / n), p,\r\n    };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.nb.bernoulliPredict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor labels[m]',\r\n  doc: '伯努利朴素贝叶斯预测（输入按 x>0 二值化）',\r\n  ref: 'McCallum & Nigam, AAAI-98',\r\n  inv: '得分 = log π_k + Σ_j [x_j log p_kj + (1−x_j) log(1−p_kj)]',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    const K = state.classes.length, d = state.d;\r\n    return _T1(R.map((r) => {\r\n      let bi = 0, bv = -Infinity;\r\n      for (let k = 0; k < K; k++) {\r\n        let s = Math.log(Math.max(state.prior[k], _EPS));\r\n        for (let j = 0; j < d; j++) {\r\n          const x = r[j] > 0 ? 1 : 0, pk = state.p[k][j];\r\n          s += x * Math.log(pk) + (1 - x) * Math.log(1 - pk);\r\n        }\r\n        if (s > bv) { bv = s; bi = k; }\r\n      }\r\n      return state.classes[bi];\r\n    }));\r\n  },\r\n});\r\n\r\n// =====================================================================\r\n// 四、D 树与集成（14 条）：CART / 随机森林 / 梯度提升 / AdaBoost\r\n// =====================================================================\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.tree.fit', arity: 5,\r\n  sig: '(Tensor X[n,d], Tensor y[n], number maxDepth=10, number minSplit=2, string task=\"auto\") -> object state',\r\n  doc: 'CART 决策树：分类用基尼不纯度、回归用平方误差，贪心递归二分',\r\n  ref: 'Breiman, Friedman, Olshen & Stone, Classification and Regression Trees, 1984',\r\n  inv: '每个内部节点的加权不纯度下降 ≥ 0；叶节点不纯度为 0 时训练误差为 0',\r\n  impl: (X, y, maxDepth, minSplit, task) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const ys = _flat(y);\r\n    const tk = task === undefined || task === 'auto' ? (_isClassify(ys) ? 'classify' : 'regress') : String(task);\r\n    if (tk !== 'classify' && tk !== 'regress') {\r\n      throw new ForgeError('E_VALUE', `task 必须为 auto|classify|regress，当前 ${task}`);\r\n    }\r\n    const md = maxDepth === undefined ? 10 : Math.max(0, Math.floor(expectNumber(maxDepth, 'maxDepth')));\r\n    const ms = minSplit === undefined ? 2 : Math.max(2, Math.floor(expectNumber(minSplit, 'minSplit')));\r\n    const classes = tk === 'classify' ? _classesOf(ys) : [];\r\n    const R = _rows(X);\r\n    const root = _buildTree(R, ys, Array.from({ length: n }, (_, i) => i), 0, {\r\n      maxDepth: md, minSplit: ms, task: tk, classes, feats: Array.from({ length: d }, (_, j) => j),\r\n    });\r\n    return { kind: 'ml.tree', n, d, task: tk, classes, maxDepth: md, minSplit: ms, root };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.tree.predict', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor out[m]',\r\n  doc: '决策树预测（分类→众数标签，回归→叶内均值）',\r\n  ref: 'Breiman et al., CART, 1984',\r\n  inv: '每个样本的预测等于其落入叶节点的代表值',\r\n  impl: (state, X) => {\r\n    if (!state || typeof state !== 'object') throw new ForgeError('E_TYPE', 'state 必须为对象');\r\n    X = _asMat(X, 'X');\r\n    const R = _rows(X);\r\n    return _T1(R.map((r) => _treeValue(state.root, r)));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.tree.predictProba', arity: 2,\r\n  sig: '(object state, Tensor X[m,d]) -> Tensor P[m,K]',\r\n  doc: '决策树叶内类概率（回归树返回 [m,1] 的叶均值）',\r\n  ref: 'Breiman et al., CART, 19 nsor K[n,n]) -> Tensor Kc[n,n]',\r\n  doc: '核矩阵中心化：Kc = (I − 11ᵀ/n) K (I − 11ᵀ/n)，即特征空间去均值',\r\n  ref: 'Schölkopf, Smola & Müller, Nonlinear Component Analysis as a Kernel Eigenvalue Problem, 1998',\r\n  inv: 'Kc 的行和与列和均为 0',\r\n  impl: (K) => {\r\n    K = _asMat(K, 'K');\r\n    if (K.shape[0] !== K.shape[1]) throw new ForgeError('E_SHAPE', 'K 必须是方阵');\r\n    const M = _rows(K);\r\n    return _T2(_centerKernel(M));\r\n  },\r\n});\r\n\r\n// =====================================================================\r\n// 六、F 近邻（4 条）：k-NN 分类 / 概率 / 回归\r\n// =====================================================================\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.knn.fit', arity: 2,\r\n  sig: '(Tensor X[n,d], Tensor y[n]) -> object state',\r\n  doc: 'k 近邻惰性学习器：仅存储训练集（任务自动判别分类/回归）',\r\n  ref: 'Cover & Hart, Nearest Neighbor Pattern Classification, IEEE Trans. IT, 1967',\r\n  inv: 'k=1 时训练集留一误差为 0（无重复样本时训练误差为 0）',\r\n  impl: (X, y) => {\r\n    X = _asMat(X, 'X'); y = _asVec(y, 'y');\r\n    const n = X.shape[0], d = X.shape[1];\r\n    if (y.shape[0] !== n) throw new ForgeError('E_SHAPE', `X 行数 ${n} 与 y 长度 ${y.shape[0]} 不符`);\r\n    const ys = _flat(y);\r\n    const task = _isClassify(ys) ? 'classify' : 'regress';\r\n    return {\r\n      kind: 'ml.knn', n, d, task,\r\n      rows: _rows(X), labels: ys, classes: task === 'classify' ? _classesOf(ys) : [],\r\n    };\r\n  },\r\n});\r\n\r\nfunction _knnNeighbors(state, X, k) {\r\n  X = _asMat(X, 'X');\r\n  const kk = Math.max(1, Math.floor(expectNumber(k, 'k')));\r\n  const R = _rows(X), train = state.rows;\r\n  const out = [];\r\n  for (const r of R) {\r\n    const ds = train.map((t, i) => [_dist2(r, t), i]);\r\n    ds.sort((a, b) => a[0] - b[0]);\r\n    out.push(ds.slice(0, Math.min(kk, ds.length)).map((v) => v[1]));\r\n  }\r\n  return { R, out, kk };\r\n}\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'ml.knn.predict', arity: 3,\r\n  sig: '(object state, Tensor X[m,d], number k=5) -> Tensor labels[m]',\r\n  doc:
