<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forge-1024 · AI 微指令内核（浏览器内自检）</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e8ee; --dim:#8b93a7; --acc:#5cc8ff; --ok:#3ddc84; --bad:#ff6b6b; --card:#171a21; --line:#262b36; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing:.5px; }
  h2 { font-size: 15px; margin: 26px 0 10px; color: var(--acc); border-bottom:1px solid var(--line); padding-bottom:6px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .stat { flex:1 1 160px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:22px; color:var(--acc); }
  .stat span { color:var(--dim); font-size:11px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  input, select { background:#0c0e13; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  input { flex:1 1 240px; }
  table { width:100%; border-collapse: collapse; font-size:12px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight:600; position: sticky; top:0; background:var(--bg); }
  td.id { color: var(--dim); white-space: nowrap; }
  .scroll { max-height: 380px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  pre { margin:0; white-space: pre-wrap; word-break: break-all; font-size:12px; color:var(--dim); }
  button { background:#1b2230; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color: var(--acc); }
  code { color: var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <h1>forge-1024 · AI 微指令内核</h1>
  <div class="sub">零依赖 · 零构建 · 浏览器内自检 —— 10 域 1024 条可验证微指令（6×102 + 4×103）。作者：晨星。</div>

  <div id="boot" class="card">正在装载内核…</div>

  <div class="row" id="stats" style="display:none"></div>

  <h2>编目自检</h2>
  <div class="card"><pre id="selftest">—</pre></div>

  <h2>指令检索（1024 条全量索引）</h2>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <input id="q" placeholder="按名称 / 说明 / id 搜索，例如 softmax、svd、klDiv">
      <select id="dom">
        <option value="">全部域</option>
      </select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>id</th><th>指令</th><th>签名</th><th>说明</th><th>不变量</th><th>参考</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="sub" id="count" style="margin:10px 0 0"></div>
  </div>

  <h2>在线执行</h2>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <input id="callName" style="flex:0 1 260px" placeholder="指令名，例如 math.add">
      <input id="callArgs" placeholder="JSON 参数数组，例如 [1,2]">
      <button id="run">执行</button>
    </div>
    <pre id="out">—</pre>
  </div>
</div>

<script id="src" type="application/json">{"src/core/errors.mjs":"// 错误分类学（Error Taxonomy）\n// 所有微指令错误统一携带 code，供 exec 层归类、测试断言与上层恢复策略使用。\n// 设计对标：Rust 的 error kinds / Python 异常层级，但保持零依赖。\n\nexport const CODES = {\n  E_ARITY: '参数个数不符',\n  E_TYPE: '参数类型不符（应为 Tensor / number / string 等）',\n  E_SHAPE: '张量形状不符或不可广播',\n  E_VALUE: '参数取值非法（如负方差、k>n、空数据）',\n  E_NUMERICAL: '数值失败（不收敛、奇异矩阵、溢出）',\n  E_LIMIT: '超出资源限额（迭代次数 / 时间预算）',\n  E_NOTFOUND: '指令不存在',\n  E_STATE: '状态错误（未初始化 / 重复 backward / 越界访问）',\n};\n\nexport class ForgeError extends Error {\n  constructor(code, message) {\n    super(`[${code}] ${message}`);\n    this.name = 'ForgeError';\n    this.code = code;\n  }\n}\n\nexport function forgeError(code, message) {\n  return new ForgeError(code, message);\n}\n",
"src/core/tensor.mjs":"// 稠密张量 Tensor：Float64Array + shape，行主序（C order）。\n// 语义子集对标 NumPy ndarray：广播规则、reshape 视图、permute 拷贝、轴归约。\n// 参考：NumPy broadcasting 文档；Golub & Van Loan《Matrix Computations》§1.3（存储序）。\nimport { ForgeError } from './errors.mjs';\n\nexport function prod(shape) {\n  let n = 1;\n  for (const d of shape) {\n    if (!Number.isInteger(d) || d < 0) throw new ForgeError('E_SHAPE', `非法维度 ${d}`);\n    n *= d;\n  }\n  return n;\n}\n\nexport function stridesOf(shape) {\n  const st = new Array(shape.length);\n  let acc = 1;\n  for (let i = shape.length - 1; i >= 0; i--) { st[i] = acc; acc *= shape[i]; }\n  return st;\n}\n\nexport function sameShape(a, b) {\n  return a.length === b.length && a.every((v, i) => v === b[i]);\n}\n\n// NumPy 广播规则：从尾部对齐；1 可扩展，缺失补 1；其余必须相等。\nexport function broadcastShapes(s1, s2) {\n  const n = Math.max(s1.length, s2.length);\n  const out = new Array(n);\n  for (let i = 0; i < n; i++) {\n    const d1 = s1[s1.length - 1 - i] ?? 1;\n    const d2 = s2[s2.length - 1 - i] ?? 1;\n    if (d1 !== d2 && d1 !== 1 && d2 !== 1) {\n      throw new ForgeError('E_SHAPE', `形状不可广播: [${s1}] vs [${s2}]`);\n    }\n    out[n - 1 - i] = Math.max(d1, d2);\n  }\n  return out;\n}\n\nexport class Tensor {\n  constructor(data, shape) {\n    this.data = data instanceof Float64Array ? data : Float64Array.from(data);\n    this.shape = shape.slice();\n    if (prod(this.shape) !== this.data.length) {\n      throw new ForgeError('E_SHAPE', `shape [${this.shape}] 与数据长度 ${this.data.length} 不符`);\n    }\n  }\n\n  // —— 静态构造器 ——\n  static fromNested(arr) {\n    const shape = [];\n    let node = arr;\n    while (Array.isArray(node)) {\n      shape.push(node.length);\n      if (node.length === 0) break;\n      node = node[0];\n    }\n    const flat = [];\n    const fill = (n, depth) => {\n      if (depth === shape.length) { flat.push(Number(n)); return; }\n      if (!Array.isArray(n) || n.length !== shape[depth]) {\n        throw new ForgeError('E_SHAPE', '嵌套数组非矩形，无法推断 shape');\n      }\n      for (const c of n) fill(c, depth + 1);\n    };\n    fill(arr, 0);\n    return new Tensor(flat, shape);\n  }\n\n  static zeros(shape) { return new Tensor(new Float64Array(prod(shape)), shape); }\n  static ones(shape) { const t = Tensor.zeros(shape); t.data.fill(1); return t; }\n  static full(shape, v) { const t = Tensor.zeros(shape); t.data.fill(v); return t; }\n  static eye(n, m = n) {\n    const t = Tensor.zeros([n, m]);\n    for (let i = 0; i < Math.min(n, m); i++) t.data[i * m + i] = 1;\n    return t;\n  }\n  static arange(stop, start = 0, step = 1) {\n    const n = Math.max(0, Math.ceil((stop - start) / step));\n    const d = new Float64Array(n);\n    for (let i = 0; i < n; i++) d[i] = start + i * step;\n    return new Tensor(d, [n]);\n  }\n  static linspace(a, b, n) {\n    if (n < 1) throw new ForgeError('E_VALUE', 'linspace 需要 n>=1');\n    const d = new Float64Array(n);\n    if (n === 1) { d[0] = a; return new Tensor(d, [1]); }\n    for (let i = 0; i < n; i++) d[i] = a + (b - a) * (i / (n - 1));\n    return new Tensor(d, [n]);\n  }\n  static fromFlat(data, shape) { return new Tensor(Float64Array.from(data), shape); }\n\n  get size() { return this.data.length; }\n  get ndim() { return this.shape.length; }\n  scalar() {\n    if (this.size !== 1) throw new ForgeError('E_SHAPE', `scalar() 仅接受 size=1，当前 ${this.size}`);\n    return this.data[0];\n  }\n\n  at(i) { return this.data[i]; }\n  get2(i, j) {\n    if (this.ndim !== 2) throw new ForgeError('E_SHAPE', 'get2 仅限 2D');\n    return this.data[i * this.shape[1] + j];\n  }\n  set2(i, j, v) {\n    if (this.ndim !== 2) throw new ForgeError('E_SHAPE', 'set2 仅限 2D');\n    this.data[i * this.shape[1] + j] = v;\n    return this;\n  }\n  row(i) {\n    if (this.ndim !== 2) throw new ForgeError('E_SHAPE', 'row 仅限 2D');\n    const n = this.shape[1];\n    return this.data.subarray(i * n, (i + 1) * n);\n  }\n  col(j) {\n    if (this.ndim !== 2) throw new ForgeError('E_SHAPE', 'col 仅限 2D');\n    const [m, n] = this.shape;\n    const out = new Float64Array(m);\n    for (let i = 0; i < m; i++) out[i] = this.data[i * n + j];\n    return out;\n  }\n  getAt(idx) {\n    const st = stridesOf(this.shape);\n    let p = 0;\n    for (let d = 0; d < idx.length; d++) p += idx[d] * st[d];\n    return this.data[p];\n  }\n  setAt(idx, v) {\n    const st = stridesOf(this.shape);\n    let p = 0;\n    for (let d = 0; d < idx.length; d++) p += idx[d] * st[d];\n    this.data[p] = v;\n    return this;\n  }\n\n  // reshape 返回视图（共享底层数据，与 NumPy 一致）；-1 自动推断。\n  reshape(...dims) {\n    const d = (dims.length === 1 && Array.isArray(dims[0])) ? dims[0] : dims;\n    const out = d.slice();\n    const neg = out.indexOf(-1);\n    if (neg >= 0) {\n      let rest = 1;\n      out.forEach((v, i) => { if (i !== neg) rest *= v; });\n      out[neg] = this.size / rest;\n    }\n    if (prod(out) !== this.size) throw new ForgeError('E_SHAPE', `reshape [${this.shape}] -> [${out}] 元素数不符`);\n    return new Tensor(this.data, out);\n  }\n  flatten() { return new Tensor(this.data, [this.size]); }\n\n  T() {\n    if (this.ndim !== 2) throw new ForgeError('E_SHAPE', 'T 仅限 2D');\n    const [m, n] = this.shape;\n    const out = new Float64Array(m * n);\n    for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) out[j * m + i] = this.data[i * n + j];\n    return new Tensor(out, [n, m]);\n  }\n  permute(...axes) {\n    if (axes.length !== this.ndim) throw new ForgeError('E_SHAPE', 'permute 轴数不符');\n    const outShape = axes.map(a => this.shape[a]);\n    const out = new Float64Array(this.size);\n    const st = stridesOf(this.shape), so = stridesOf(outShape);\n    const idx = new Array(this.ndim);\n    for (let p = 0; p < this.size; p++) {\n      let r = p;\n      for (let d = this.ndim - 1; d >= 0; d--) { idx[d] = r % outShape[d]; r = (r - idx[d]) / outShape[d]; }\n      let q = 0;\n      for (let d = 0; d < this.ndim; d++) q += idx[d] * st[axes[d]];\n      out[p] = this.data[q];\n    }\n    return new Tensor(out, outShape);\n  }\n  clone() { return new Tensor(this.data.slice(), this.shape); }\n  map(fn) {\n    const out = new Float64Array(this.size);\n    const d = this.data;\n    for (let i = 0; i < d.length; i++) out[i] = fn(d[i], i);\n    return new Tensor(out, this.shape);\n  }\n  fill(v) { this.data.fill(v); return this; }\n\n  toArray() {\n    const build = (offset, dims) => {\n      if (dims.length === 1) return Array.from(this.data.subarray(offset, offset + dims[0]));\n      const [d, ...rest] = dims;\n      const block = prod(rest);\n      const out = [];\n      for (let i = 0; i < d; i++) out.push(build(offset + i * block, rest));\n      return out;\n    };\n    return build(0, this.shape);\n  }\n  toString() { return `Tensor(shape=[${this.shape}], data=[${Array.from(this.data.slice(0, 8)).map(v => v.toFixed(4))}${this.size > 8 ? ', ...' : ''}])`; }\n}\n\nexport function isTensor(v) { return v instanceof Tensor; }\n\nexport function expectTensor(v, who = '参数') {\n  if (!(v instanceof Tensor)) throw new ForgeError('E_TYPE', `${who}: 期望 Tensor，得到 ${v === null ? 'null' : typeof v}`);\n  return v;\n}\n\nexport function expectNumber(v, who = '参数') {\n  if (typeof v !== 'number' || !Number.isFinite(v)) throw new ForgeError('E_TYPE', `${who}: 期望有限 number，得到 ${v}`);\n  return v;\n}\n\n// 逐元素运算：支持 NumPy 广播；number 自动提升为标量。\nexport function elementwise(a, b, fn) {\n  const ta = typeof a === 'number', tb = typeof b === 'number';\n  if (ta && tb) return fn(a, b);\n  if (ta) return b.map(v => fn(a, v));\n  if (tb) return a.map(v => fn(v, b));\n  const outShape = broadcastShapes(a.shape, b.shape);\n  const n = outShape.length;\n  const pa = new Array(n).fill(1), pb = new Array(n).fill(1);\n  for (let i = 0; i < a.shape.length; i++) pa[n - a.shape.length + i] = a.shape[i];\n  for (let i = 0; i < b.shape.length; i++) pb[n - b.shape.length + i] = b.shape[i];\n  // stride 补齐到 n 维（前置补 0：补齐维尺寸为 1，索引恒 0）\n  const padStrides = (shape) => {\n    const st = stridesOf(shape);\n    const out = new Array(n).fill(0);\n    for (let i = 0; i < shape.length; i++) out[n - shape.length + i] = st[i];\n    return out;\n  };\n  const sa = padStrides(a.shape), sb = padStrides(b.shape);\n  const out = new Float64Array(prod(outShape));\n  const idx = new Array(n);\n  for (let p = 0; p < out.length; p++) {\n    let r = p;\n    for (let d = n - 1; d >= 0; d--) { idx[d] = r % outShape[d]; r = (r - idx[d]) / outShape[d]; }\n    let ia = 0, ib = 0;\n    for (let d = 0; d < n; d++) {\n      if (pa[d] !== 1) ia += idx[d] * sa[d];\n      if (pb[d] !== 1) ib += idx[d] * sb[d];\n    }\n    out[p] = fn(a.data[ia], b.data[ib]);\n  }\n  return new Tensor(out, outShape);\n}\n\n// 沿 axes 归约（axes=null 表示全部；支持负轴）。输出保持维数（keepDims 语义：被归约轴置 1）。\n// 每个输出槽位独立累积：combine(slotAcc, val, flatIdx) -> newSlotAcc。\n// 返回 {tensor, count}；count = 每个输出槽位合并的元素数（用于 mean 等）。\nexport function reduceTensor(t, axes, init, combine) {\n  const all = axes == null;\n  let ax;\n  if (all) ax = t.shape.map((_, i) => i);\n  else ax = (Array.isArray(axes) ? axes : [axes]).map(a => (a < 0 ? a + t.shape.length : a));\n  for (const a of ax) if (a < 0 || a >= t.ndim) throw new ForgeError('E_SHAPE', `归约轴 ${a} 越界`);\n  const reduced = new Set(ax);\n  const outShape = t.shape.map((d, i) => (reduced.has(i) ? 1 : d));\n  const so = stridesOf(outShape);\n  const accs = new Array(prod(outShape)).fill(init);\n  const idx = new Array(t.ndim);\n  for (let p = 0; p < t.size; p++) {\n    let r = p, q = 0;\n    for (let d = t.ndim - 1; d >= 0; d--) { idx[d] = r % t.shape[d]; r = (r - idx[d]) / t.shape[d]; if (!reduced.has(d)) q += idx[d] * so[d]; }\n    accs[q] = combine(accs[q], t.data[p], p);\n  }\n  let count = 1;\n  for (let i = 0; i < t.ndim; i++) if (reduced.has(i)) count *= t.shape[i];\n  return { tensor: new Tensor(Float64Array.from(accs), outShape), count };\n}\n",
"src/core/rng.mjs":"// 伪随机数发生器：PCG-XSL-RR 32bit。\n// 参考：M.E. O'Neill, \"PCG: A Family of Simple Fast Space-Efficient Statistically Good\n// Algorithms for Random Number Generation\", 2014（pcg-random.org）。\n// 64bit 状态以 BigInt 精确实现；Box-Muller 正态带缓存；同种子序列完全确定（可复现）。\nconst MASK64 = (1n << 64n) - 1n;\nconst MASK32 = 0xffffffffn;\nconst MULT = 6364136223846793005n;\n\nexport function createRng(seed = 20261014) {\n  let state = 0n;\n  const inc = 1n; // 定序流，序列仅由种子决定\n  state = (state * MULT + inc) & MASK64;\n  state = (state + BigInt(seed >>> 0)) & MASK64;\n  state = (state * MULT + inc) & MASK64;\n  let normalCache = null;\n\n  function nextU32() {\n    const old = state;\n    state = (old * MULT + inc) & MASK64;\n    const xorshifted = Number(((old >> 18n) ^ old) >> 27n) & 0xffffffff;\n    const rot = Number(old >> 59n);\n    return ((xorshifted >>> rot) | (xorshifted << ((32 - rot) & 31))) >>> 0;\n  }\n\n  const rng = {\n    // [0,1) 均匀\n    next() { return nextU32() / 4294967296; },\n    nextU32,\n    // [a,b) 均匀实数\n    range(a, b) { return a + (b - a) * rng.next(); },\n    // [0,n) 均匀整数\n    int(n) { return Math.floor(rng.next() * n) % n; },\n    // 标准正态（Box-Muller，成对生成带缓存）\n    normal() {\n      if (normalCache !== null) { const v = normalCache; normalCache = null; return v; }\n      let u1 = rng.next();\n      if (u1 < 1e-300) u1 = 1e-300;\n      const u2 = rng.next();\n      const r = Math.sqrt(-2 * Math.log(u1));\n      normalCache = r * Math.sin(2 * Math.PI * u2);\n      return r * Math.cos(2 * Math.PI * u2);\n    },\n    // 正态 N(mu, sigma)\n    normalScaled(mu, sigma) { return mu + sigma * rng.normal(); },\n    bernoulli(p) { return rng.next() < p ? 1 : 0; },\n    // Fisher-Yates，返回新数组（不改入参）\n    shuffle(arr) {\n      const a = arr.slice();\n      for (let i = a.length - 1; i > 0; i--) {\n        const j = rng.int(i + 1);\n        [a[i], a[j]] = [a[j], a[i]];\n      }\n      return a;\n    },\n    pick(arr) { return arr[rng.int(arr.length)]; },\n    // 不放回抽样 k 个\n    sample(arr, k) { return rng.shuffle(arr).slice(0, k); },\n    // 获取内部状态（用于序列持久化/复现）\n    getState() { return { state: state.toString(16), hasCache: normalCache !== null }; },\n  };\n  return rng;\n}\n\n// 由字符串派生 32bit 种子（FNV-1a），便于用文字种子复现实验。\nexport function seedFrom(str) {\n  let h = 0x811c9dc5;\n  for (let i = 0; i < str.length; i++) {\n    h ^= str.charCodeAt(i);\n    h = Math.imul(h, 0x01000193);\n  }\n  return h >>> 0;\n}\n",
"src/core/telemetry.mjs":"// 遥测：指令调用计数、耗时、追踪、错误计数。\n// 计时默认关闭（避免污染微基准）；bench 工具按需开启。\nconst calls = new Map();   // opId -> 次数\nconst errors = new Map();  // opId -> 次数\nconst times = new Map();   // opId -> 累计毫秒\nlet enabled = true;\nlet timing = false;\nlet tracing = false;\nconst trace = [];\n\nexport function now() {\n  if (typeof process !== 'undefined' && process.hrtime && process.hrtime.bigint) {\n    return Number(process.hrtime.bigint()) / 1e6; // 毫秒\n  }\n  if (typeof performance !== 'undefined' && performance.now) return performance.now();\n  return 0;\n}\n\nexport function record(id, t0) {\n  if (!enabled) return;\n  calls.set(id, (calls.get(id) || 0) + 1);\n  if (timing) times.set(id, (times.get(id) || 0) + (now() - t0));\n  if (tracing && trace.length < 10000) trace.push({ id, t: now() });\n}\n\nexport function recordError(id) {\n  if (!enabled) return;\n  errors.set(id, (errors.get(id) || 0) + 1);\n}\n\nexport function summary() {\n  const rows = [];\n  for (const [id, n] of calls) {\n    rows.push({ id, calls: n, errors: errors.get(id) || 0, ms: +(times.get(id) || 0).toFixed(3) });\n  }\n  rows.sort((a, b) => b.calls - a.calls);\n  return rows;\n}\n\nexport function totalCalls() {\n  let s = 0;\n  for (const n of calls.values()) s += n;\n  return s;\n}\n\nexport function hotOps(k = 10) { return summary().slice(0, k); }\n\nexport function reset() { calls.clear(); errors.clear(); times.clear(); trace.length = 0; }\n\nexport function setEnabled(b) { enabled = b; }\nexport function setTiming(b) { timing = b; }\nexport function setTracing(b) { tracing = b; if (!b) trace.length = 0; }\nexport function getTrace() { return trace.slice(); }\n",
"src/core/registry.mjs":"// 指令注册表（Op Registry）+ 执行器。\r\n// 设计基准：ONNX Operator Standard（opset 25，170+ 算子，ai.onnx 域）的\r\n// 「命名 + 签名 + 文档 + 版本化」组织方式；PyTorch aten native_functions 的注册模式。\r\n// 每条微指令是一个纯函数 + 元数据（签名/文档/引用/不变量），可被 exec 统一调度、遥测、校验。\r\nimport { ForgeError } from './errors.mjs';\r\nimport * as telemetry from './telemetry.mjs';\r\n\r\nexport const KERNEL_VERSION = '1.0.0';\r\nexport const CATALOG_VERSION = '2026.10';\r\n\r\nexport const DOMAINS = {\r\n  1: { code: 'MATH', name: '数学基元', desc: '逐元素运算、归约、范数、距离、构造器' },\r\n  2: { code: 'NUM', name: '数值方法与稳定化', desc: '稳定softmax、补偿求和、误差度量、求根、积分、差分、特殊函数' },\r\n  3: { code: 'LINALG', name: '线性代数', desc: '分解族（LU/QR/Cholesky/Jacobi/SVD）、求解器、迭代法、矩阵函数' },\r\n  4: { code: 'AUTODIFF', name: '自动微分', desc: '反向模式 vjp、前向模式对偶数、梯度检验' },\r\n  5: { code: 'OPT', name: '优化器', desc: '16 种经典优化器、学习率调度、梯度变换、线搜索' },\r\n  6: { code: 'PROB', name: '概率统计', desc: '分布族、信息论、矩估计、贝叶斯推断、采样与拟合检验' },\r\n  7: { code: 'ML', name: '机器学习', desc: '经典模型族、评估指标、数据预处理' },\r\n  8: { code: 'DL', name: '深度学习', desc: '层、激活、注意力、循环网络、损失、初始化' },\r\n  9: { code: 'TRAIN', name: '训练与评估', desc: '数据管线、训练循环、交叉验证、可复现性' },\r\n  10: { code: 'SYS', name: '系统编排', desc: '注册表内省、遥测、组合、文档生成、基准、模糊测试' },\r\n};\r\n\r\nconst registry = new Map(); // id -> spec\r\nconst byName = new Map();   // name -> spec\r\n\r\nconst REQUIRED = ['id', 'domain', 'name', 'sig', 'doc', 'ref', 'inv', 'impl'];\r\n\r\n// —— arity 机器推导 ——\r\n// 约定：arity = 「必需形参个数」（第一个带默认值 / rest 形参之前的形参数），\r\n// 与 exec 的 `args.length >= arity` 语义严格对应。\r\n// 之所以不让作者手写：手写值会与 impl 漂移（历史上一度出现 165 条缺失、51 条不符）。\r\n// 由实现反推元数据，是唯一不可能漂移的做法。\r\nexport function requiredParams(fn) {\r\n  if (typeof fn !== 'function') return 0;\r\n  const src = fn.toString().trim();\r\n  let list = null;\r\n  let m = src.match(/^(?:async\\s+)?function\\s*[\\w$]*\\s*\\(([\\s\\S]*?)\\)/);\r\n  if (m) list = m[1];\r\n  if (list === null) {\r\n    m = src.match(/^(?:async\\s+)?\\(([\\s\\S]*?)\\)\\s*=>/);\r\n    if (m) list = m[1];\r\n  }\r\n  if (list === null) {\r\n    // 单参数裸箭头：x => ...（无括号）\r\n    if (/^(?:async\\s+)?[\\w$]+\\s*=>/.test(src)) return 1;\r\n    if (/^(?:async\\s+)?\\(\\s*\\)\\s*=>/.test(src)) return 0;\r\n    return 0;\r\n  }\r\n  // 按逗号切分，但跳过括号/花括号/方括号/引号内部的逗号（默认值里可能带对象或数组字面量）\r\n  const parts = [];\r\n  let depth = 0, cur = '', quote = null;\r\n  for (const ch of list) {\r\n    if (quote) { cur += ch; if (ch === quote) quote = null; continue; }\r\n    if (ch === '\"' || ch === \"'\" || ch === '`') { quote = ch; cur += ch; continue; }\r\n    if (ch === '(' || ch === '[' || ch === '{') { depth++; cur += ch; continue; }\r\n    if (ch === ')' || ch === ']' || ch === '}') { depth--; cur += ch; continue; }\r\n    if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; continue; }\r\n    cur += ch;\r\n  }\r\n  if (cur.trim()) parts.push(cur.trim());\r\n  // 函数体（形参表之后的部分），用于识别「实现自带兜底」的可选形参\r\n  const body = src.slice(src.indexOf(list) + list.length + 1);\r\n  const hasFallback = (name) => {\r\n    const esc = name.replace(/\\$/g, '\\\\$');\r\n    // p ?? 默认值      —— 明确的空值合并兜底\r\n    // p === undefined ? … : …  / p == null ? … : …  —— 三元兜底\r\n    return new RegExp(`\\\\b${esc}\\\\s*\\\\?\\\\?`).test(body)\r\n      || new RegExp(`\\\\b${esc}\\\\s*(?:===|==)\\\\s*undefined\\\\s*\\\\?`).test(body)\r\n      || new RegExp(`\\\\b${esc}\\\\s*(?:===|==)\\\\s*null\\\\s*\\\\?`).test(body)\r\n      // 守卫式可选：if (p !== undefined) / if (p != null) —— 实现自行处理缺省\r\n      || new RegExp(`\\\\b${esc}\\\\s*!==?\\\\s*(?:undefined|null)\\\\b`).test(body);\r\n  };\r\n  let n = 0;\r\n  for (const p of parts) {\r\n    if (p.startsWith('...')) break;   // rest 形参及其后全部可选\r\n    if (p.includes('=')) break;       // 第一个带默认值的形参起为可选\r\n    const name = p.split(':')[0].trim();\r\n    if (/^[A-Za-z_$][\\w$]*$/.test(name) && hasFallback(name)) break; // 实现自带兜底 ⇒ 可选\r\n    n++;\r\n  }\r\n  return n;\r\n}\r\n\r\nexport function defineOp(spec) {\r\n  for (const k of REQUIRED) {\r\n    if (spec[k] === undefined || spec[k] === null) {\r\n      throw new ForgeError('E_VALUE', `defineOp 缺少必填字段 \"${k}\"（op: ${spec.id || spec.name || '?'}）`);\r\n    }\r\n  }\r\n  if (registry.has(spec.id)) throw new ForgeError('E_VALUE', `指令 id 重复: ${spec.id}`);\r\n  if (byName.has(spec.name)) throw new ForgeError('E_VALUE', `指令 name 重复: ${spec.name}`);\r\n  if (!DOMAINS[spec.domain]) throw new ForgeError('E_VALUE', `未知域: ${spec.domain}`);\r\n  const full = {\r\n    check: spec.check ?? null,\r\n    test: spec.test ?? null,\r\n    tags: spec.tags ?? [],\r\n    ...spec,\r\n    // arity 一律由 impl 形参表机器推导，放在展开之后以保证不被作者手写值覆盖\r\n    // （历史教训：手写 arity 一度出现 165 条缺失、51 条与实现不符）。\r\n    arity: requiredParams(spec.impl),\r\n  };\r\n  registry.set(full.id, full);\r\n  byName.set(full.name, full);\r\n  return full;\r\n}\r\n\r\nexport function getOp(idOrName) {\r\n  const op = registry.get(idOrName) || byName.get(idOrName);\r\n  if (!op) throw new ForgeError('E_NOTFOUND', `指令不存在: ${idOrName}`);\r\n  return op;\r\n}\r\n\r\nexport function hasOp(x) { return registry.has(x) || byName.has(x); }\r\n\r\nexport function listOps({ domain } = {}) {\r\n  const all = [...registry.values()];\r\n  return domain == null ? all : all.filter(o => o.domain === domain);\r\n}\r\n\r\nexport function countOps() { return registry.size; }\r\n\r\nexport function opsByDomain(d) { return [...registry.values()].filter(o => o.domain === d); }\r\n\r\nexport function searchOps(q) {\r\n  const s = String(q).toLowerCase();\r\n  return [...registry.values()].filter(o =>\r\n    o.name.toLowerCase().includes(s) || o.doc.toLowerCase().includes(s) || o.id.toLowerCase().includes(s));\r\n}\r\n\r\n// 统一执行入口：校验 -> 调用 -> 遥测 -> 错误归一化。\r\n// arity 语义 = 最少必需参数个数（带默认值的可选参数不计入）。\r\nexport function exec(idOrName, args = []) {\r\n  const op = getOp(idOrName);\r\n  if (op.arity != null && args.length < op.arity) {\r\n    telemetry.recordError(op.id);\r\n    throw new ForgeError('E_ARITY', `指令 ${op.id} (${op.name}) 至少需要 ${op.arity} 个参数，收到 ${args.length}`);\r\n  }\r\n  const t0 = telemetry.now();\r\n  try {\r\n    if (op.check) op.check(args);\r\n    return op.impl(...args);\r\n  } catch (e) {\r\n    telemetry.recordError(op.id);\r\n    if (e instanceof ForgeError) throw e;\r\n    throw new ForgeError('E_NUMERICAL', `指令 ${op.id} (${op.name}) 执行失败: ${e.message}`);\r\n  } finally {\r\n    telemetry.record(op.id, t0);\r\n  }\r\n}\r\n\r\n// 不抛错的执行：返回 {ok, value|error}，供上层编排与模糊测试使用。\r\nexport function tryExec(idOrName, args = []) {\r\n  try { return { ok: true, value: exec(idOrName, args) }; }\r\n  catch (e) { return { ok: false, error: e }; }\r\n}\r\n\r\nexport function describeOp(x) {\r\n  const op = getOp(x);\r\n  return `${op.id} ${op.name} — ${op.doc} | ${op.sig} | 参考: ${op.ref} | 不变量: ${op.inv}`;\r\n}\r\n",
"src/core/index.mjs":"// 内核门面：一条 import 拿到全部核心能力。\r\n// 分层依赖规则（域间）：D1<-D2<-D3<-D4<-{D5,D6}<-D7<-D8<-D9<-D10；D10 仅依赖注册表。\r\nimport {\r\n  KERNEL_VERSION, CATALOG_VERSION, DOMAINS,\r\n  exec, tryExec, getOp, hasOp, listOps, countOps, opsByDomain, searchOps, describeOp,\r\n} from './registry.mjs';\r\nimport * as telemetry from './telemetry.mjs';\r\n\r\nexport {\r\n  Tensor, prod, stridesOf, sameShape, broadcastShapes,\r\n  isTensor, expectTensor, expectNumber, elementwise, reduceTensor,\r\n} from './tensor.mjs';\r\nexport { createRng, seedFrom } from './rng.mjs';\r\nexport { ForgeError, CODES, forgeError } from './errors.mjs';\r\nexport {\r\n  defineOp, exec, tryExec, getOp, hasOp, listOps, countOps, opsByDomain, searchOps, describeOp,\r\n  DOMAINS, KERNEL_VERSION, CATALOG_VERSION, requiredParams,\r\n} from './registry.mjs';\r\nexport { telemetry };\r\n\r\nexport const kernel = {\r\n  version: KERNEL_VERSION,\r\n  catalog: CATALOG_VERSION,\r\n  call: exec,\r\n  tryCall: tryExec,\r\n  get: getOp,\r\n  has: hasOp,\r\n  list: listOps,\r\n  count: countOps,\r\n  byDomain: opsByDomain,\r\n  search: searchOps,\r\n  describe: describeOp,\r\n  stats: () => telemetry.summary(),\r\n  hotOps: (k) => telemetry.hotOps(k),\r\n  resetStats: () => telemetry.reset(),\r\n  totalCalls: () => telemetry.totalCalls(),\r\n  domains: DOMAINS,\r\n};\r\n",
"src/ops/d1-math.mjs":"// 域1 数学基元 MATH（102 条微指令）\r\n// 内容：逐元素运算族（广播/标量变体）、归约族、范数与距离、构造器、形状操作。\r\n// 参考：NumPy ufunc 语义与广播规则；Golub & Van Loan《Matrix Computations》。\r\nimport { defineOp, opsByDomain, exec } from '../core/registry.mjs';\r\nimport { ForgeError } from '../core/errors.mjs';\r\nimport { Tensor, prod as coreProd, stridesOf, broadcastShapes, elementwise, reduceTensor, expectTensor } from '../core/tensor.mjs';\r\n\r\nconst D = 1;\r\nlet _s = 0;\r\nconst nid = () => `D${D}-${String(++_s).padStart(3, '0')}`;\r\n\r\n// ============ 生成式家族 A：二元逐元素（10 基础 × {TT, TS, ST} = 30 条） ============\r\n// TT: Tensor⊗Tensor（广播）；TS: Tensor⊕标量；ST: 标量⊕Tensor。\r\nexport const BINARY_TABLE = [\r\n  ['add', (a, b) => a + b, '加法'],\r\n  ['sub', (a, b) => a - b, '减法'],\r\n  ['mul', (a, b) => a * b, '乘法'],\r\n  ['div', (a, b) => a / b, '除法'],\r\n  ['mod', (a, b) => a % b, '取模（JS 语义，符号随被除数）'],\r\n  ['pow', (a, b) => a ** b, '幂'],\r\n  ['atan2', Math.atan2, '二参数反正切'],\r\n  ['hypot', Math.hypot, '斜边 √(a²+b²)'],\r\n  ['maximum', Math.max, '逐元素取大（NumPy ufunc 命名）'],\r\n  ['minimum', Math.min, '逐元素取小（NumPy ufunc 命名）'],\r\n];\r\nfor (const [n, f, d] of BINARY_TABLE) {\r\n  defineOp({\r\n    id: nid(), domain: D, name: `math.${n}`,\r\n    sig: '(Tensor a, Tensor b) -> Tensor', doc: `逐元素${d}（NumPy 广播）`,\r\n    ref: 'NumPy ufunc 语义 / IEEE 754', inv: `out[i] = ${n}(a[i], b[i])；广播规则同 NumPy`,\r\n    impl: (a, b) => { expectTensor(a, 'a'); expectTensor(b, 'b'); return elementwise(a, b, f); },\r\n  });\r\n  defineOp({\r\n    id: nid(), domain: D, name: `math.${n}Scalar`,\r\n    sig: '(Tensor a, number s) -> Tensor', doc: `张量与标量逐元素${d}（右标量）`,\r\n    ref: 'NumPy ufunc 语义', inv: `out[i] = ${n}(a[i], s)`,\r\n    impl: (a, s) => { expectTensor(a, 'a'); return a.map(v => f(v, s)); },\r\n  });\r\n  defineOp({\r\n    id: nid(), domain: D, name: `math.scalar${n[0].toUpperCase()}${n.slice(1)}`,\r\n    sig: '(number s, Tensor a) -> Tensor', doc: `标量与张量逐元素${d}（左标量）`,\r\n    ref: 'NumPy ufunc 语义', inv: `out[i] = ${n}(s, a[i])`,\r\n    impl: (s, a) => { expectTensor(a, 'a'); return a.map(v => f(s, v)); },\r\n  });\r\n}\r\n\r\n// ============ 生成式家族 B：一元逐元素（28 条） ============\r\nexport const UNARY_TABLE = [\r\n  ['sin', Math.sin], ['cos', Math.cos], ['tan', Math.tan],\r\n  ['asin', Math.asin], ['acos', Math.acos], ['atan', Math.atan],\r\n  ['sinh', Math.sinh], ['cosh', Math.cosh], ['tanh', Math.tanh],\r\n  ['asinh', Math.asinh], ['acosh', Math.acosh], ['atanh', Math.atanh],\r\n  ['exp', Math.exp], ['expm1', Math.expm1],\r\n  ['log', Math.log], ['log1p', Math.log1p], ['log2', Math.log2], ['log10', Math.log10],\r\n  ['sqrt', Math.sqrt], ['cbrt', Math.cbrt],\r\n  ['abs', Math.abs], ['sign', Math.sign],\r\n  ['floor', Math.floor], ['ceil', Math.ceil], ['round', Math.round], ['trunc', Math.trunc],\r\n  ['square', (x) => x * x], ['reciprocal', (x) => 1 / x],\r\n];\r\nfor (const [n, f] of UNARY_TABLE) {\r\n  defineOp({\r\n    id: nid(), domain: D, name: `math.${n}`,\r\n    sig: '(Tensor) -> Tensor', doc: `逐元素 ${n}`,\r\n    ref: 'IEEE 754 / ECMAScript Math', inv: `out[i] = ${n}(in[i])`,\r\n    impl: (t) => { expectTensor(t, 't'); return t.map(f); },\r\n  });\r\n}\r\n\r\n// ============ 手写核心：内积与范数 ============\r\nfunction vec1d(t, who) {\r\n  expectTensor(t, who);\r\n  if (t.ndim !== 1) throw new ForgeError('E_SHAPE', `${who}: 期望 1D 向量，得到 shape [${t.shape}]`);\r\n  return t.data;\r\n}\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.dot', sig: '(Tensor x, Tensor y) -> number',\r\n  doc: '向量点积 x·y = Σxᵢyᵢ', ref: 'Golub & Van Loan §1.3 / BLAS ddot',\r\n  inv: 'dot(x,y)=dot(y,x)；dot(x,x)=‖x‖²',\r\n  impl: (x, y) => {\r\n    const a = vec1d(x, 'x'), b = vec1d(y, 'y');\r\n    if (a.length !== b.length) throw new ForgeError('E_SHAPE', `点积长度不符: ${a.length} vs ${b.length}`);\r\n    let s = 0;\r\n    for (let i = 0; i < a.length; i++) s += a[i] * b[i];\r\n    return s;\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.cross', sig: '(Tensor x, Tensor y) -> Tensor',\r\n  doc: '3D 向量叉积 x×y', ref: '线性代数标准定义',\r\n  inv: 'x×y ⊥ x,y；‖x×y‖=‖x‖‖y‖sinθ；(x×y)·x=0',\r\n  impl: (x, y) => {\r\n    const a = vec1d(x, 'x'), b = vec1d(y, 'y');\r\n    if (a.length !== 3 || b.length !== 3) throw new ForgeError('E_VALUE', '叉积仅支持 3D 向量');\r\n    return Tensor.fromFlat([\r\n      a[1] * b[2] - a[2] * b[1],\r\n      a[2] * b[0] - a[0] * b[2],\r\n      a[0] * b[1] - a[1] * b[0],\r\n    ], [3]);\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.outer', sig: '(Tensor x, Tensor y) -> Tensor',\r\n  doc: '外积 x⊗y，shape (m,n)', ref: 'Golub & Van Loan §1.3',\r\n  inv: 'outer(x,y)[i,j]=x[i]·y[j]',\r\n  impl: (x, y) => {\r\n    const a = vec1d(x, 'x'), b = vec1d(y, 'y');\r\n    const out = new Float64Array(a.length * b.length);\r\n    for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) out[i * b.length + j] = a[i] * b[j];\r\n    return new Tensor(out, [a.length, b.length]);\r\n  },\r\n});\r\n\r\nfunction flatData(t) { expectTensor(t, 't'); return t.data; }\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.l1', sig: '(Tensor) -> number', doc: 'L1 范数 ‖x‖₁=Σ|xᵢ|',\r\n  ref: 'NumPy norm / 泛函分析', inv: '‖x‖₁≥0，=0 ⟺ x=0',\r\n  impl: (t) => { let s = 0; for (const v of flatData(t)) s += Math.abs(v); return s; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.l2', sig: '(Tensor) -> number', doc: 'L2 范数 ‖x‖₂=√(Σxᵢ²)',\r\n  ref: 'NumPy norm / BLAS dnrm2', inv: '‖x‖₂²=dot(x,x)',\r\n  impl: (t) => { let s = 0; for (const v of flatData(t)) s += v * v; return Math.sqrt(s); },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.linf', sig: '(Tensor) -> number', doc: 'L∞ 范数 max|xᵢ|',\r\n  ref: 'NumPy norm', inv: '‖x‖∞≥‖x‖₂≥‖x‖₁/√n',\r\n  impl: (t) => { let m = 0; for (const v of flatData(t)) m = Math.max(m, Math.abs(v)); return m; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.lp', sig: '(Tensor, number p) -> number', doc: 'Lp 范数 (Σ|xᵢ|^p)^(1/p)',\r\n  ref: '泛函分析 / NumPy norm', inv: 'p=1,2,∞ 与 math.l1/l2/linf 一致',\r\n  impl: (t, p) => {\r\n    if (!(p >= 1)) throw new ForgeError('E_VALUE', 'p 必须 ≥1');\r\n    let s = 0;\r\n    for (const v of flatData(t)) s += Math.abs(v) ** p;\r\n    return s ** (1 / p);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.cosine', sig: '(Tensor x, Tensor y) -> number',\r\n  doc: '余弦相似度 (x·y)/(‖x‖‖y‖)', ref: '信息检索标准度量',\r\n  inv: 'cos(x,y)∈[-1,1]；cos(x,x)=1（x≠0）；零向量返回 0',\r\n  impl: (x, y) => {\r\n    const a = vec1d(x, 'x'), b = vec1d(y, 'y');\r\n    if (a.length !== b.length) throw new ForgeError('E_SHAPE', '余弦相似度长度不符');\r\n    let d = 0, na = 0, nb = 0;\r\n    for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }\r\n    if (na === 0 || nb === 0) return 0;\r\n    return d / (Math.sqrt(na) * Math.sqrt(nb));\r\n  },\r\n});\r\n\r\nconst DISTS = [\r\n  ['manhattan', (d) => Math.abs(d), 'L1 距离'],\r\n  ['euclidean', (d) => d * d, 'L2 距离（开方前）'],\r\n  ['sqeuclidean', (d) => d * d, '平方 L2 距离'],\r\n  ['chebyshev', null, 'L∞ 距离'],\r\n];\r\nfor (const [n, f, d] of DISTS) {\r\n  defineOp({\r\n    id: nid(), domain: D, name: `math.${n}`, sig: '(Tensor x, Tensor y) -> number',\r\n    doc: `向量${d}`, ref: 'Minkowski 距离族', inv: `d(x,y)≥0；d(x,y)=d(y,x)；d(x,x)=0`,\r\n    impl: (x, y) => {\r\n      const a = vec1d(x, 'x'), b = vec1d(y, 'y');\r\n      if (a.length !== b.length) throw new ForgeError('E_SHAPE', `${n} 距离长度不符`);\r\n      if (n === 'chebyshev') { let m = 0; for (let i = 0; i < a.length; i++) m = Math.max(m, Math.abs(a[i] - b[i])); return m; }\r\n      let s = 0;\r\n      for (let i = 0; i < a.length; i++) s += f(a[i] - b[i]);\r\n      return n === 'euclidean' ? Math.sqrt(s) : s;\r\n    },\r\n  });\r\n}\r\n\r\n// ============ 归约族（全元素 -> 标量） ============\r\nconst SCALAR_REDUCTIONS = [\r\n  ['sum', 0, (a, v) => a + v, '总和'],\r\n  ['prod', 1, (a, v) => a * v, '连乘'],\r\n  ['min', Infinity, (a, v) => Math.min(a, v), '最小值'],\r\n  ['max', -Infinity, (a, v) => Math.max(a, v), '最大值'],\r\n];\r\nfor (const [n, init, f, d] of SCALAR_REDUCTIONS) {\r\n  defineOp({\r\n    id: nid(), domain: D, name: `math.${n}`, sig: '(Tensor) -> number', doc: `全元素${d}`,\r\n    ref: 'NumPy reduction', inv: `空集返回 ${init}；${n}(c·x)=c·${n}(x)（sum/prod）`,\r\n    impl: (t) => { const r = reduceTensor(t, null, init, f); return r.tensor.scalar(); },\r\n  });\r\n}\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.mean', sig: '(Tensor) -> number', doc: '全元素均值',\r\n  ref: 'NumPy mean', inv: 'mean(c·x)=c·mean(x)',\r\n  impl: (t) => { const r = reduceTensor(t, null, 0, (a, v) => a + v); return r.tensor.scalar() / r.count; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.var', sig: '(Tensor) -> number', doc: '全元素方差（总体，两遍法数值稳定）',\r\n  ref: 'NumPy var / 统计学定义', inv: 'var≥0；var(c·x)=c²·var(x)',\r\n  impl: (t) => {\r\n    const r = reduceTensor(t, null, 0, (a, v) => a + v);\r\n    const mu = r.tensor.scalar() / r.count;\r\n    const r2 = reduceTensor(t, null, 0, (a, v) => a + (v - mu) * (v - mu));\r\n    return r2.tensor.scalar() / r.count;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.std', sig: '(Tensor) -> number', doc: '全元素标准差 √var',\r\n  ref: 'NumPy std', inv: 'std=√var；std≥0',\r\n  impl: (t) => Math.sqrt(exec('math.var', [t])),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.argmin', sig: '(Tensor) -> number', doc: '最小元素的扁平索引（首个）',\r\n  ref: 'NumPy argmin', inv: 't.at(argmin(t))=min(t)',\r\n  impl: (t) => { let bi = -1, bv = Infinity; for (let i = 0; i < t.size; i++) if (t.data[i] < bv) { bv = t.data[i]; bi = i; } return bi; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.argmax', sig: '(Tensor) -> number', doc: '最大元素的扁平索引（首个）',\r\n  ref: 'NumPy argmax', inv: 't.at(argmax(t))=max(t)',\r\n  impl: (t) => { let bi = -1, bv = -Infinity; for (let i = 0; i < t.size; i++) if (t.data[i] > bv) { bv = t.data[i]; bi = i; } return bi; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.median', sig: '(Tensor) -> number', doc: '中位数（偶数长度取中间两值均值）',\r\n  ref: 'Hampel, Ronchetti, Rousseeuw & Stahel, Robust Statistics: The Approach Based on Influence Functions, 1986',\r\n  inv: '至少一半元素 ≤ median ≤ 另一半',\r\n  impl: (t) => quantileSorted(Array.from(t.data).sort((a, b) => a - b), 0.5),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.quantile', sig: '(Tensor, number q) -> number',\r\n  doc: 'q 分位数（线性插值，NumPy linear 方法）', ref: 'NumPy quantile',\r\n  inv: 'quantile(0)=min；quantile(1)=max；quantile(0.5)=median',\r\n  impl: (t, q) => {\r\n    if (q < 0 || q > 1) throw new ForgeError('E_VALUE', 'q∈[0,1]');\r\n    return quantileSorted(Array.from(t.data).sort((a, b) => a - b), q);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.mad', sig: '(Tensor) -> number',\r\n  doc: '中位数绝对偏差 median(|x−median(x)|)', ref: 'Hampel 1974, JASA 69:383-393; Leys et al. 2013 JESP',\r\n  inv: 'mad≥0；对异常值不敏感（加一个极端值不变）',\r\n  impl: (t) => {\r\n    const sorted = Array.from(t.data).sort((a, b) => a - b);\r\n    const m = quantileSorted(sorted, 0.5);\r\n    const dev = sorted.map(v => Math.abs(v - m)).sort((a, b) => a - b);\r\n    return quantileSorted(dev, 0.5);\r\n  },\r\n});\r\n\r\nfunction quantileSorted(sorted, q) {\r\n  const n = sorted.length;\r\n  if (n === 0) throw new ForgeError('E_VALUE', '空张量无分位数');\r\n  if (n === 1) return sorted[0];\r\n  const pos = q * (n - 1);\r\n  const lo = Math.floor(pos), hi = Math.ceil(pos);\r\n  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);\r\n}\r\n\r\n// ============ 前缀和族 ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.cumsum', sig: '(Tensor) -> Tensor',\r\n  doc: '前缀和（1D）', ref: 'NumPy cumsum', inv: 'cumsum[n−1]=sum；cumsum[k]−cumsum[k−1]=x[k]',\r\n  impl: (t) => {\r\n    const a = vec1d(t, 't');\r\n    const out = new Float64Array(a.length);\r\n    let s = 0;\r\n    for (let i = 0; i < a.length; i++) { s += a[i]; out[i] = s; }\r\n    return new Tensor(out, [a.length]);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.cumprod', sig: '(Tensor) -> Tensor',\r\n  doc: '前缀积（1D）', ref: 'NumPy cumprod', inv: 'cumprod[n−1]=prod',\r\n  impl: (t) => {\r\n    const a = vec1d(t, 't');\r\n    const out = new Float64Array(a.length);\r\n    let s = 1;\r\n    for (let i = 0; i < a.length; i++) { s *= a[i]; out[i] = s; }\r\n    return new Tensor(out, [a.length]);\r\n  },\r\n});\r\n\r\n// ============ 轴归约族（去掉该轴，NumPy keepdims=false 语义） ============\r\nconst AXIS_REDUCTIONS = [\r\n  ['sumAxis', 0, (a, v) => a + v, '求和'],\r\n  ['meanAxis', 0, (a, v) => a + v, '均值'],\r\n  ['maxAxis', -Infinity, (a, v) => Math.max(a, v), '最大值'],\r\n  ['minAxis', Infinity, (a, v) => Math.min(a, v), '最小值'],\r\n];\r\nfor (const [n, init, f, d] of AXIS_REDUCTIONS) {\r\n  defineOp({\r\n    id: nid(), domain: D, name: `math.${n}`, sig: '(Tensor, number axis) -> Tensor', doc: `沿轴${d}`,\r\n    ref: 'NumPy axis reduction', inv: `axis 归约后该轴消失；与逐列循环一致`,\r\n    impl: (t, axis) => {\r\n      const r = reduceTensor(t, [axis], init, f);\r\n      // 去掉长度为 1 的被归约轴（NumPy keepdims=false）\r\n      const outShape = r.tensor.shape.filter((_, i) => !(i === (axis < 0 ? axis + t.ndim : axis)));\r\n      const dropped = r.tensor.reshape(outShape);\r\n      if (n === 'meanAxis') return dropped.map(v => v / t.shape[axis < 0 ? axis + t.ndim : axis]);\r\n      return dropped;\r\n    },\r\n  });\r\n}\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.argmaxAxis', sig: '(Tensor, number axis) -> Tensor',\r\n  doc: '沿轴 argmax（返回扁平前该轴内索引）', ref: 'NumPy argmax(axis)',\r\n  inv: '对每个输出槽位，取到的元素等于该轴最大值',\r\n  impl: (t, axis) => {\r\n    const ax = axis < 0 ? axis + t.ndim : axis;\r\n    const outShape = t.shape.filter((_, i) => i !== ax);\r\n    const out = new Float64Array(coreProd(outShape));\r\n    const inner = t.shape.slice(ax + 1).reduce((a, b) => a * b, 1);\r\n    const outer = t.shape.slice(0, ax).reduce((a, b) => a * b, 1);\r\n    const red = t.shape[ax];\r\n    for (let o = 0; o < outer; o++) for (let i = 0; i < inner; i++) {\r\n      let best = -Infinity, bi = 0;\r\n      for (let r = 0; r < red; r++) {\r\n        const v = t.data[(o * red + r) * inner + i];\r\n        if (v > best) { best = v; bi = r; }\r\n      }\r\n      out[o * inner + i] = bi;\r\n    }\r\n    return new Tensor(out, outShape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.varAxis', sig: '(Tensor, number axis) -> Tensor',\r\n  doc: '沿轴方差（两遍法）', ref: 'NumPy var(axis)', inv: 'varAxis(x,axis).mean(其余轴) ≈ var(x)',\r\n  impl: (t, axis) => {\r\n    const ax = axis < 0 ? axis + t.ndim : axis;\r\n    const m = exec('math.meanAxis', [t, ax]);\r\n    // 逐槽两遍法：先展开每槽均值，再累加平方差\r\n    const outShape = t.shape.filter((_, i) => i !== ax);\r\n    const red = t.shape[ax];\r\n    const out = new Float64Array(coreProd(outShape));\r\n    const inner = t.shape.slice(ax + 1).reduce((a, b) => a * b, 1);\r\n    const outerN = t.shape.slice(0, ax).reduce((a, b) => a * b, 1);\r\n    for (let o = 0; o < outerN; o++) for (let i = 0; i < inner; i++) {\r\n      let s = 0;\r\n      const mu = m.data[o * inner + i];\r\n      for (let r2 = 0; r2 < red; r2++) { const v = t.data[(o * red + r2) * inner + i]; s += (v - mu) * (v - mu); }\r\n      out[o * inner + i] = s / red;\r\n    }\r\n    return new Tensor(out, outShape);\r\n  },\r\n});\r\n\r\n// ============ 构造器 ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.zeros', sig: '(number[] shape) -> Tensor', doc: '全零张量',\r\n  ref: 'NumPy zeros', inv: '所有元素为 0', impl: (shape) => Tensor.zeros(shape),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.ones', sig: '(number[] shape) -> Tensor', doc: '全一张量',\r\n  ref: 'NumPy ones', inv: '所有元素为 1', impl: (shape) => Tensor.ones(shape),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.full', sig: '(number[] shape, number v) -> Tensor', doc: '常数张量',\r\n  ref: 'NumPy full', inv: '所有元素为 v', impl: (shape, v) => Tensor.full(shape, v),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.eye', sig: '(number n, number m?) -> Tensor', doc: '单位矩阵',\r\n  ref: 'NumPy eye', inv: 'eye·A=A；eye 对称', impl: (n, m) => Tensor.eye(n, m ?? n),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.arange', sig: '(number stop, number start?, number step?) -> Tensor',\r\n  doc: '等差序列', ref: 'NumPy arange', inv: '长度=ceil((stop−start)/step)',\r\n  impl: (stop, start, step) => Tensor.arange(stop, start ?? 0, step ?? 1),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.linspace', sig: '(number a, number b, number n) -> Tensor',\r\n  doc: '闭区间等分', ref: 'NumPy linspace', inv: '首=a 尾=b；相邻差=(b−a)/(n−1)',\r\n  impl: (a, b, n) => Tensor.linspace(a, b, n),\r\n});\r\n\r\n// ============ 形状操作 ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.concat', sig: '(Tensor[] ts, number axis?) -> Tensor',\r\n  doc: '沿轴拼接（非轴维必须一致）', ref: 'NumPy concatenate',\r\n  inv: '拼接后该轴长度=各输入该轴长度之和',\r\n  impl: (ts, axis = 0) => {\r\n    if (!Array.isArray(ts) || ts.length === 0) throw new ForgeError('E_VALUE', 'concat 需要非空张量数组');\r\n    const ax = axis < 0 ? axis + ts[0].ndim : axis;\r\n    for (const t of ts) {\r\n      expectTensor(t, 't');\r\n      if (t.ndim !== ts[0].ndim) throw new ForgeError('E_SHAPE', 'concat 维数不一致');\r\n      for (let i = 0; i < t.ndim; i++) if (i !== ax && t.shape[i] !== ts[0].shape[i]) throw new ForgeError('E_SHAPE', `concat 非轴维不一致: 轴${i}`);\r\n    }\r\n    const outShape = ts[0].shape.slice();\r\n    outShape[ax] = ts.reduce((s, t) => s + t.shape[ax], 0);\r\n    const out = new Float64Array(coreProd(outShape));\r\n    const inner = outShape.slice(ax + 1).reduce((a, b) => a * b, 1);\r\n    const outer = outShape.slice(0, ax).reduce((a, b) => a * b, 1);\r\n    let off = 0;\r\n    for (const t of ts) {\r\n      const block = t.shape[ax] * inner;\r\n      for (let o = 0; o < outer; o++) {\r\n        out.set(t.data.subarray(o * block, (o + 1) * block), (o * outShape[ax] + off) * inner);\r\n      }\r\n      off += t.shape[ax];\r\n    }\r\n    return new Tensor(out, outShape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.stack', sig: '(Tensor[] ts, number axis?) -> Tensor',\r\n  doc: '沿新轴堆叠', ref: 'NumPy stack', inv: '结果维数=输入维数+1；新轴长度=输入个数',\r\n  impl: (ts, axis = 0) => {\r\n    if (!Array.isArray(ts) || ts.length === 0) throw new ForgeError('E_VALUE', 'stack 需要非空张量数组');\r\n    const n = ts.length;\r\n    const expanded = ts.map(t => t.reshape(...insertOne(t.shape, axis < 0 ? axis + t.ndim + 1 : axis, 1)));\r\n    return exec('math.concat', [expanded, axis < 0 ? axis + t0ndim(expanded) : axis]);\r\n  },\r\n});\r\nfunction insertOne(shape, at, v) { const s = shape.slice(); s.splice(at, 0, v); return s; }\r\nfunction t0ndim(ts) { return ts[0].ndim; }\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.tile', sig: '(Tensor t, number[] reps) -> Tensor',\r\n  doc: '整体复制拼接', ref: 'NumPy tile', inv: '结果形状=逐维乘 reps',\r\n  impl: (t, reps) => {\r\n    expectTensor(t, 't');\r\n    const outShape = t.shape.map((d, i) => d * (reps[i] ?? 1));\r\n    const out = new Float64Array(coreProd(outShape));\r\n    const idx = new Array(t.ndim);\r\n    for (let p = 0; p < out.length; p++) {\r\n      let r = p;\r\n      for (let d = t.ndim - 1; d >= 0; d--) { idx[d] = r % outShape[d]; r = (r - idx[d]) / outShape[d]; }\r\n      const st = stridesOf(t.shape);\r\n      let src = 0;\r\n      for (let d = 0; d < t.ndim; d++) src += (idx[d] % t.shape[d]) * st[d];\r\n      out[p] = t.data[src];\r\n    }\r\n    return new Tensor(out, outShape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.pad', sig: '(Tensor t, number[][] pads, number v?) -> Tensor',\r\n  doc: '常数填充（pads=[[前,后],...] 每维一对）', ref: 'NumPy pad',\r\n  inv: '输出形状=原形状+前后填充；填充区=v（默认 0）',\r\n  impl: (t, pads, v = 0) => {\r\n    expectTensor(t, 't');\r\n    if (pads.length !== t.ndim) throw new ForgeError('E_SHAPE', 'pads 维数不符');\r\n    const outShape = t.shape.map((d, i) => d + pads[i][0] + pads[i][1]);\r\n    const out = new Float64Array(coreProd(outShape)).fill(v);\r\n    const inner = t.shape.slice(1).reduce((a, b) => a * b, 1);\r\n    for (let i = 0; i < t.shape[0]; i++) {\r\n      const srcOff = i * inner;\r\n      const dstOff = (i + pads[0][0]) * (outShape.slice(1).reduce((a, b) => a * b, 1));\r\n      out.set(t.data.subarray(srcOff, srcOff + inner), dstOff);\r\n    }\r\n    return new Tensor(out, outShape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.clamp', sig: '(Tensor t, number lo, number hi) -> Tensor',\r\n  doc: '截断到 [lo,hi]', ref: 'NumPy clip', inv: 'clamp(clamp(x)) = clamp(x)',\r\n  impl: (t, lo, hi) => { expectTensor(t, 't'); if (lo > hi) throw new ForgeError('E_VALUE', 'lo>hi'); return t.map(v => Math.min(Math.max(v, lo), hi)); },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'math.where', sig: '(Tensor mask, Tensor a, Tensor b) -> Tensor',\r\n  doc: '按掩码选择：mask≠0 取 a 否则取 b（NumPy 广播）', ref: 'NumPy where',\r\n  inv: 'where(1,a,b)=a；where(0,a,b)=b',\r\n  impl: (mask, a, b) => {\r\n    expectTensor(mask, 'mask'); expectTensor(a, 'a'); expectTensor(b, 'b');\r\n    const outShape = broadcastShapes(broadcastShapes(mask.shape, a.shape), b.shape);\r\n    const zeros = Tensor.zeros(outShape);\r\n    // 借广播把三方对齐到同一形状后逐元素选择\r\n    const M = elementwise(mask, zeros, (x) => x);\r\n    const A = elementwise(a, zeros, (x) => x);\r\n    const B = elementwise(b, zeros, (x) => x);\r\n    const out = new Float64Array(outShape.reduce((x, y) => x * y, 1));\r\n    for (let i = 0; i < out.length; i++) out[i] = M.data[i] !== 0 ? A.data[i] : B.data[i];\r\n    return new Tensor(out, outShape);\r\n  },\r\n});\r\n\r\n// 文件底部自检：本域必须恰好 102 条\r\nif (opsByDomain(D).length !== 102) {\r\n  throw new Error(`域${D}(MATH) 指令数 = ${opsByDomain(D).length}，应为 102`);\r\n}\r\n",
"src/ops/d2-num.mjs":"// 域2 数值方法与数值稳定化 NUM（102 条微指令）\r\n// 内容：稳定 softmax/logsumexp、补偿求和（Kahan/Neumaier/成对）、误差度量、\r\n// 求根（二分/割线/Newton/Brent/Ridder）、积分（梯形/Simpson/Romberg）、\r\n// 有限差分、插值、特殊函数（erf/gamma/Lanczos/逆正态）、双精度倍精度算术（double-double）、\r\n// Welford 在线统计、输入守卫族。\r\n// 参考：Higham《Accuracy and Stability of Numerical Algorithms》；\r\n//       Numerical Recipes 3rd ed.（erf/gamma/求根/积分）；Dekker 1971（双精度倍精度）。\r\nimport { defineOp, opsByDomain, exec } from '../core/registry.mjs';\r\nimport { ForgeError } from '../core/errors.mjs';\r\nimport { Tensor, prod as coreProd, expectTensor } from '../core/tensor.mjs';\r\n\r\nconst D = 2;\r\nlet _s = 0;\r\nconst nid = () => `D${D}-${String(++_s).padStart(3, '0')}`;\r\n\r\nfunction vec(t) { expectTensor(t, 't'); return t.data; }\r\n\r\n// ============ A. 稳定化核心（14 条） ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.softmax', arity: 1,\r\n  sig: '(Tensor x, number axis=-1) -> Tensor', doc: '数值稳定 softmax（先减轴最大值）',\r\n  ref: '深度学习标准实践 / cs231n', inv: '沿 axis 每片和=1；输入整体平移不变',\r\n  impl: (x, axis = -1) => {\r\n    expectTensor(x, 'x');\r\n    const ax = axis < 0 ? axis + x.ndim : axis;\r\n    const m = exec('math.maxAxis', [x, ax]);\r\n    const e = x.map((v, i) => {\r\n      // 逐元素 exp(x - max_axis)\r\n      const idx = decodeIdx(i, x.shape);\r\n      const mi = m.data[flatWithRemoved(idx, ax, m.shape)];\r\n      return Math.exp(v - mi);\r\n    });\r\n    const s = exec('math.sumAxis', [e, ax]);\r\n    const out = new Float64Array(e.size);\r\n    for (let i = 0; i < e.size; i++) {\r\n      const idx = decodeIdx(i, x.shape);\r\n      const si = s.data[flatWithRemoved(idx, ax, s.shape)];\r\n      out[i] = e.data[i] / si;\r\n    }\r\n    return new Tensor(out, x.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.logSoftmax', arity: 1,\r\n  sig: '(Tensor x, number axis=-1) -> Tensor', doc: '稳定 log-softmax = x - max - logsumexp',\r\n  ref: 'PyTorch LogSoftmax', inv: 'exp(logSoftmax) 与 softmax 一致；不会下溢',\r\n  impl: (x, axis = -1) => {\r\n    expectTensor(x, 'x');\r\n    const ax = axis < 0 ? axis + x.ndim : axis;\r\n    const lse = exec('num.logsumexp', [x, ax]);\r\n    const out = new Float64Array(x.size);\r\n    for (let i = 0; i < x.size; i++) {\r\n      const idx = decodeIdx(i, x.shape);\r\n      const li = lse.data[flatWithRemoved(idx, ax, lse.shape)];\r\n      out[i] = x.data[i] - li; // logSoftmax = x - logsumexp(x)\r\n    }\r\n    return new Tensor(out, x.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.logsumexp', arity: 1,\r\n  sig: '(Tensor x, number axis=-1) -> Tensor', doc: '稳定 logΣexp（max 平移 + log）',\r\n  ref: 'log-sum-exp trick（数值计算标准技巧）', inv: 'exp(logsumexp)=Σexp（不溢出）',\r\n  impl: (x, axis = -1) => {\r\n    expectTensor(x, 'x');\r\n    const ax = axis < 0 ? axis + x.ndim : axis;\r\n    const m = exec('math.maxAxis', [x, ax]);\r\n    const out = new Float64Array(m.size);\r\n    for (let i = 0; i < x.size; i++) {\r\n      const idx = decodeIdx(i, x.shape);\r\n      const mi = m.data[flatWithRemoved(idx, ax, m.shape)];\r\n      const q = flatWithRemoved(idx, ax, m.shape);\r\n      out[q] += Math.exp(x.data[i] - mi);\r\n    }\r\n    for (let q = 0; q < out.length; q++) out[q] = m.data[q] + Math.log(out[q]);\r\n    // 重新整形为去掉该轴的\r\n    const outShape = m.shape.filter((_, i) => i !== ax);\r\n    return new Tensor(out, outShape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.sigmoid', sig: '(Tensor) -> Tensor', doc: '稳定 sigmoid（分支防 exp 溢出）',\r\n  ref: 'Logistic 函数标准实现', inv: 'sigmoid(0)=0.5；sigmoid(-x)=1-sigmoid(x)；x=±1000 不溢出',\r\n  impl: (t) => t.map((v) => (v >= 0 ? 1 / (1 + Math.exp(-v)) : Math.exp(v) / (1 + Math.exp(v)))),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.stableExp', sig: '(Tensor) -> Tensor', doc: '饱和 exp（x>709 返回 Inf，x<-745 返回 0）',\r\n  ref: 'IEEE 754 双精度指数定义域', inv: '与 Math.exp 在定义域内一致；永不返回 NaN',\r\n  impl: (t) => t.map((v) => (v > 709 ? Infinity : v < -745 ? 0 : Math.exp(v))),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.safeLog', sig: '(Tensor) -> Tensor', doc: '对数（x=0→-Inf，x<0→NaN，文档化契约）',\r\n  ref: 'IEEE 754 log', inv: 'safeLog(e^x)=x（x 有限）；safeLog(0)=-Inf',\r\n  impl: (t) => t.map((v) => (v > 0 ? Math.log(v) : v === 0 ? -Infinity : NaN)),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.safeDiv', arity: 2, sig: '(Tensor a, Tensor b) -> Tensor',\r\n  doc: 'IEEE 语义除法（0/0=NaN，x/0=±Inf）', ref: 'IEEE 754', inv: '与 JS / 一致且对零不抛错',\r\n  impl: (a, b) => {\r\n    expectTensor(a, 'a'); expectTensor(b, 'b');\r\n    const out = new Float64Array(a.size);\r\n    for (let i = 0; i < a.size; i++) out[i] = a.data[i] / b.data[i % b.size];\r\n    return new Tensor(out, a.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.safeSqrt', sig: '(Tensor) -> Tensor', doc: '平方根（x<0→NaN）',\r\n  ref: 'IEEE 754', inv: 'safeSqrt(x²)=|x|', impl: (t) => t.map((v) => (v < 0 ? NaN : Math.sqrt(v))),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.safePow', arity: 2, sig: '(Tensor base, Tensor exp) -> Tensor',\r\n  doc: '幂运算（负底非整数指数→NaN，0^0=1）', ref: 'IEEE 754 pow', inv: '与 Math.pow 一致且零不抛错',\r\n  impl: (a, b) => {\r\n    expectTensor(a, 'a'); expectTensor(b, 'b');\r\n    const out = new Float64Array(a.size);\r\n    for (let i = 0; i < a.size; i++) out[i] = Math.pow(a.data[i], b.data[i % b.size]);\r\n    return new Tensor(out, a.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.softplus', sig: '(Tensor) -> Tensor', doc: '稳定 softplus log(1+e^x)（大 x 线性外推）',\r\n  ref: 'Dugas et al. 2001（将 softplus 引入神经网络）', inv: 'softplus(x)≈max(x,0)（|x| 大时）；softplus(0)=ln2',\r\n  impl: (t) => t.map((v) => (v > 30 ? v : v < -30 ? Math.exp(v) : Math.log1p(Math.exp(v)))),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.kahanSum', sig: '(Tensor) -> number', doc: 'Kahan 补偿求和（消除累计舍入）',\r\n  ref: 'Kahan 1965', inv: '对 [1e16,1,-1e16] 返回 1（朴素求和返回 0）',\r\n  impl: (t) => {\r\n    let s = 0, c = 0;\r\n    for (let i = 0; i < t.size; i++) {\r\n      const y = t.data[i] - c;\r\n      const tt = s + y;\r\n      c = (tt - s) - y;\r\n      s = tt;\r\n    }\r\n    return s;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.neumaierSum', sig: '(Tensor) -> number', doc: 'Neumaier 改进补偿求和',\r\n  ref: 'Neumaier 1974', inv: '精度 ≥ Kahan；处理大小悬殊序列',\r\n  impl: (t) => {\r\n    let s = 0, c = 0;\r\n    for (let i = 0; i < t.size; i++) {\r\n      const x = t.data[i];\r\n      const tt = s + x;\r\n      if (Math.abs(s) >= Math.abs(x)) c += (s - tt) + x;\r\n      else c += (x - tt) + s;\r\n      s = tt;\r\n    }\r\n    return s + c;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.pairwiseSum', sig: '(Tensor) -> number', doc: '成对递归求和（误差 O(log n)）',\r\n  ref: '成对求和 / BLAS 累加策略', inv: '精度 ≥ 顺序求和；与 Kahan 同量级',\r\n  impl: (t) => {\r\n    const a = t.data;\r\n    const rec = (lo, hi) => {\r\n      const n = hi - lo;\r\n      if (n <= 128) { let s = 0; for (let i = lo; i < hi; i++) s += a[i]; return s; }\r\n      const mid = lo + (n >> 1);\r\n      return rec(lo, mid) + rec(mid, hi);\r\n    };\r\n    return rec(0, a.length);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.naiveSum', sig: '(Tensor) -> number', doc: '朴素顺序求和（精度基准，供对比）',\r\n  ref: 'IEEE 754 顺序累加', inv: '与手写 for 循环完全一致',\r\n  impl: (t) => { let s = 0; for (let i = 0; i < t.size; i++) s += t.data[i]; return s; },\r\n});\r\n\r\n// ============ B. 误差度量（9 条） ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.absErr', arity: 2, sig: '(number a, number b) -> number',\r\n  doc: '绝对误差 |a-b|', ref: '数值分析定义', inv: 'absErr(a,a)=0', impl: (a, b) => Math.abs(a - b),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.relErr', arity: 2, sig: '(number a, number b) -> number',\r\n  doc: '相对误差 |a-b|/max(|a|,|b|,1)', ref: '数值分析定义', inv: 'relErr(a,a)=0；对称',\r\n  impl: (a, b) => Math.abs(a - b) / Math.max(1e-300, Math.abs(a), Math.abs(b)),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.ulpErr', arity: 2, sig: '(number a, number b) -> number',\r\n  doc: 'ULP 差异 |a-b|/ulp(max(|a|,|b|))', ref: 'IEEE 754 ulp 概念', inv: '同数返回 0；相邻浮点返回 1',\r\n  impl: (a, b) => {\r\n    const u = exec('num.ulp', [Math.max(Math.abs(a), Math.abs(b))]);\r\n    return u === 0 ? 0 : Math.abs(a - b) / u;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.mae', arity: 2, sig: '(Tensor a, Tensor b) -> number',\r\n  doc: '平均绝对误差', ref: '回归评估标准', inv: 'mae(a,a)=0',\r\n  impl: (a, b) => meanAbs(a, b),\r\n});\r\nfunction meanAbs(a, b) { let s = 0; for (let i = 0; i < a.size; i++) s += Math.abs(a.data[i] - b.data[i % b.size]); return s / a.size; }\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.mse', arity: 2, sig: '(Tensor a, Tensor b) -> number',\r\n  doc: '均方误差', ref: '回归评估标准', inv: 'mse(a,a)=0；mse≥0',\r\n  impl: (a, b) => { let s = 0; for (let i = 0; i < a.size; i++) { const d = a.data[i] - b.data[i % b.size]; s += d * d; } return s / a.size; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.rmse', arity: 2, sig: '(Tensor a, Tensor b) -> number',\r\n  doc: '均方根误差 √mse', ref: '回归评估标准', inv: 'rmse=√mse',\r\n  impl: (a, b) => Math.sqrt(exec('num.mse', [a, b])),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.mape', arity: 2, sig: '(Tensor a, Tensor b) -> number',\r\n  doc: '平均绝对百分比误差（b=0 项跳过）', ref: '预测评估标准', inv: '完美预测返回 0',\r\n  impl: (a, b) => {\r\n    let s = 0, n = 0;\r\n    for (let i = 0; i < a.size; i++) { const bb = b.data[i % b.size]; if (bb === 0) continue; s += Math.abs((a.data[i] - bb) / bb); n++; }\r\n    return n === 0 ? NaN : s / n;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.maxAbsErr', arity: 2, sig: '(Tensor a, Tensor b) -> number',\r\n  doc: '最大绝对误差（L∞ 误差）', ref: 'Higham 2002, Accuracy and Stability of Numerical Algorithms, §1.2', inv: '≥ mae；=0 ⟺ 相等',\r\n  impl: (a, b) => { let m = 0; for (let i = 0; i < a.size; i++) m = Math.max(m, Math.abs(a.data[i] - b.data[i % b.size])); return m; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.medAbsErr', arity: 2, sig: '(Tensor a, Tensor b) -> number',\r\n  doc: '中位数绝对误差（稳健）', ref: 'Hampel 1974, JASA 69:383-393 (robust scale estimator)', inv: '对异常值不敏感',\r\n  impl: (a, b) => {\r\n    const ds = [];\r\n    for (let i = 0; i < a.size; i++) ds.push(Math.abs(a.data[i] - b.data[i % b.size]));\r\n    ds.sort((x, y) => x - y);\r\n    const n = ds.length;\r\n    return n % 2 ? ds[(n - 1) / 2] : (ds[n / 2 - 1] + ds[n / 2]) / 2;\r\n  },\r\n});\r\n\r\n// ============ C. 比较与守卫（8 条） ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.isclose', arity: 2, sig: '(number a, number b, number rtol=1e-5, number atol=1e-8) -> boolean',\r\n  doc: '逐对近似相等（NumPy isclose 语义）', ref: 'NumPy isclose', inv: 'isclose(a,a)=true；isclose(a,b)=isclose(b,a)',\r\n  impl: (a, b, rtol = 1e-5, atol = 1e-8) => Math.abs(a - b) <= atol + rtol * Math.max(Math.abs(a), Math.abs(b)),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.allclose', arity: 2, sig: '(Tensor a, Tensor b, number rtol=1e-5, number atol=1e-8) -> boolean',\r\n  doc: '张量逐元素近似相等（NumPy allclose）', ref: 'NumPy allclose', inv: '形状必须一致',\r\n  impl: (a, b, rtol = 1e-5, atol = 1e-8) => {\r\n    expectTensor(a, 'a'); expectTensor(b, 'b');\r\n    if (a.size !== b.size) throw new ForgeError('E_SHAPE', 'allclose 形状不符');\r\n    for (let i = 0; i < a.size; i++) if (!exec('num.isclose', [a.data[i], b.data[i], rtol, atol])) return false;\r\n    return true;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.arrayEqual', arity: 2, sig: '(Tensor a, Tensor b) -> boolean',\r\n  doc: '精确逐元素相等（含 NaN 位模式）', ref: 'NumPy array_equal', inv: 'arrayEqual(a,a)=true',\r\n  impl: (a, b) => {\r\n    expectTensor(a, 'a'); expectTensor(b, 'b');\r\n    if (a.size !== b.size) return false;\r\n    for (let i = 0; i < a.size; i++) {\r\n      const x = a.data[i], y = b.data[i];\r\n      if (Number.isNaN(x) && Number.isNaN(y)) continue;\r\n      if (x !== y) return false;\r\n    }\r\n    return true;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.isfiniteAll', sig: '(Tensor) -> boolean', doc: '全部元素有限',\r\n  ref: 'IEEE 754 isFinite', inv: '无 NaN/Inf 返回 true', impl: (t) => t.data.every(Number.isFinite),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.countNaN', sig: '(Tensor) -> number', doc: 'NaN 计数',\r\n  ref: 'IEEE 754', inv: 'countNaN ≤ size', impl: (t) => { let n = 0; for (const v of t.data) if (Number.isNaN(v)) n++; return n; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.countInf', sig: '(Tensor) -> number', doc: '±Inf 计数',\r\n  ref: 'IEEE 754', inv: 'countInf ≤ size', impl: (t) => { let n = 0; for (const v of t.data) if (!Number.isFinite(v) && !Number.isNaN(v)) n++; return n; },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.nanToZero', sig: '(Tensor) -> Tensor', doc: 'NaN 置零（Inf 保留）',\r\n  ref: '数据清洗常见操作', inv: '结果无 NaN', impl: (t) => t.map((v) => (Number.isNaN(v) ? 0 : v)),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.sanitize', arity: 3, sig: '(Tensor t, number lo, number hi) -> Tensor',\r\n  doc: '清洗：NaN→lo，+Inf→hi，-Inf→lo，其余不变', ref: '数据清洗 / 梯度爆炸防护',\r\n  inv: '结果全部有限', impl: (t, lo, hi) => t.map((v) => (Number.isNaN(v) ? lo : v === Infinity ? hi : v === -Infinity ? lo : v)),\r\n});\r\n\r\n// ============ D. 求根（6 条） ============\r\nfunction rootOpts(opts = {}) {\r\n  return { tol: opts.tol ?? 1e-12, maxIter: opts.maxIter ?? 100 };\r\n}\r\nfunction rootResult(x, iters, converged, fx) { return { root: x, iters, converged, fx }; }\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.bisect', arity: 3,\r\n  sig: '(Function f, number a, number b, object opts?) -> object', doc: '二分法求根（需 f(a)·f(b)<0）',\r\n  ref: 'Numerical Recipes §9.1', inv: '收敛速度每次减半；结果 bracket 宽度 ≤ tol',\r\n  impl: (f, a, b, opts = {}) => {\r\n    const { tol, maxIter } = rootOpts(opts);\r\n    let fa = f(a), fb = f(b);\r\n    if (fa * fb > 0) throw new ForgeError('E_VALUE', 'bisect 需要 f(a)·f(b)<0');\r\n    let lo = a, hi = b, flo = fa, it = 0;\r\n    for (; it < maxIter; it++) {\r\n      const mid = (lo + hi) / 2;\r\n      const fm = f(mid);\r\n      if (fm === 0 || (hi - lo) / 2 <= tol) return rootResult(mid, it + 1, true, fm);\r\n      if (flo * fm < 0) { hi = mid; } else { lo = mid; flo = fm; }\r\n    }\r\n    return rootResult((lo + hi) / 2, it, false, f((lo + hi) / 2));\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.secant', arity: 3,\r\n  sig: '(Function f, number x0, number x1, object opts?) -> object', doc: '割线法求根（超线性收敛）',\r\n  ref: 'Numerical Recipes §9.2', inv: '光滑函数上快于二分',\r\n  impl: (f, x0, x1, opts = {}) => {\r\n    const { tol, maxIter } = rootOpts(opts);\r\n    let a = x0, b = x1, fa = f(a), fb = f(b);\r\n    for (let it = 0; it < maxIter; it++) {\r\n      if (Math.abs(fb - fa) < 1e-300) return rootResult(b, it, false, fb);\r\n      const c = b - fb * (b - a) / (fb - fa);\r\n      const fc = f(c);\r\n      if (Math.abs(fc) <= tol || Math.abs(c - b) <= tol) return rootResult(c, it + 1, true, fc);\r\n      a = b; fa = fb; b = c; fb = fc;\r\n    }\r\n    return rootResult(b, maxIter, false, fb);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.newton', arity: 2,\r\n  sig: '(Function f, number x0, object opts?) -> object', doc: 'Newton 法（中心差分数值导数，二阶收敛）',\r\n  ref: 'Newton-Raphson / Numerical Recipes §9.4', inv: '单根附近二次收敛',\r\n  impl: (f, x0, opts = {}) => {\r\n    const { tol, maxIter } = rootOpts(opts);\r\n    let x = x0;\r\n    for (let it = 0; it < maxIter; it++) {\r\n      const h = Math.max(1e-7, Math.abs(x) * 1e-7);\r\n      const d = (f(x + h) - f(x - h)) / (2 * h);\r\n      if (!Number.isFinite(d) || d === 0) return rootResult(x, it, false, f(x));\r\n      const xn = x - f(x) / d;\r\n      if (Math.abs(xn - x) <= tol) return rootResult(xn, it + 1, true, f(xn));\r\n      x = xn;\r\n    }\r\n    return rootResult(x, maxIter, false, f(x));\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.brent', arity: 3,\r\n  sig: '(Function f, number a, number b, object opts?) -> object', doc: 'Brent 法（逆二次插值+二分保障，鲁棒且快）',\r\n  ref: 'Brent 1973, Algorithms for Minimization Without Derivatives；Numerical Recipes §9.3',\r\n  inv: '保收敛性；通常远少于二分的迭代次数',\r\n  impl: (f, a, b, opts = {}) => {\r\n    const { tol, maxIter } = rootOpts(opts);\r\n    let fa = f(a), fb = f(b);\r\n    if (fa * fb > 0) throw new ForgeError('E_VALUE', 'brent 需要 f(a)·f(b)<0');\r\n    let c = a, fc = fa, d = b - a, e = d;\r\n    for (let it = 1; it <= maxIter; it++) {\r\n      if (fb * fc > 0) { c = a; fc = fa; d = b - a; e = d; }\r\n      if (Math.abs(fc) < Math.abs(fb)) { [a, b, c] = [b, c, b]; [fa, fb, fc] = [fb, fc, fb]; }\r\n      const tol1 = 2 * Number.EPSILON * Math.abs(b) + 0.5 * tol;\r\n      const xm = 0.5 * (c - b);\r\n      if (Math.abs(xm) <= tol1 || fb === 0) return rootResult(b, it, true, fb);\r\n      if (Math.abs(e) >= tol1 && Math.abs(fa) > Math.abs(fb)) {\r\n        const s = fb / fa;\r\n        let p, q;\r\n        if (a === c) { p = 2 * xm * s; q = 1 - s; }\r\n        else { q = fa / fc; const r = fb / fc; p = s * (2 * xm * q * (q - r) - (b - a) * (r - 1)); q = (q - 1) * (r - 1) * (s - 1); }\r\n        if (p > 0) q = -q;\r\n        p = Math.abs(p);\r\n        const min1 = 3 * xm * q - Math.abs(tol1 * q);\r\n        const min2 = Math.abs(e * q);\r\n        if (2 * p < Math.min(min1, min2)) { e = d; d = p / q; } else { d = xm; e = d; }\r\n      } else { d = xm; e = d; }\r\n      a = b; fa = fb;\r\n      if (Math.abs(d) > tol1) b += d; else b += Math.sign(xm) * tol1;\r\n      fb = f(b);\r\n    }\r\n    return rootResult(b, maxIter, false, fb);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.ridder', arity: 3,\r\n  sig: '(Function f, number a, number b, object opts?) -> object', doc: 'Ridder 法（指数插值，保区间）',\r\n  ref: 'Ridder 1979', inv: '收敛快于二分；区间始终含根',\r\n  impl: (f, a, b, opts = {}) => {\r\n    const { tol, maxIter } = rootOpts(opts);\r\n    let fa = f(a), fb = f(b);\r\n    if (fa * fb > 0) throw new ForgeError('E_VALUE', 'ridder 需要 f(a)·f(b)<0');\r\n    for (let it = 1; it <= maxIter; it++) {\r\n      const c = 0.5 * (a + b);\r\n      const fc = f(c);\r\n      const s = Math.sqrt(fc * fc - fa * fb);\r\n      if (s === 0) return rootResult(c, it, true, fc);\r\n      // 标准 Ridder 更新：x = c + (c-a)·sign(fa-fb)·fc/s（Wikipedia / NR 变体）\r\n      const x = c + (c - a) * Math.sign(fa - fb) * fc / s;\r\n      const fx = f(x);\r\n      if (fx === 0 || Math.abs(x - c) <= tol) return rootResult(x, it, true, fx);\r\n      // 更新 bracket：始终包含根\r\n      if (Math.sign(fx) !== Math.sign(fc)) { a = c; fa = fc; } else { b = c; fb = fc; }\r\n      if (Math.sign(fa) !== Math.sign(fx)) { b = x; fb = fx; } else { a = x; fa = fx; }\r\n    }\r\n    return rootResult(0.5 * (a + b), maxIter, false, f(0.5 * (a + b)));\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.rootScan', arity: 3,\r\n  sig: '(Function f, number a, number b, number n) -> number[][]', doc: '扫描区间找全部符号变化 bracket',\r\n  ref: '符号扫描（工程求根常用）', inv: '每个返回 bracket 满足 f(lo)·f(hi)≤0',\r\n  impl: (f, a, b, n = 100) => {\r\n    const out = [];\r\n    let x0 = a, f0 = f(a);\r\n    for (let i = 1; i <= n; i++) {\r\n      const x1 = a + (b - a) * i / n;\r\n      const f1 = f(x1);\r\n      if (f0 === 0) out.push([x0, x0]);\r\n      else if (f0 * f1 < 0) out.push([x0, x1]);\r\n      x0 = x1; f0 = f1;\r\n    }\r\n    return out;\r\n  },\r\n});\r\n\r\n// ============ E. 积分（5 条） ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.trapz', arity: 1, sig: '(Tensor y, Tensor x?) -> number',\r\n  doc: '梯形法积分（非均匀步长）', ref: 'Numerical Recipes §4.1', inv: '对线性函数精确',\r\n  impl: (y, x) => {\r\n    if (x === undefined) { let s = 0; for (let i = 1; i < y.size; i++) s += (y.data[i] + y.data[i - 1]) / 2; return s; }\r\n    let s = 0;\r\n    for (let i = 1; i < y.size; i++) s += (y.data[i] + y.data[i - 1]) / 2 * (x.data[i] - x.data[i - 1]);\r\n    return s;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.cumtrapz', arity: 1, sig: '(Tensor y, Tensor x?) -> Tensor',\r\n  doc: '累积梯形积分', ref: 'NumPy cumtrapz', inv: '末元素 = trapz(y)',\r\n  impl: (y, x) => {\r\n    const out = new Float64Array(y.size);\r\n    let acc = 0;\r\n    for (let i = 1; i < y.size; i++) {\r\n      const h = x ? x.data[i] - x.data[i - 1] : 1;\r\n      acc += (y.data[i] + y.data[i - 1]) / 2 * h;\r\n      out[i] = acc;\r\n    }\r\n    return new Tensor(out, y.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.simpson', arity: 1, sig: '(Tensor y, Tensor x?) -> number',\r\n  doc: 'Simpson 1/3 法（均匀步长；奇数区间末段退化梯形）', ref: 'Numerical Recipes §4.1',\r\n  inv: '对三次及以下多项式精确',\r\n  impl: (y, x) => {\r\n    const n = y.size;\r\n    if (n < 3) return exec('num.trapz', [y, x]);\r\n    const h = x ? x.data[1] - x.data[0] : 1;\r\n    let m = n - 1; // 区间数\r\n    let pts = n;\r\n    if (m % 2 === 1) pts = n - 1; // 奇数区间：末段改用梯形\r\n    let s = y.data[0] + y.data[pts - 1];\r\n    for (let j = 1; j < pts - 1; j++) s += (j % 2 === 1 ? 4 : 2) * y.data[j];\r\n    let result = h * s / 3;\r\n    if (m % 2 === 1) result += h * (y.data[n - 2] + y.data[n - 1]) / 2;\r\n    return result;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.midpoint', arity: 1, sig: '(Function f, number a, number b, number n) -> number',\r\n  doc: '中点法（函数形式）', ref: 'Numerical Recipes §4.1', inv: 'n 加倍误差约减半',\r\n  impl: (f, a, b, n = 100) => {\r\n    const h = (b - a) / n;\r\n    let s = 0;\r\n    for (let i = 0; i < n; i++) s += f(a + (i + 0.5) * h);\r\n    return s * h;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.romberg', arity: 1,\r\n  sig: '(Function f, number a, number b, number levels=6) -> number', doc: 'Romberg 积分（ Richardson 外提加速）',\r\n  ref: 'Romberg 1955 / Numerical Recipes §4.3', inv: '每级精度量级提升',\r\n  impl: (f, a, b, levels = 6) => {\r\n    const R = [];\r\n    let h = b - a;\r\n    R.push([h * (f(a) + f(b)) / 2]);\r\n    for (let i = 1; i < levels; i++) {\r\n      h /= 2;\r\n      let s = 0;\r\n      const n = 2 ** (i - 1);\r\n      for (let k = 0; k < n; k++) s += f(a + (2 * k + 1) * h);\r\n      R.push([0.5 * R[i - 1][0] + s * h]);\r\n      for (let j = 1; j <= i; j++) {\r\n        R[i].push(R[i][j - 1] + (R[i][j - 1] - R[i - 1][j - 1]) / (4 ** j - 1));\r\n      }\r\n    }\r\n    return R[levels - 1][levels - 1];\r\n  },\r\n});\r\n\r\n// ============ F. 有限差分（5 条） ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.diff', arity: 1, sig: '(Tensor y, number n=1) -> Tensor',\r\n  doc: 'n 阶前向差分', ref: 'NumPy diff', inv: '每阶长度减 1；常数序列一阶分为 0',\r\n  impl: (y, n = 1) => {\r\n    let cur = y;\r\n    for (let k = 0; k < n; k++) {\r\n      const out = new Float64Array(Math.max(0, cur.size - 1));\r\n      for (let i = 1; i < cur.size; i++) out[i - 1] = cur.data[i] - cur.data[i - 1];\r\n      cur = new Tensor(out, [out.length]);\r\n    }\r\n    return cur;\r\n  },\r\n});\r\n// 标量提取：f 既可直接返回 number，也可返回 size=1 的 Tensor（gradcheck 的常见写法）。\r\n// 直接对两个 Tensor 做减法会得 NaN，故统一在此归一为 number。\r\nfunction _scalarOf(v, who = 'f(x)') {\r\n  if (typeof v === 'number') return v;\r\n  if (v && v.data && v.size === 1) return v.data[0];\r\n  if (v && typeof v.scalar === 'function') return v.scalar();\r\n  throw new ForgeError('E_VALUE', `${who} 必须为 number 或 size=1 的 Tensor`);\r\n}\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.gradCentral', arity: 2,\r\n  sig: '(Function f, Tensor x, number eps=1e-5) -> Tensor', doc: '中心差分数值梯度（O(ε²)）',\r\n  ref: '数值微分标准', inv: '对二次函数精确到 O(ε²)；f 为 x↦标量',\r\n  impl: (f, x, eps = 1e-5) => {\r\n    const out = new Float64Array(x.size);\r\n    for (let i = 0; i < x.size; i++) {\r\n      const xp = x.clone(), xm = x.clone();\r\n      xp.data[i] += eps; xm.data[i] -= eps;\r\n      out[i] = (_scalarOf(f(xp)) - _scalarOf(f(xm))) / (2 * eps);\r\n    }\r\n    return new Tensor(out, x.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.gradForward', arity: 2,\r\n  sig: '(Function f, Tensor x, number eps=1e-5) -> Tensor', doc: '前向差分数值梯度（O(ε)）',\r\n  ref: '数值微分标准', inv: '比中心差分便宜但精度低一阶',\r\n  impl: (f, x, eps = 1e-5) => {\r\n    const out = new Float64Array(x.size);\r\n    const f0 = _scalarOf(f(x));\r\n    for (let i = 0; i < x.size; i++) {\r\n      const xp = x.clone();\r\n      xp.data[i] += eps;\r\n      out[i] = (_scalarOf(f(xp)) - f0) / eps;\r\n    }\r\n    return new Tensor(out, x.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.hessianDiag', arity: 2,\r\n  sig: '(Function f, Tensor x, number eps=1e-4) -> Tensor', doc: 'Hessian 对角线（二阶中心差分）',\r\n  ref: '数值微分标准', inv: '对 f=½xᵀAx 返回 A 的对角元',\r\n  impl: (f, x, eps = 1e-4) => {\r\n    const out = new Float64Array(x.size);\r\n    for (let i = 0; i < x.size; i++) {\r\n      const xp = x.clone(), xm = x.clone(), x0 = x.clone();\r\n      xp.data[i] += eps; xm.data[i] -= eps;\r\n      out[i] = (_scalarOf(f(xp)) - 2 * _scalarOf(f(x0)) + _scalarOf(f(xm))) / (eps * eps);\r\n    }\r\n    return new Tensor(out, x.shape);\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.jacobianFD', arity: 2,\r\n  sig: '(Function F, Tensor x, number eps=1e-5) -> Tensor', doc: '数值雅可比矩阵（F: R^n→R^m）',\r\n  ref: '数值微分标准', inv: '第 j 列为 ∂F/∂xⱼ',\r\n  impl: (F, x, eps = 1e-5) => {\r\n    const cols = [];\r\n    for (let j = 0; j < x.size; j++) {\r\n      const xp = x.clone(), xm = x.clone();\r\n      xp.data[j] += eps; xm.data[j] -= eps;\r\n      const fp = F(xp), fm = F(xm);\r\n      const col = new Float64Array(fp.size);\r\n      for (let i = 0; i < fp.size; i++) col[i] = (fp.data[i] - fm.data[i]) / (2 * eps);\r\n      cols.push(col);\r\n    }\r\n    const m = cols[0].length;\r\n    const out = new Float64Array(m * x.size);\r\n    for (let i = 0; i < m; i++) for (let j = 0; j < x.size; j++) out[i * x.size + j] = cols[j][i];\r\n    return new Tensor(out, [m, x.size]);\r\n  },\r\n});\r\n\r\n// ============ G. 插值（4 条） ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.searchSorted', arity: 2, sig: '(Tensor xs, number xq) -> number',\r\n  doc: '二分查找插入位置（xs 升序）', ref: 'NumPy searchsorted', inv: '返回 i 使 xs[i-1]≤xq<xs[i]',\r\n  impl: (xs, xq) => {\r\n    let lo = 0, hi = xs.size;\r\n    while (lo < hi) { const mid = (lo + hi) >> 1; if (xs.data[mid] < xq) lo = mid + 1; else hi = mid; }\r\n    return lo;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.interpLinear', arity: 3, sig: '(Tensor xs, Tensor ys, Tensor|number xq) -> Tensor|number',\r\n  doc: '分段线性插值（区间外线性外推）', ref: 'NumPy interp', inv: '过全部数据点',\r\n  impl: (xs, ys, xq) => {\r\n    if (typeof xq === 'number') return interp1(xs, ys, xq);\r\n    return xq.map((v) => interp1(xs, ys, v));\r\n  },\r\n});\r\nfunction interp1(xs, ys, xq) {\r\n  const n = xs.size;\r\n  if (n === 0) throw new ForgeError('E_VALUE', '空数据');\r\n  if (n === 1) return ys.data[0];\r\n  if (xq <= xs.data[0]) { const s = (ys.data[1] - ys.data[0]) / (xs.data[1] - xs.data[0]); return ys.data[0] + s * (xq - xs.data[0]); }\r\n  if (xq >= xs.data[n - 1]) { const s = (ys.data[n - 1] - ys.data[n - 2]) / (xs.data[n - 1] - xs.data[n - 2]); return ys.data[n - 1] + s * (xq - xs.data[n - 1]); }\r\n  const i = exec('num.searchSorted', [xs, xq]);\r\n  const t = (xq - xs.data[i - 1]) / (xs.data[i] - xs.data[i - 1]);\r\n  return ys.data[i - 1] + t * (ys.data[i] - ys.data[i - 1]);\r\n}\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.interpNearest', arity: 3, sig: '(Tensor xs, Tensor ys, number xq) -> number',\r\n  doc: '最近邻插值', ref: 'NumPy interp(kind=nearest)', inv: '返回最近节点的值',\r\n  impl: (xs, ys, xq) => {\r\n    const i = exec('num.searchSorted', [xs, xq]);\r\n    if (i === 0) return ys.data[0];\r\n    if (i >= xs.size) return ys.data[xs.size - 1];\r\n    return xq - xs.data[i - 1] <= xs.data[i] - xq ? ys.data[i - 1] : ys.data[i];\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.interpLagrange', arity: 3, sig: '(Tensor xs, Tensor ys, number xq) -> number',\r\n  doc: 'Lagrange 全局多项式插值', ref: '数值分析标准', inv: '过全部节点；≤n-1 次多项式精确',\r\n  impl: (xs, ys, xq) => {\r\n    const n = xs.size;\r\n    let out = 0;\r\n    for (let i = 0; i < n; i++) {\r\n      let li = 1;\r\n      for (let j = 0; j < n; j++) if (j !== i) li *= (xq - xs.data[j]) / (xs.data[i] - xs.data[j]);\r\n      out += ys.data[i] * li;\r\n    }\r\n    return out;\r\n  },\r\n});\r\n\r\n// ============ H. 特殊函数（6 条） ============\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.erf', sig: '(number x) -> number', doc: '误差函数（级数+连分数，全定义域）',\r\n  ref: 'Abramowitz & Stegun 7.1.26；级数 erf(x)=2/√π·Σ(-1)ⁿx^{2n+1}/(n!(2n+1))',\r\n  inv: 'erf(-x)=-erf(x)；erf(∞)=1；erf(1)=0.8427007929497149',\r\n  impl: (x) => {\r\n    if (Number.isNaN(x)) return NaN;\r\n    if (x === 0) return 0;\r\n    if (x < 0) return -exec('num.erf', [-x]);\r\n    if (x > 3) return 1 - erfcLarge(x);\r\n    // 级数\r\n    let term = x, sum = x;\r\n    for (let n = 1; n < 200; n++) {\r\n      term *= -x * x / n;\r\n      const add = term / (2 * n + 1);\r\n      sum += add;\r\n      if (Math.abs(add) < 1e-18 * Math.abs(sum)) break;\r\n    }\r\n    return 2 / Math.sqrt(Math.PI) * sum;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.erfc', sig: '(number x) -> number', doc: '互补误差函数',\r\n  ref: 'Laplace 连分数 + 级数', inv: 'erfc(-x)=2-erfc(x)；erfc(0)=1；erfc(∞)=0',\r\n  impl: (x) => {\r\n    if (Number.isNaN(x)) return NaN;\r\n    if (x < 0) return 2 - exec('num.erfc', [-x]);\r\n    if (x === 0) return 1;\r\n    if (x <= 2) return 1 - exec('num.erf', [x]);\r\n    return erfcLarge(x);\r\n  },\r\n});\r\n// Laplace 连分数（DLMF 7.9.2）：\r\n// erfc(x)·(√π·e^{x²}) = 1/(x + 1/(2x + 2/(x + 3/(2x + 4/(x + ...)))))\r\n// 分子序列 1,1,2,3,4,...；分母序列 x,2x,x,2x,...\r\nfunction erfcLarge(x) {\r\n  const N = 80;\r\n  let f = 0;\r\n  for (let i = N; i >= 1; i--) {\r\n    const d = i % 2 === 1 ? x : 2 * x;\r\n    const num = i === 1 ? 1 : i - 1;\r\n    f = num / (d + f);\r\n  }\r\n  return Math.exp(-x * x) / Math.sqrt(Math.PI) * f;\r\n}\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.gamma', sig: '(number z) -> number', doc: 'Gamma 函数（Stirling 级数 + 递推）',\r\n  ref: 'Stirling 展开（DLMF 5.11.1）；Numerical Recipes §6.1（递推策略）',\r\n  inv: 'gamma(n)=(n-1)!；gamma(0.5)=√π=1.7724538509055159',\r\n  impl: (z) => {\r\n    if (Number.isNaN(z)) return NaN;\r\n    if (z === Math.round(z) && z <= 0) return NaN; // 极点\r\n    if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * exec('num.gamma', [1 - z]));\r\n    // 递推到 z>=10 后用 Stirling 级数（保证 1e-15 精度）\r\n    let zz = z, prod = 1;\r\n    while (zz < 10) { prod *= zz; zz += 1; }\r\n    return Math.exp(logGammaStirling(zz)) / prod;\r\n  },\r\n});\r\n// Stirling 级数：lnΓ(z) ≈ (z-0.5)lnz - z + 0.5ln(2π) + Σ B_{2n}/(2n(2n-1)z^{2n-1})\r\nfunction logGammaStirling(z) {\r\n  const z2 = z * z;\r\n  return (z - 0.5) * Math.log(z) - z + 0.5 * Math.log(2 * Math.PI)\r\n    + 1 / (12 * z) - 1 / (360 * z2 * z) + 1 / (1260 * z2 * z2 * z) - 1 / (1680 * z2 * z2 * z2 * z);\r\n}\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.lgamma', sig: '(number z) -> number', doc: 'log|Γ(z)|（Stirling + 递推，大数不溢出）',\r\n  ref: 'Stirling 展开（DLMF 5.11.1）', inv: 'lgamma(n)=ln((n-1)!)；lgamma(0.5)=ln√π',\r\n  impl: (z) => {\r\n    if (z < 0.5) return Math.log(Math.abs(Math.PI / Math.sin(Math.PI * z))) - exec('num.lgamma', [1 - z]);\r\n    let zz = z, lacc = 0;\r\n    while (zz < 10) { lacc += Math.log(zz); zz += 1; }\r\n    return logGammaStirling(zz) - lacc;\r\n  },\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.beta', arity: 2, sig: '(number a, number b) -> number',\r\n  doc: 'Beta 函数 Γ(a)Γ(b)/Γ(a+b)', ref: '特殊函数标准', inv: 'beta(a,b)=beta(b,a)；beta(1,1)=1',\r\n  impl: (a, b) => exec('num.gamma', [a]) * exec('num.gamma', [b]) / exec('num.gamma', [a + b]),\r\n});\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'num.normalQuantile', arity: 1, sig: '(number p, boolean refine=true) -> number',\r\n  doc: '标准正态分位数（Acklam 逆近似 + Newton 修正到机器精度）',\r\n  ref: 'Acklam 算法（Peter Acklam
