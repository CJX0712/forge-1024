imestamp ?? null,\r\n  };\r\n}\r\nconst manifestHashImpl = (m) => fnv1a(`m|${canonicalJson(m)}`);\r\n\r\n// 最优 epoch 内核\r\nfunction bestEpochImpl(history, metric, mode) {\r\n  const h = Array.isArray(history) ? history : [];\r\n  if (h.length === 0) throw err('E_VALUE', 'history 为空');\r\n  const m = mode ?? (/loss|error|err|mse|mae/i.test(String(metric)) ? 'min' : 'max');\r\n  let best = null;\r\n  for (const r of h) {\r\n    const v = r?.[metric];\r\n    if (typeof v !== 'number' || !Number.isFinite(v)) continue;\r\n    if (best === null) { best = r; continue; }\r\n    const bv = best[metric];\r\n    if (m === 'max' ? v > bv : v < bv) best = r;\r\n  }\r\n  if (best === null) throw err('E_VALUE', `history 中无有效指标 ${metric}`);\r\n  return { epoch: best.epoch, metric, mode: m, value: best[metric], record: best };\r\n}\r\n\r\n// run 摘要内核\r\nfunction runSummaryImpl(run) {\r\n  const history = Array.isArray(run?.history) ? run.history : [];\r\n  let metrics = {};\r\n  if (run?.metrics && Object.keys(run.metrics).length > 0) metrics = { ...run.metrics };\r\n  else if (history.length > 0) {\r\n    const last = history[history.length - 1];\r\n    for (const k of Object.keys(last)) if (k !== 'epoch' && k !== 'lr') metrics[k] = last[k];\r\n  }\r\n  let best = null;\r\n  if (history.length > 0) {\r\n    try { best = bestEpochImpl(history, run?.bestMetric ?? 'valLoss', run?.bestMode); } catch { best = null; }\r\n  }\r\n  return {\r\n    id: run?.id ?? null,\r\n    seed: run?.seed ?? null,\r\n    epochs: history.length > 0 ? history.length : null,\r\n    configHash: run?.config ? hashParamsImpl(run.config) : null,\r\n    metrics,\r\n    best,\r\n  };\r\n}\r\nconst hashParamsImpl = (p) => fnv1a(`p|${canonicalJson(p)}`);\r\n\r\n// 参数结构 → 纯 JSON 结构（Tensor → {shape, data}）\r\nfunction toPlain(v) {\r\n  if (v instanceof Tensor) return { shape: v.shape.slice(), data: Array.from(v.data) };\r\n  if (Array.isArray(v)) return v.map(toPlain);\r\n  if (isPlainObj(v)) { const o = {}; for (const k of Object.keys(v)) o[k] = toPlain(v[k]); return o; }\r\n  return v;\r\n}\r\n\r\n// 模块级指标存储（recordMetric / metricSeries / resetState）\r\nconst metricStore = new Map();\r\nlet metricSeq = 0;\r\n\r\n// D9-075 统一播种：主 RNG + 命名子流\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.seedAll', arity: 1,\r\n  sig: '(seed:number|string) -> {seed, rng, stream(name) -> rng}',\r\n  doc: '统一播种入口：字符串种子先经 FNV-1a 派生为 32bit；返回主 rng 与按名字派生的确定性子流（数据/初始化/增广各用一流）。',\r\n  ref: 'PCG 随机流与命名派生：O\\'Neill (2014) PCG RNG; FNV-1a: Fowler/Noll/Vo (1991)',\r\n  inv: '同种子两次调用各流序列一致；不同流名序列不同；字符串种子走 seedFrom',\r\n  impl: (seed) => {\r\n    const s = typeof seed === 'string' ? seedFrom(seed) : seed;\r\n    if (!Number.isInteger(s)) throw err('E_TYPE', `seed 必须为整数或字符串，收到 ${typeof seed}`);\r\n    return {\r\n      seed: s >>> 0,\r\n      rng: createRng(s),\r\n      stream(name) { return createRng(seedFrom(`${s >>> 0}|${name}`)); },\r\n    };\r\n  },\r\n});\r\n\r\n// D9-076 环境指纹（稳定摘要）\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.fingerprint', arity: 1,\r\n  sig: '(env?:{seed, dataHash, config}) -> {hash, parts}',\r\n  doc: '环境指纹：内核/目录版本 + node/平台/架构 + 可选种子/数据哈希/配置哈希的稳定摘要；不含时间。',\r\n  ref: '可复现构建与确定性摘要：Debian Reproducible Builds 项目（2013–）；Perez-Riverol et al. (2016) Ten Simple Rules for Taking Advantage of Git and GitHub, PLOS CB',\r\n  inv: '同入参同指纹；任一入参变化（如 seed）指纹变；parts 可读',\r\n  impl: (env = {}) => {\r\n    const e = env ?? {};\r\n    const base = envInfoImpl();\r\n    const parts = {\r\n      kernel: base.kernel,\r\n      catalog: base.catalog,\r\n      node: base.node,\r\n      platform: base.platform,\r\n      arch: base.arch,\r\n      domains: base.domains,\r\n      seed: e.seed ?? null,\r\n      dataHash: e.dataHash ?? null,\r\n      configHash: e.config ? hashParamsImpl(e.config) : null,\r\n    };\r\n    return { hash: fnv1a(`f|${canonicalJson(parts)}`), parts };\r\n  },\r\n});\r\n\r\n// D9-077 实验清单 manifest\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.manifest', arity: 2,\r\n  sig: '(config, opts?:{seed, dataHash, extra, timestamp}) -> manifest',\r\n  doc: '生成实验 manifest：配置 + 种子 + 内核/目录版本 + 环境 + 数据哈希；不含时间戳（除非显式传入）→ 可稳定哈希。',\r\n  ref: 'Perez-Riverol et al. (2016) Ten Simple Rules for Taking Advantage of Git and GitHub, PLOS Comput. Biol. 12(7)',\r\n  inv: '同 (config, seed, dataHash) 两次 manifest 深度相等；manifestHash 相同',\r\n  impl: (config, opts = {}) => manifestImpl(config, opts),\r\n});\r\n\r\n// D9-078 manifest 哈希\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.manifestHash', arity: 1,\r\n  sig: '(manifest) -> hex8',\r\n  doc: '对 manifest 做规范 JSON + FNV-1a 哈希；改种子/配置/数据哈希 → 哈希变。',\r\n  ref: 'FNV-1a：Fowler/Noll/Vo (1991)；Perez-Riverol et al. (2016) PLOS CB',\r\n  inv: '同 manifest 同哈希；键序不影响结果（规范序列化排序键）',\r\n  impl: (manifest) => {\r\n    if (!manifest || typeof manifest !== 'object') throw err('E_TYPE', 'manifest 必须为对象');\r\n    return manifestHashImpl(manifest);\r\n  },\r\n});\r\n\r\n// D9-079 逐位确定性检查\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.determinismCheck', arity: 3,\r\n  sig: '(fn:fn, args:array, opts?:{runs}) -> {deterministic, runs, canonical, mismatchAt}',\r\n  doc: '以深拷贝入参重复执行 fn runs 次（默认 2），对返回做规范序列化逐位比较；用于验证训练/预处理确定性。',\r\n  ref: 'Hoare (1969) An Axiomatic Basis for Computer Programming, CACM 12(10)（断言式不变量）',\r\n  inv: 'deterministic=true 时所有 run 的规范序列化完全相同；mismatchAt 指出首个不一致 run',\r\n  impl: (fn, args, opts = {}) => {\r\n    if (typeof fn !== 'function') throw err('E_TYPE', 'fn 必须为函数');\r\n    const runs = opts?.runs ?? 2;\r\n    if (!Number.isInteger(runs) || runs < 2) throw err('E_VALUE', `runs 必须 ≥2 的整数，收到 ${runs}`);\r\n    const a = Array.isArray(args) ? args : [args];\r\n    let first = null;\r\n    for (let i = 0; i < runs; i++) {\r\n      const c = canonicalJson(fn(...deepClone(a)));\r\n      if (first === null) first = c;\r\n      else if (c !== first) return { deterministic: false, runs, canonical: first, mismatchAt: i + 1 };\r\n    }\r\n    return { deterministic: true, runs, canonical: first, mismatchAt: null };\r\n  },\r\n});\r\n\r\n// D9-080 参数快照\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.snapshotParams', arity: 1,\r\n  sig: '(params) -> snapshot',\r\n  doc: '参数结构深拷贝快照（Tensor/数组/纯对象/标量），与源完全隔离。',\r\n  ref: 'Pedregosa et al. (2011) Scikit-learn, JMLR 12（模型持久化）',\r\n  inv: 'snapshot 与 params 逐位相等；互不影响',\r\n  impl: (params) => deepClone(params),\r\n});\r\n\r\n// D9-081 参数恢复\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.restoreParams', arity: 1,\r\n  sig: '(snapshot) -> params',\r\n  doc: '从快照深拷贝恢复参数；与 snapshot 隔离。',\r\n  ref: 'Pedregosa et al. (2011) Scikit-learn, JMLR 12',\r\n  inv: 'restore(snapshot(p)) 与 p 逐位相等',\r\n  impl: (snapshot) => deepClone(snapshot),\r\n});\r\n\r\n// D9-082 环境信息\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.envInfo', arity: 0,\r\n  sig: '() -> {node, platform, arch, kernel, catalog, domains, opsInDomain9}',\r\n  doc: '环境信息：node 版本、平台、架构、内核与目录版本、域数、域9 指令数（稳定字段，不含时间）。',\r\n  ref: 'Perez-Riverol et al. (2016) Ten Simple Rules for Taking Advantage of Git and GitHub, PLOS CB',\r\n  inv: '同一进程内多次调用结果相同',\r\n  impl: () => envInfoImpl(),\r\n});\r\n\r\n// D9-083 实验日志追加\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.logAppend', arity: 2,\r\n  sig: '(log:array, entry:object) -> array',\r\n  doc: '向实验日志追加带 seq 序号的记录；纯函数不修改入参。',\r\n  ref: 'Kitzes et al. (2018) The Practice of Reproducible Research, UC Press',\r\n  inv: '返回长度 = 入参+1；seq 连续（缺省 length+1）',\r\n  impl: (log, entry) => {\r\n    const l = Array.isArray(log) ? log.slice() : [];\r\n    if (!entry || typeof entry !== 'object') throw err('E_TYPE', 'entry 必须为对象');\r\n    const rec = { seq: l.length + 1, ...entry };\r\n    if (entry.seq !== undefined) rec.seq = entry.seq;\r\n    l.push(rec);\r\n    return l;\r\n  },\r\n});\r\n\r\n// D9-084 实验日志对比\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.experimentCompare', arity: 3,\r\n  sig: '(logA:array, logB:array, key?:string) -> {onlyA, onlyB, common, diffs, identical}',\r\n  doc: '按 key（默认 runId）对齐两份实验日志，报告独有条目与字段级差异（用于复现审计）。',\r\n  ref: 'Kitzes et al. (2018) The Practice of Reproducible Research, UC Press',\r\n  inv: 'onlyA/onlyB/common 构成键的全集划分；diffs 逐字段给出两侧值；identical = 三者皆空',\r\n  impl: (logA, logB, key = 'runId') => {\r\n    const toMap = (log) => {\r\n      const m = new Map();\r\n      for (const e of Array.isArray(log) ? log : []) {\r\n        if (e && typeof e === 'object') m.set(String(e[key]), e);\r\n      }\r\n      return m;\r\n    };\r\n    const A = toMap(logA), B = toMap(logB);\r\n    const onlyA = [...A.keys()].filter(k => !B.has(k));\r\n    const onlyB = [...B.keys()].filter(k => !A.has(k));\r\n    const common = [...A.keys()].filter(k => B.has(k));\r\n    const diffs = [];\r\n    for (const k of common) {\r\n      const a = A.get(k), b = B.get(k);\r\n      const fields = orderedKeys([a, b]).filter(f => f !== key);\r\n      for (const f of fields) {\r\n        if (canonicalJson(a[f]) !== canonicalJson(b[f])) diffs.push({ [key]: k, field: f, a: a[f], b: b[f] });\r\n      }\r\n    }\r\n    return { onlyA, onlyB, common, diffs, identical: onlyA.length === 0 && onlyB.length === 0 && diffs.length === 0 };\r\n  },\r\n});\r\n\r\n// D9-085 表格转 CSV\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.tableToCsv', arity: 2,\r\n  sig: '(rows:object[], cols?:string[]) -> string',\r\n  doc: '记录数组 → CSV（含表头）；含逗号/引号/换行的值按 RFC 4180 双引号转义。',\r\n  ref: 'CSV 规范：Shafranovich (2005) RFC 4180, IETF',\r\n  inv: '首行为表头；行数 = rows.length+1；转义后 round-trip 不破坏列结构',\r\n  impl: (rows, cols = null) => {\r\n    const list = Array.isArray(rows) ? rows : [rows];\r\n    const cs = cols && cols.length ? cols : orderedKeys(list);\r\n    const esc = (v) => {\r\n      const s = fmtCell(v);\r\n      return /[\",\\n]/.test(s) ? `\"${s.replace(/\"/g, '\"\"')}\"` : s;\r\n    };\r\n    return [cs.map(esc).join(','), ...list.map(r => cs.map(c => esc(r?.[c])).join(','))].join('\\n');\r\n  },\r\n});\r\n\r\n// D9-086 表格转 Markdown\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.tableToMarkdown', arity: 2,\r\n  sig: '(rows:object[], cols?:string[]) -> string',\r\n  doc: '记录数组 → Markdown 表（与 eval.resultTable 同渲染，供实验报告归档）。',\r\n  ref: 'Demšar (2006) Statistical Comparisons of Classifiers over Multiple Data Sets, JMLR',\r\n  inv: '表头 | ... | + 分隔行 + 数据行',\r\n  impl: (rows, cols = null) => {\r\n    if (!Array.isArray(rows)) throw err('E_TYPE', 'rows 必须为对象数组');\r\n    return tableMarkdown(rows, cols);\r\n  },\r\n});\r\n\r\n// D9-087 数据哈希（逐位）\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.hashData', arity: 1,\r\n  sig: '(dataset) -> hex8',\r\n  doc: '对数据集 X/y 的 Float64 字节做 FNV-1a（含 shape）；改动任一比特即变。',\r\n  ref: 'FNV-1a：Fowler/Noll/Vo (1991)；数据版本控制：Perez-Riverol et al. (2016) PLOS CB',\r\n  inv: '同数据同哈希；形状变化哈希变；不依赖十进制表示',\r\n  impl: (ds) => {\r\n    const { X, y } = dsOf(ds, 'hashData');\r\n    return fnv1a(`d9d|${X.shape.join('x')}|${hashF64(X.data)}|${y.shape.join('x')}|${hashF64(y.data)}`);\r\n  },\r\n});\r\n\r\n// D9-088 参数哈希\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.hashParams', arity: 1,\r\n  sig: '(params) -> hex8',\r\n  doc: '对参数结构（Tensor/数组/对象/标量）做规范序列化 + FNV-1a 哈希。',\r\n  ref: 'FNV-1a：Fowler/Noll/Vo (1991)',\r\n  inv: '同构同哈希；键序无关；Tensor 按 (shape,data) 编码',\r\n  impl: (params) => hashParamsImpl(params),\r\n});\r\n\r\n// D9-089 复现性断言\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.assertReproducible', arity: 2,\r\n  sig: '(a, b) -> true',\r\n  doc: '断言两个对象（manifest/运行记录）在剔除 runId/timestamp/note 后规范相等；不等则抛 E_VALUE。',\r\n  ref: 'Hoare (1969) An Axiomatic Basis for Computer Programming, CACM 12(10)',\r\n  inv: '相等返回 true；不等抛 ForgeError(E_VALUE)',\r\n  impl: (a, b) => {\r\n    if (!a || !b || typeof a !== 'object' || typeof b !== 'object') throw err('E_TYPE', '需要两个对象');\r\n    const strip = (m) => {\r\n      const c = deepClone(m);\r\n      delete c.runId; delete c.timestamp; delete c.note;\r\n      return c;\r\n    };\r\n    const ha = fnv1a(`a|${canonicalJson(strip(a))}`);\r\n    const hb = fnv1a(`a|${canonicalJson(strip(b))}`);\r\n    if (ha !== hb) throw err('E_VALUE', `复现性断言失败: ${ha} != ${hb}`);\r\n    return true;\r\n  },\r\n});\r\n\r\n// D9-090 重置可复现性模块状态\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.resetState', arity: 0,\r\n  sig: '() -> true',\r\n  doc: '清空模块级指标存储与序号计数（测试隔离用）。',\r\n  ref: '测试隔离与状态复位：Hoare (1969) CACM 12(10)',\r\n  inv: 'reset 后 recordMetric/metricSeries 从空开始',\r\n  impl: () => { metricStore.clear(); metricSeq = 0; return true; },\r\n});\r\n\r\n// D9-091 记录指标点\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.recordMetric', arity: 4,\r\n  sig: '(runId:string, name:string, value:number, step?:number) -> record',\r\n  doc: '向模块级存储记录一个 (runId, name, value, step) 指标点；step 缺省取全局序号。',\r\n  ref: 'Kitzes et al. (2018) The Practice of Reproducible Research, UC Press',\r\n  inv: '返回记录含 runId/name/value/step/seq；同 runId 可多次记录',\r\n  impl: (runId, name, value, step = null) => {\r\n    if (typeof value !== 'number' || !Number.isFinite(value)) throw err('E_TYPE', `value 必须为有限数，收到 ${value}`);\r\n    const rid = String(runId), nm = String(name);\r\n    const seq = ++metricSeq;\r\n    const rec = { runId: rid, name: nm, value, step: step ?? seq, seq };\r\n    if (!metricStore.has(rid)) metricStore.set(rid, []);\r\n    metricStore.get(rid).push(rec);\r\n    return { ...rec };\r\n  },\r\n});\r\n\r\n// D9-092 读取指标序列\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.metricSeries', arity: 2,\r\n  sig: '(runId:string, name:string) -> {step, value}[]',\r\n  doc: '按 (step, seq) 排序返回某运行的某指标序列（用于画曲线/比较）。',\r\n  ref: 'Kitzes et al. (2018) The Practice of Reproducible Research, UC Press',\r\n  inv: '长度 = 该 runId 下该 name 的记录数；按 step 升序',\r\n  impl: (runId, name) => {\r\n    const rid = String(runId), nm = String(name);\r\n    const list = (metricStore.get(rid) ?? []).filter(r => r.name === nm);\r\n    list.sort((a, b) => (a.step - b.step) || (a.seq - b.seq));\r\n    return list.map(r => ({ step: r.step, value: r.value }));\r\n  },\r\n});\r\n\r\n// D9-093 最优 epoch\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.bestEpoch', arity: 3,\r\n  sig: \"(history:array, metric?:string, mode?:'min'|'max') -> {epoch, metric, mode, value, record}\",\r\n  doc: '在训练历史中找最优 epoch：mode 缺省按指标名推断（含 loss/error/mse → min，否则 max）。',\r\n  ref: 'Prechelt (1998) Early Stopping — But When?（最佳点选取）',\r\n  inv: 'mode=min 返回该指标最小值所在记录；缺省指标 valLoss',\r\n  impl: (history, metric = 'valLoss', mode = null) => bestEpochImpl(history, metric, mode ?? undefined),\r\n});\r\n\r\n// D9-094 运行摘要\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.runSummary', arity: 1,\r\n  sig: '(run:{id?, seed?, config?, history?, metrics?, bestMetric?, bestMode?}) -> summary',\r\n  doc: '运行摘要：id/种子/轮数/配置哈希/指标集合/最优 epoch；供归档、对比与 replay 使用。',\r\n  ref: 'Perez-Riverol et al. (2016) Ten Simple Rules for Taking Advantage of Git and GitHub, PLOS CB',\r\n  inv: 'metrics 优先取 run.metrics，否则取末条历史记录（除 epoch/lr）；best 缺失指标时为 null',\r\n  impl: (run) => {\r\n    if (!run || typeof run !== 'object') throw err('E_TYPE', 'run 必须为对象');\r\n    return runSummaryImpl(run);\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 五、组合与工具（D9-095 ~ D9-102）\r\n// ============================================================================\r\n\r\n// D9-095 先划分后标准化（防数据泄漏）\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.pipe.standardizeThenSplit', arity: 3,\r\n  sig: '(dataset, testFrac:number, seed:number) -> {scaler, train, test}',\r\n  doc: '先按种子划分，再只在训练集上拟合标准化器并应用于两侧，杜绝测试集统计量泄漏。',\r\n  ref: '数据泄漏防范：Kohavi (1995) A Study of Cross-Validation and Bootstrap, IJCAI',\r\n  inv: 'scaler 仅由 train 拟合；train 标准化后每列均值≈0、std≈1；test 用同一 scaler',\r\n  impl: (ds, testFrac, seed) => {\r\n    const { train, test } = trainTestSplitImpl(ds, testFrac, seed);\r\n    const f = standardizerFitImpl(train);\r\n    const scaler = { kind: 'standardizer', mean: f.mean, std: f.std };\r\n    return {\r\n      scaler,\r\n      train: { ...train, X: standardizeWith(train.X, scaler) },\r\n      test: { ...test, X: standardizeWith(test.X, scaler) },\r\n    };\r\n  },\r\n});\r\n\r\n// 内部：标准izerFit 的复用实现（避免经 exec 间接调用）\r\nfunction standardizerFitImpl(ds) {\r\n  const { X, n, d } = dsOf(ds);\r\n  const mean = new Float64Array(d), std = new Float64Array(d);\r\n  for (let j = 0; j < d; j++) {\r\n    let m = 0;\r\n    for (let i = 0; i < n; i++) m += X.get2(i, j);\r\n    m /= n;\r\n    let s = 0;\r\n    for (let i = 0; i < n; i++) s += (X.get2(i, j) - m) ** 2;\r\n    mean[j] = m;\r\n    std[j] = Math.max(Math.sqrt(s / n), 1e-12);\r\n  }\r\n  return { mean: new Tensor(mean, [d]), std: new Tensor(std, [d]) };\r\n}\r\nfunction standardizeWith(X, scaler) {\r\n  const d = X.shape[1];\r\n  const out = new Float64Array(X.size);\r\n  for (let i = 0; i < X.shape[0]; i++) {\r\n    for (let j = 0; j < d; j++) out[i * d + j] = (X.get2(i, j) - scaler.mean.data[j]) / scaler.std.data[j];\r\n  }\r\n  return new Tensor(out, X.shape.slice());\r\n}\r\n\r\n// D9-096 分类全指标报告\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.eval.fullReport', arity: 3,\r\n  sig: '(yTrue, yPred, opts?:{proba, classes}) -> report',\r\n  doc: '分类全量报告：accuracy、balancedAcc、宏/加权平均、逐类指标、混淆矩阵、κ、MCC、多数类基线；给 proba 时追加 logloss/brier。',\r\n  ref: 'Sokolova & Lapalme (2009) IP&M 45(4); Cohen (1960); Matthews (1975); Brier (1950)',\r\n  inv: '字段与各单项指标函数口径一致；proba 缺省时不产出 logloss/brier',\r\n  impl: (yTrue, yPred, opts = {}) => {\r\n    const proba = opts?.proba ?? null;\r\n    const classes = opts?.classes ?? null;\r\n    const report = execClassificationReport(yTrue, yPred, classes);\r\n    const out = {\r\n      accuracy: report.accuracy,\r\n      balancedAcc: execBalancedAcc(yTrue, yPred),\r\n      macro: report.macro,\r\n      weighted: report.weighted,\r\n      perClass: report.perClass,\r\n      confusion: evalConfusion(yTrue, yPred, classes),\r\n      cohenKappa: execCohenKappa(yTrue, yPred, classes),\r\n      mcc: execMcc(yTrue, yPred),\r\n      majorityBaseline: execMajorityBaseline(yTrue),\r\n    };\r\n    if (proba) {\r\n      out.logloss = execLogloss(yTrue, proba);\r\n      const labels = sortedUnique(arr(yTrue));\r\n      if (labels.length === 2 && labels.every(l => l === 0 || l === 1)) out.brier = execBrier(yTrue, proba);\r\n    }\r\n    return out;\r\n  },\r\n});\r\n\r\n// —— 组合件用的小型执行包装（避免与已注册 op 的实现重复） ——\r\nfunction execClassificationReport(yTrue, yPred, classes) {\r\n  const { classes: cls, perClass } = evalPerClass(yTrue, yPred, classes);\r\n  const total = perClass.reduce((a, r) => a + r.support, 0);\r\n  const acc = perClass.reduce((a, r) => a + r.tp, 0) / total;\r\n  return {\r\n    classes: cls, accuracy: acc, support: total, perClass,\r\n    macro: { precision: meanOf(perClass.map(r => r.precision)), recall: meanOf(perClass.map(r => r.recall)), f1: meanOf(perClass.map(r => r.f1)) },\r\n    weighted: {\r\n      precision: perClass.reduce((a, r) => a + r.support * r.precision, 0) / total,\r\n      recall: perClass.reduce((a, r) => a + r.support * r.recall, 0) / total,\r\n      f1: perClass.reduce((a, r) => a + r.support * r.f1, 0) / total,\r\n    },\r\n  };\r\n}\r\nfunction execBalancedAcc(yTrue, yPred) {\r\n  const { perClass } = evalPerClass(yTrue, yPred, sortedUnique(arr(yTrue)));\r\n  return meanOf(perClass.map(r => r.recall));\r\n}\r\nfunction execCohenKappa(yTrue, yPred, classes) {\r\n  const conf = evalConfusion(yTrue, yPred, classes);\r\n  const n = conf.total;\r\n  const po = conf.diagonal / n;\r\n  let pe = 0;\r\n  for (let i = 0; i < conf.labels.length; i++) pe += (conf.rowSums[i] / n) * (conf.colSums[i] / n);\r\n  return pe >= 1 ? 0 : (po - pe) / (1 - pe);\r\n}\r\nfunction execMcc(yTrue, yPred) {\r\n  const Y = arr(yTrue).map(v => (v === true ? 1 : v === false ? 0 : v));\r\n  const P = arr(yPred).map(v => (v === true ? 1 : v === false ? 0 : v));\r\n  const labels = sortedUnique([...Y, ...P]);\r\n  const conf = evalConfusion(Y, P, labels);\r\n  const isBinary = labels.length === 2 && labels.every(l => l === 0 || l === 1 || l === -1);\r\n  if (isBinary) {\r\n    const pi = labels.indexOf(1);\r\n    const ni = pi === 0 ? 1 : 0;\r\n    const tp = conf.matrix[pi][pi], tn = conf.matrix[ni][ni];\r\n    const fp = conf.matrix[ni][pi], fn = conf.matrix[pi][ni];\r\n    const den = Math.sqrt((tp + fp) * (tp + fn) * (tn + fp) * (tn + fn));\r\n    return den === 0 ? 0 : (tp * tn - fp * fn) / den;\r\n  }\r\n  const n = conf.total;\r\n  let c = 0, sumPt = 0, sumP2 = 0, sumT2 = 0;\r\n  for (let i = 0; i < labels.length; i++) {\r\n    c += conf.matrix[i][i];\r\n    sumPt += conf.colSums[i] * conf.rowSums[i];\r\n    sumP2 += conf.colSums[i] ** 2;\r\n    sumT2 += conf.rowSums[i] ** 2;\r\n  }\r\n  const den = Math.sqrt((n * n - sumP2) * (n * n - sumT2));\r\n  return den === 0 ? 0 : (c * n - sumPt) / den;\r\n}\r\nfunction execMajorityBaseline(yTrue) {\r\n  const Y = arr(yTrue);\r\n  const labels = sortedUnique(Y);\r\n  let best = labels[0], bestN = 0;\r\n  for (const c of labels) {\r\n    const n = Y.reduce((a, v) => a + (v === c ? 1 : 0), 0);\r\n    if (n > bestN) { bestN = n; best = c; }\r\n  }\r\n  return { label: best, count: bestN, proportion: bestN / Y.length, accuracy: bestN / Y.length };\r\n}\r\nfunction execLogloss(yTrue, proba, eps = 1e-15) {\r\n  const Y = arr(yTrue);\r\n  if (proba instanceof Tensor && proba.ndim === 2) {\r\n    const [n, C] = proba.shape;\r\n    let s = 0;\r\n    for (let i = 0; i < n; i++) {\r\n      const p = Math.min(Math.max(proba.get2(i, Y[i]), eps), 1 - eps);\r\n      s -= Math.log(p);\r\n    }\r\n    return s / n;\r\n  }\r\n  const P = arr(proba);\r\n  let s = 0;\r\n  for (let i = 0; i < Y.length; i++) {\r\n    const p = Math.min(Math.max(P[i], eps), 1 - eps);\r\n    s -= Y[i] === 1 ? Math.log(p) : Math.log(1 - p);\r\n  }\r\n  return s / Y.length;\r\n}\r\nfunction execBrier(yTrue, proba) {\r\n  const Y = arr(yTrue).map(v => (v === 1 || v === true ? 1 : 0));\r\n  const P = proba instanceof Tensor && proba.ndim === 2 ? Array.from(proba.col(1)) : arr(proba);\r\n  let s = 0;\r\n  for (let i = 0; i < Y.length; i++) s += (P[i] - Y[i]) ** 2;\r\n  return s / Y.length;\r\n}\r\n\r\n// D9-097 训练/验证/测试三向划分\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.loop.trainValTest', arity: 4,\r\n  sig: '(dataset, valFrac:number, testFrac:number, seed:number) -> {train, val, test}',\r\n  doc: '三向划分：先切出 train，再把剩余部分按 valFrac:testFrac 比例切成 val/test；三部分 index 两两不相交。',\r\n  ref: '三向 holdout 惯例：Hastie, Tibshirani & Friedman (2009) The Elements of Statistical Learning, §7',\r\n  inv: '0 < valFrac + testFrac < 1；三部分并集 = [0,n) 且不相交',\r\n  impl: (ds, valFrac, testFrac, seed) => {\r\n    const d = dsOf(ds, 'trainValTest');\r\n    const rest = valFrac + testFrac;\r\n    if (!(rest > 0 && rest < 1)) throw err('E_VALUE', `valFrac+testFrac 必须 ∈ (0,1)，收到 ${rest}`);\r\n    const first = trainTestSplitImpl(d, rest, seed);\r\n    const valInRest = valFrac / rest;\r\n    // second 的 testFrac 切出的是 val（占 rest 的 valFrac/rest），其余为 test\r\n    const second = trainTestSplitImpl(first.test, valInRest, seed + 1);\r\n    // 二次切分的 index 是相对于 first.test 的局部索引，映射回全局\r\n    const remap = (s) => ({ ...s, index: s.index.map((li) => first.test.index[li]) });\r\n    return { train: first.train, val: remap(second.test), test: remap(second.train) };\r\n  },\r\n});\r\n\r\n// D9-098 嵌套交叉验证（外层评估 + 内层选模）\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.eval.nestedCV', arity: 2,\r\n  sig: '(dataset, opts:{kOuter, kInner, candidates, makeFitPredict, seed?, metric?, mode?}) -> {outerScores, mean, std, selected, mode, inner}',\r\n  doc: '嵌套 CV：每个外层折内用内层 CV 在候选超参数中选优（mode 默认按 metric 推断：mse/mae→min，否则 max），再评外层折。',\r\n  ref: 'Varma & Simon (2006) Bias in Error Estimation When Using Cross-Validation for Model Selection, BMC Bioinformatics 7:91; Stone (1974) JRSS-B',\r\n  inv: 'outerScores.length === kOuter；selected.length === kOuter；内层每候选分数长度 === kInner',\r\n  impl: (ds, opts = {}) => {\r\n    const d = dsOf(ds, 'nestedCV');\r\n    const kOuter = opts?.kOuter ?? 5, kInner = opts?.kInner ?? 3;\r\n    const candidates = opts?.candidates;\r\n    const make = opts?.makeFitPredict;\r\n    if (!Array.isArray(candidates) || candidates.length === 0) throw err('E_VALUE', 'candidates 必须为非空数组');\r\n    if (typeof make !== 'function') throw err('E_TYPE', 'makeFitPredict 必须为函数');\r\n    const metric = resolveMetric(opts?.metric);\r\n    const seed = opts?.seed ?? 20261014;\r\n    const mode = opts?.mode ?? (opts?.metric === 'mse' || opts?.metric === 'mae' ? 'min' : 'max');\r\n    const outerFolds = kFoldSplitImpl(d, kOuter, seed);\r\n    const outerScores = [], selected = [], inner = [];\r\n    for (const f of outerFolds) {\r\n      const innerFolds = kFoldSplitImpl(f.train, kInner, seed + 7919);\r\n      const candScores = candidates.map(cv => {\r\n        const fp = make(cv);\r\n        const ss = innerFolds.map(g => scoreOf(fp(g.train, g.val), g.val.y, metric));\r\n        return { value: cv, scores: ss, mean: meanOf(ss) };\r\n      });\r\n      const best = mode === 'max'\r\n        ? candScores.reduce((a, b) => (b.mean > a.mean ? b : a))\r\n        : candScores.reduce((a, b) => (b.mean < a.mean ? b : a));\r\n      selected.push(best.value);\r\n      inner.push({ fold: f.fold, candidates: candScores, best: best.value });\r\n      outerScores.push(scoreOf(make(best.value)(f.train, f.val), f.val.y, metric));\r\n    }\r\n    return { outerScores, mean: meanOf(outerScores), std: stdOf(outerScores), selected, mode, kOuter, kInner, inner };\r\n  },\r\n});\r\n\r\n// D9-099 导出运行存档（JSON 可序列化）\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.exportRun', arity: 1,\r\n  sig: '(run:{id?, config?, seed?, dataHash?, metrics?, history?, params?, fitPredict?, data?, metric?}) -> archive',\r\n  doc: '导出完整实验存档：manifest + 配置 + 指标 + 历史 + 参数（转纯 JSON）；附 run.fitPredict 与 run.data 时追加 replay 重放数据。',\r\n  ref: 'Perez-Riverol et al. (2016) Ten Simple Rules for Taking Advantage of Git and GitHub, PLOS CB',\r\n  inv: '存档中无函数/时间戳（除非显式给）；manifestHash 可稳定重算；Tensors 转为 {shape, data}',\r\n  impl: (run) => {\r\n    if (!run || typeof run !== 'object') throw err('E_TYPE', 'run 必须为对象');\r\n    const manifest = run.manifest ?? manifestImpl(run.config ?? {}, { seed: run.seed ?? null, dataHash: run.dataHash ?? null });\r\n    const archive = {\r\n      schema: 'd9.run/1',\r\n      id: run.id ?? null,\r\n      manifest,\r\n      manifestHash: manifestHashImpl(manifest),\r\n      config: toPlain(run.config ?? {}),\r\n      seed: run.seed ?? null,\r\n      history: toPlain(run.history ?? []),\r\n      metrics: toPlain(run.metrics ?? {}),\r\n      params: run.params ? toPlain(run.params) : null,\r\n      summary: runSummaryImpl(run),\r\n    };\r\n    if (typeof run.fitPredict === 'function' && run.data) {\r\n      const d = dsOf(run.data, 'exportRun.data');\r\n      const pred = predOf(run.fitPredict(d, d));\r\n      const m = resolveMetric(run.metric);\r\n      archive.replay = {\r\n        X: d.X.toArray(),\r\n        y: d.y.toArray(),\r\n        predHash: hashF64(pred.data),\r\n        metric: m ? m(pred, d.y) : null,\r\n      };\r\n    }\r\n    return archive;\r\n  },\r\n});\r\n\r\n// D9-100 从存档重放摘要\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.repro.replayRun', arity: 2,\r\n  sig: '(archive, fitPredict?:fn) -> {ok, manifestHash, metrics, summary, checks}',\r\n  doc: '从 exportRun 存档重放：校验 schema、复算并比对 manifestHash、复算摘要；给 fitPredict 且存档含 replay 数据时逐位复算预测哈希。',\r\n  ref: 'Kitzes et al. (2018) The Practice of Reproducible Research, UC Press',\r\n  inv: 'checks.schemaOk 恒 true（否则抛错）；manifestHashStable 为重算与存档一致；replayDeterministic 为预测哈希一致',\r\n  impl: (archive, fitPredict = null) => {\r\n    if (!archive || archive.schema !== 'd9.run/1') throw err('E_VALUE', 'archive 需为 d9.run/1 存档');\r\n    const checks = { schemaOk: true };\r\n    const h = manifestHashImpl(archive.manifest);\r\n    checks.manifestHashStable = archive.manifestHash ? h === archive.manifestHash : null;\r\n    const reSummary = runSummaryImpl({\r\n      id: archive.id, seed: archive.seed, config: archive.config,\r\n      metrics: archive.metrics, history: archive.history,\r\n    });\r\n    checks.summaryMatches = canonicalJson(reSummary) === canonicalJson(archive.summary);\r\n    if (typeof fitPredict === 'function' && archive.replay) {\r\n      const X = Tensor.fromNested(archive.replay.X);\r\n      const y = Tensor.fromFlat(archive.replay.y, [archive.replay.y.length]);\r\n      const pred = predOf(fitPredict({ X, y }, { X, y }));\r\n      checks.replayDeterministic = hashF64(pred.data) === archive.replay.predHash;\r\n    }\r\n    return { ok: true, manifestHash: h, metrics: archive.metrics ?? {}, summary: archive.summary ?? null, checks };\r\n  },\r\n});\r\n\r\n// D9-101 划分不相交断言\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.util.assertSplitDisjoint', arity: null,\r\n  sig: '(...splits:(number[]|dataset)) -> true',\r\n  doc: '断言多个划分（索引数组或带 index 的数据集）两两不相交；有重叠抛 E_VALUE，否则返回 true。',\r\n  ref: 'Hoare (1969) An Axiomatic Basis for Computer Programming, CACM 12(10)（不变量断言）',\r\n  inv: '至少两个划分；任一重叠即抛错并指出索引',\r\n  impl: (...splits) => {\r\n    if (splits.length < 2) throw err('E_VALUE', '至少需要两个划分');\r\n    const sets = splits.map((s, i) => {\r\n      const idx = Array.isArray(s) ? s : (s && Array.isArray(s.index) ? s.index : null);\r\n      if (!idx) throw err('E_TYPE', `划分 ${i} 需要为索引数组或带 index 的数据集`);\r\n      return new Set(idx.map(Number));\r\n    });\r\n    for (let i = 0; i < sets.length; i++) {\r\n      for (let j = i + 1; j < sets.length; j++) {\r\n        for (const v of sets[i]) {\r\n          if (sets[j].has(v)) throw err('E_VALUE', `划分 ${i} 与 ${j} 存在重叠索引 ${v}`);\r\n        }\r\n      }\r\n    }\r\n    return true;\r\n  },\r\n});\r\n\r\n// D9-102 覆盖检查\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.util.coverageCheck', arity: 2,\r\n  sig: '(indexArrays:number[]|number[][], total:number) -> {ok, total, covered, missing, duplicates}',\r\n  doc: '检查若干索引集合的并集恰好覆盖 [0,total) 一次：报告缺失与重复项。',\r\n  ref: 'Hoare (1969) An Axiomatic Basis for Computer Programming, CACM 12(10)',\r\n  inv: 'ok = missing 与 duplicates 皆空；covered = 出现过的索引数',\r\n  impl: (indexArrays, total) => {\r\n    if (!Number.isInteger(total) || total < 0) throw err('E_VALUE', `total 必须为非负整数，收到 ${total}`);\r\n    let lists;\r\n    if (Array.isArray(indexArrays) && indexArrays.length > 0 && indexArrays.every(Array.isArray)) lists = indexArrays;\r\n    else if (Array.isArray(indexArrays)) lists = [indexArrays];\r\n    else throw err('E_TYPE', 'indexArrays 需要为索引数组或索引数组的数组');\r\n    const seen = new Map();\r\n    for (const l of lists) {\r\n      for (const i of l) {\r\n        if (!Number.isInteger(i) || i < 0 || i >= total) throw err('E_VALUE', `索引 ${i} 越界（total=${total}）`);\r\n        seen.set(i, (seen.get(i) || 0) + 1);\r\n      }\r\n    }\r\n    const missing = [], duplicates = [];\r\n    for (let i = 0; i < total; i++) {\r\n      const c = seen.get(i) ?? 0;\r\n      if (c === 0) missing.push(i);\r\n      else if (c > 1) duplicates.push(i);\r\n    }\r\n    return { ok: missing.length === 0 && duplicates.length === 0, total, covered: seen.size, missing, duplicates };\r\n  },\r\n});\r\n\r\n\r\n// 类别均衡权重（'balanced'）：w_c = n / (k · n_c)，使加权后每个类别的总权重相等。\r\n// 类别不平衡时配合带权损失使用；与 train.eval.balancedAcc 构成「度量—加权」闭环。\r\ndefineOp({\r\n  id: nid(), domain: 9, name: 'train.util.classWeights', arity: 2,\r\n  sig: '(Tensor y[n], number k) -> Tensor[k]',\r\n  doc: \"类别均衡权重 w_c = n/(k·n_c)（scikit-learn class_weight='balanced' 口径）\",\r\n  ref: \"scikit-learn class_weight='balanced'；King & Zeng, Logistic Regression in Rare Events Data, 2001\",\r\n  inv: 'Σ_c w_c·n_c = n；各类别加权总量 n/k 相等；未出现的类别权重为 0',\r\n  impl: (y, k) => {\r\n    if (!(y instanceof Tensor)) throw new ForgeError('E_TYPE', 'y: 期望 Tensor');\r\n    expectNumber(k, 'k');\r\n    if (!Number.isInteger(k) || k < 1) throw new ForgeError('E_VALUE', 'k 必须为正整数');\r\n    const n = y.size;\r\n    if (n === 0) throw new ForgeError('E_VALUE', 'y 不能为空');\r\n    const cnt = new Array(k).fill(0);\r\n    for (let i = 0; i < n; i++) {\r\n      const c = Math.round(y.data[i]);\r\n      if (!Number.isFinite(c) || c < 0 || c >= k) throw new ForgeError('E_VALUE', `y 第 ${i} 项 ${y.data[i]} 越界（k=${k}）`);\r\n      cnt[c]++;\r\n    }\r\n    const out = new Float64Array(k);\r\n    for (let c = 0; c < k; c++) out[c] = cnt[c] > 0 ? n / (k * cnt[c]) : 0;\r\n    return new Tensor(out, [k]);\r\n  },\r\n});\r\n\r\n// ============================================================================\r\n// 自检：域9 必须恰好 103 条，且 id 连续为 D9-001..D9-103（否则导入即抛错）\r\n// ============================================================================\r\n{\r\n  const ops = opsByDomain(9);\r\n  if (ops.length !== 103) {\r\n    throw new ForgeError('E_VALUE', `域9 指令数必须为 103，当前 ${ops.length}`);\r\n  }\r\n  ops.forEach((op, i) => {\r\n    const expect = `D9-${String(i + 1).padStart(3, '0')}`;\r\n    if (op.id !== expect) {\r\n      throw new ForgeError('E_VALUE', `域9 指令 id 不连续: 第 ${i + 1} 条为 ${op.id}（期望 ${expect}）`);\r\n    }\r\n  });\r\n}\r\n",
"src/ops/d10-sys.mjs":"// 域10 系统编排 SYS（102 条微指令）\r\n// 对标对象：\r\n//   · ONNX Operator Registry（opset 域化命名 + 签名 + 文档 + 版本化）→ sys.reg.*\r\n//   · LLVM Pass Manager（pass 编排、依赖图、流水线调度）        → sys.graph.* / sys.exec.pipe\r\n//   · PyTorch FX（符号图追踪与变换 IR）                          → sys.graph.* / sys.doc.mermaid\r\n//   · Prometheus 指标模型（counter / summary / 分位数）          → sys.tel.*\r\n//   · Hypothesis 属性测试框架（基于策略的随机反例搜索）          → sys.verify.fuzz / determinism\r\n// 组织结构：12 注册表内省 + 8 遥测 + 9 执行组合 + 12 验证 + 9 文档生成 + 8 基准\r\n//           + 8 图编排 + 8 配置 + 7 错误 + 7 环境 + 6 自检 + 8 工具 = 102 条。\r\n// 分层依赖：域10 只依赖内核（core/registry + core/telemetry + core/errors），绝不 import d2..d9；\r\n//           需要数学基元时由调用方注入 op 列表，避免循环依赖。\r\n// 纯函数约定：sys.doc.* 全部返回字符串（不落盘）；随机一律走 createRng(seed)，禁用 Math.random。\r\nimport {\r\n  defineOp, exec, tryExec, getOp, hasOp, listOps, countOps, opsByDomain, searchOps,\r\n  describeOp, DOMAINS, KERNEL_VERSION, CATALOG_VERSION, telemetry,\r\n  createRng, seedFrom, ForgeError, CODES, Tensor, expectNumber, expectTensor, requiredParams,\r\n} from '../core/index.mjs';\r\n\r\nconst D = 10;\r\nlet _s = 0;\r\nconst nid = () => `D${D}-${String(++_s).padStart(3, '0')}`;\r\n\r\n// =====================================================================\r\n// 内部小工具（非指令）\r\n// =====================================================================\r\n\r\n// 高精度单调时钟（纳秒级），毫秒浮点。基准与遥测统一走这里。\r\nconst _now = () => {\r\n  if (typeof process !== 'undefined' && process.hrtime && process.hrtime.bigint) {\r\n    return Number(process.hrtime.bigint()) / 1e6;\r\n  }\r\n  if (typeof performance !== 'undefined' && performance.now) return performance.now();\r\n  return 0;\r\n};\r\n\r\n// FNV-1a 64 位（Fowler–Noll–Vo）；以 BigInt 精确实现，避免 32 位碰撞。\r\nconst _M64 = (1n << 64n) - 1n;\r\nconst _P64 = 0x100000001b3n;\r\nfunction fnv1a64(str) {\r\n  let h = 0xcbf29ce484222325n;\r\n  const s = String(str);\r\n  for (let i = 0; i < s.length; i++) {\r\n    h = (h ^ BigInt(s.charCodeAt(i) & 0xff)) & _M64;\r\n    h = (h * _P64) & _M64;\r\n  }\r\n  return h;\r\n}\r\nconst _hex64 = (h) => '0x' + h.toString(16).padStart(16, '0');\r\n\r\n// 稳定序列化：用于确定性比较、配置哈希、CSV/JSON 导出。\r\n//   -0 归一为 0；NaN 字面量化；Tensor 展开为 shape+data；对象键排序。\r\nfunction _stable(v) {\r\n  if (v === null) return 'null';\r\n  if (v === undefined) return 'undef';\r\n  const t = typeof v;\r\n  if (t === 'number') return Object.is(v, -0) ? '0' : (Number.isNaN(v) ? 'NaN' : String(v));\r\n  if (t === 'bigint') return v.toString() + 'n';\r\n  if (t === 'boolean' || t === 'string') return JSON.stringify(v);\r\n  if (t === 'function') return 'fn';\r\n  if (v instanceof Tensor) return `T[${v.shape.join(',')}](${Array.from(v.data).map(_stable).join(',')})`;\r\n  if (v instanceof Float64Array) return `F[${Array.from(v).map(_stable).join(',')}]`;\r\n  if (Array.isArray(v)) return `[${v.map(_stable).join(',')}]`;\r\n  const keys = Object.keys(v).sort();\r\n  return `{${keys.map(k => JSON.stringify(k) + ':' + _stable(v[k])).join(',')}}`;\r\n}\r\n\r\n// 转成 JSON 安全结构（函数折叠为占位串，键排序），供 sys.doc.jsonExport 使用。\r\nfunction _plain(v) {\r\n  if (v === null || v === undefined) return v;\r\n  const t = typeof v;\r\n  if (t === 'number') return Number.isFinite(v) ? v : String(v);\r\n  if (t === 'string' || t === 'boolean') return v;\r\n  if (t === 'bigint') return v.toString();\r\n  if (t === 'function') return '[function]';\r\n  if (v instanceof Tensor) return { shape: v.shape.slice(), data: Array.from(v.data) };\r\n  if (v instanceof Float64Array) return Array.from(v);\r\n  if (Array.isArray(v)) return v.map(_plain);\r\n  const out = {};\r\n  for (const k of Object.keys(v).sort()) out[k] = _plain(v[k]);\r\n  return out;\r\n}\r\n\r\n// op 元信息摘要（剔除 impl 等不可序列化字段）\r\nconst _sum = (op) => (op && typeof op === 'object')\r\n  ? {\r\n    id: op.id ?? null, name: op.name ?? null, domain: op.domain ?? null,\r\n    arity: op.arity ?? null, sig: op.sig ?? '', doc: op.doc ?? '', ref: op.ref ?? '', inv: op.inv ?? '',\r\n  }\r\n  : op;\r\nconst _sums = (ops) => (Array.isArray(ops) ? ops : []).map(_sum);\r\n\r\n// op 查找：先在入参 ops 中按 name/id 找，再回落到全局注册表。\r\nfunction _findOp(ops, x) {\r\n  if (x && typeof x === 'object') return x;\r\n  const arr = Array.isArray(ops) ? ops : [];\r\n  const hit = arr.find(o => o && (o.name === x || o.id === x));\r\n  if (hit) return hit;\r\n  if (typeof x === 'string' && hasOp(x)) return getOp(x);\r\n  throw new ForgeError('E_NOTFOUND', `指令不存在: ${x}`);\r\n}\r\nconst _nameOf = (id) => { try { return hasOp(id) ? getOp(id).name : id; } catch { return id; } };\r\n\r\n// 本地观测表：telemetry 只暴露 record/recordError（语义为「已发生」），\r\n// 域10 另维护一张可手动写入的观测表，供 sys.tel.record 使用。\r\nconst _obs = new Map();  // key -> {calls, errors}\r\nconst _lat = new Map();  // key -> number[]（毫秒）\r\nconst _memo = new Map(); // 记忆化缓存\r\n\r\nfunction _obsGet(k) {\r\n  if (!_obs.has(k)) _obs.set(k, { calls: 0, errors: 0 });\r\n  return _obs.get(k);\r\n}\r\nfunction _latAdd(k, ms) {\r\n  if (!_lat.has(k)) _lat.set(k, []);\r\n  _lat.get(k).push(ms);\r\n}\r\n// 合并「内核遥测」与「本地观测」为统一行。\r\nfunction _mergedRows() {\r\n  const map = new Map();\r\n  for (const r of telemetry.summary()) {\r\n    map.set(r.id, { id: r.id, name: _nameOf(r.id), calls: r.calls, errors: r.errors, ms: r.ms });\r\n  }\r\n  for (const [k, v] of _obs) {\r\n    const id = (typeof k === 'string' && hasOp(k)) ? getOp(k).id : k;\r\n    if (!map.has(id)) map.set(id, { id, name: _nameOf(id), calls: 0, errors: 0, ms: 0 });\r\n    const e = map.get(id);\r\n    e.calls += v.calls; e.errors += v.errors;\r\n  }\r\n  return [...map.values()];\r\n}\r\nfunction _rowsByIdOrName(rows, x) {\r\n  if (x === undefined || x === null || x === '') return rows;\r\n  const id = (typeof x === 'string' && hasOp(x)) ? getOp(x).id : x;\r\n  return rows.filter(r => r.id === id || r.name === x);\r\n}\r\n\r\n// —— 签名解析：'(Tensor a, number[] shape) -> Tensor' -> ['Tensor','number[]'] ——\r\nfunction _sigTypes(sig) {\r\n  const m = /\\(([^)]*)\\)/.exec(String(sig == null ? '' : sig));\r\n  if (!m || m[1].trim() === '') return [];\r\n  return m[1].split(',').map(s => s.trim()).filter(Boolean).map((s) => {\r\n    const mm = /^([A-Za-z_$][\\w$<>]*(?:\\[\\])*)/.exec(s);\r\n    return mm ? mm[1] : 'any';\r\n  });\r\n}\r\n\r\n// —— 按签名类型生成随机入参（Hypothesis 风格的策略推导）——\r\nfunction _genOne(t, rng) {\r\n  switch (t) {\r\n    case 'Tensor': return Tensor.fromFlat([rng.range(-4, 4), rng.range(-4, 4), rng.range(-4, 4)], [3]);\r\n    case 'Tensor[]': return [Tensor.fromFlat([rng.range(-4, 4), rng.range(-4, 4)], [2])];\r\n    case 'number': return rng.range(-8, 8);\r\n    case 'number[]': return [2, 2];\r\n    case 'number[][]': return [[1, 1], [1, 1]];\r\n    case 'string': return 'abc';\r\n    case 'boolean': return true;\r\n    case 'object': return {};\r\n    case 'array': return [1, 2];\r\n    default:\r\n      if (/Tensor/.test(t)) return Tensor.fromFlat([1, 2, 3], [3]);\r\n      return rng.range(-8, 8);\r\n  }\r\n}\r\nfunction _genArgs(op, rng) {\r\n  const types = _sigTypes(op && op.sig);\r\n  const n = types.length ? types.length : Math.max(1, (op && op.arity) || 1);\r\n  const out = [];\r\n  for (let i = 0; i < n; i++) out.push(_genOne(types[i] || 'any', rng));\r\n  return out;\r\n}\r\n\r\n// —— 图工具（Kahn / DFS 染色）——\r\nfunction _nodesOf(g) {\r\n  const nodes = Array.isArray(g) ? g : (g && Array.isArray(g.nodes) ? g.nodes : null);\r\n  if (!nodes) throw new ForgeError('E_TYPE', 'graph 需为 {nodes:[...]} 或节点数组');\r\n  return nodes;\r\n}\r\nfunction _adjOf(nodes) {\r\n  const ids = nodes.map(n => n.id);\r\n  const adj = new Map(ids.map(i => [i, []]));\r\n  const indeg = new Map(ids.map(i => [i, 0]));\r\n  for (const n of nodes) {\r\n    for (const src of (n.inputs || [])) {\r\n      if (!adj.has(src)) throw new ForgeError('E_NOTFOUND', `节点 ${n.id} 引用了不存在的上游: ${src}`);\r\n      adj.get(src).push(n.id);\r\n      indeg.set(n.id, indeg.get(n.id) + 1);\r\n    }\r\n  }\r\n  return { ids, adj, indeg };\r\n}\r\nfunction _topo(nodes) {\r\n  const { ids, adj, indeg } = _adjOf(nodes);\r\n  const q = ids.filter(i => indeg.get(i) === 0);\r\n  const order = [];\r\n  while (q.length) {\r\n    const cur = q.shift();\r\n    order.push(cur);\r\n    for (const nx of adj.get(cur)) {\r\n      indeg.set(nx, indeg.get(nx) - 1);\r\n      if (indeg.get(nx) === 0) q.push(nx);\r\n    }\r\n  }\r\n  return { order, ok: order.length === ids.length };\r\n}\r\nfunction _findCycle(nodes) {\r\n  const { ids, adj } = _adjOf(nodes);\r\n  const color = new Map(ids.map(i => [i, 0]));\r\n  const stack = [];\r\n  let cycle = null;\r\n  const dfs = (u) => {\r\n    color.set(u, 1); stack.push(u);\r\n    for (const v of adj.get(u)) {\r\n      if (cycle) return;\r\n      const c = color.get(v);\r\n      if (c === 0) dfs(v);\r\n      else if (c === 1) { cycle = stack.slice(stack.indexOf(v)).concat([v]); return; }\r\n    }\r\n    color.set(u, 2); stack.pop();\r\n  };\r\n  for (const i of ids) { if (!cycle && color.get(i) === 0) dfs(i); }\r\n  return cycle; // null 或 [a,b,...,a]\r\n}\r\nconst _edgesOf = (nodes) => {\r\n  const es = [];\r\n  for (const n of nodes) for (const s of (n.inputs || [])) es.push([s, n.id]);\r\n  return es;\r\n};\r\n\r\n// —— 配置工具 ——\r\nconst _isPlainObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v) && !(v instanceof Tensor);\r\nfunction _deepMerge(a, b) {\r\n  if (!_isPlainObj(a) || !_isPlainObj(b)) return b === undefined ? a : b;\r\n  const out = { ...a };\r\n  for (const k of Object.keys(b)) {\r\n    out[k] = (_isPlainObj(out[k]) && _isPlainObj(b[k])) ? _deepMerge(out[k], b[k]) : b[k];\r\n  }\r\n  return out;\r\n}\r\nfunction _deepFreeze(o) {\r\n  if (!_isPlainObj(o) && !Array.isArray(o)) return o;\r\n  for (const k of Object.keys(o)) {\r\n    const v = o[k];\r\n    if ((_isPlainObj(v) || Array.isArray(v)) && !Object.isFrozen(v)) _deepFreeze(v);\r\n  }\r\n  return Object.freeze(o);\r\n}\r\nfunction _walkDiff(a, b, path, acc) {\r\n  if (_isPlainObj(a) && _isPlainObj(b)) {\r\n    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);\r\n    for (const k of keys) {\r\n      const p = path ? `${path}.${k}` : k;\r\n      if (!(k in a)) acc.added.push(p);\r\n      else if (!(k in b)) acc.removed.push(p);\r\n      else _walkDiff(a[k], b[k], p, acc);\r\n    }\r\n    return;\r\n  }\r\n  if (_stable(a) !== _stable(b)) acc.changed.push(path || '');\r\n}\r\nfunction _typeOk(v, t) {\r\n  switch (t) {\r\n    case 'number': return typeof v === 'number' && Number.isFinite(v);\r\n    case 'int': return Number.isInteger(v);\r\n    case 'string': return typeof v === 'string';\r\n    case 'boolean': return typeof v === 'boolean';\r\n    case 'object': return _isPlainObj(v);\r\n    case 'array': return Array.isArray(v);\r\n    case 'function': return typeof v === 'function';\r\n    case 'tensor': return v instanceof Tensor;\r\n    case 'any': return true;\r\n    default: return false;\r\n  }\r\n}\r\nconst _esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\r\nconst _csvCell = (v) => {\r\n  const s = String(v == null ? '' : v);\r\n  return /[\",\\n]/.test(s) ? `\"${s.replace(/\"/g, '\"\"')}\"` : s;\r\n};\r\n\r\n// —— 错误分类学映射 ——\r\nconst ERR_CATEGORY = {\r\n  E_ARITY: 'interface', E_TYPE: 'type', E_SHAPE: 'shape', E_VALUE: 'value',\r\n  E_NUMERICAL: 'numerical', E_LIMIT: 'resource', E_NOTFOUND: 'lookup', E_STATE: 'state',\r\n};\r\nconst ERR_RETRYABLE = { E_NUMERICAL: true, E_LIMIT: true };\r\nconst ERR_SUGGEST = {\r\n  E_ARITY: '补齐参数到 op.arity 要求个数（可选参数也要占位传入）',\r\n  E_TYPE: '核对签名类型：Tensor / number / string / object 是否与 op.sig 一致',\r\n  E_SHAPE: '核对 shape 与广播规则，必要时先 reshape / 补齐前导维度',\r\n  E_VALUE: '取值越界：检查正数、区间、非空集合等前置条件',\r\n  E_NUMERICAL: '数值失败：缩放输入、换用稳定算法或提高迭代精度；属可重试类',\r\n  E_LIMIT: '超出限额：增大迭代上限 / 时间预算后重试；属可重试类',\r\n  E_NOTFOUND: '指令名拼写错误，或尚未 import 对应域文件完成注册',\r\n  E_STATE: '状态机顺序错误：检查初始化与调用次序（如重复 backward）',\r\n};\r\nconst _errCodeOf = (e) => (e && e.code) ? e.code : (e instanceof Error ? 'E_NUMERICAL' : 'E_UNKNOWN');\r\n\r\n// =====================================================================\r\n// 一、注册表内省 sys.reg.*（12 条）\r\n// =====================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.count', arity: 1,\r\n  sig: '(number? domain) -> number',\r\n  doc: '指令总数；给定 domain 时返回该域条数',\r\n  ref: 'ONNX Operator Registry（opset 域化统计）',\r\n  inv: 'count()=countOps()；count(d)=opsByDomain(d).length；∑count(d)=count()',\r\n  impl: (domain) => (domain === undefined || domain === null) ? countOps() : opsByDomain(Number(domain)).length,\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.domains', arity: 0,\r\n  sig: '() -> object[]',\r\n  doc: '列出全部域元信息（code/name/desc）及当前实际条数',\r\n  ref: 'ONNX Operator Registry 域划分',\r\n  inv: '返回 10 个域；每域 count = opsByDomain(d).length',\r\n  impl: () => Object.keys(DOMAINS).map(Number).sort((a, b) => a - b).map((d) => ({\r\n    domain: d, code: DOMAINS[d].code, name: DOMAINS[d].name, desc: DOMAINS[d].desc,\r\n    count: opsByDomain(d).length,\r\n  })),\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.byDomain', arity: 1,\r\n  sig: '(number domain) -> op[]',\r\n  doc: '按域取指令摘要列表（已剔除 impl，可安全序列化）',\r\n  ref: 'ONNX Operator Registry 域化查询',\r\n  inv: '结果全部 op.domain 等于入参；条数等于 sys.reg.count(domain)',\r\n  impl: (domain) => {\r\n    const d = Number(domain);\r\n    if (!DOMAINS[d]) throw new ForgeError('E_VALUE', `未知域: ${d}`);\r\n    return _sums(opsByDomain(d));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.search', arity: 1,\r\n  sig: '(string q) -> op[]',\r\n  doc: '按关键字检索指令（匹配 name / doc / id，忽略大小写）',\r\n  ref: 'ONNX Operator Registry 检索语义',\r\n  inv: '每条结果的 name/doc/id 之一包含小写化后的查询串',\r\n  impl: (q) => {\r\n    const s = String(q == null ? '' : q);\r\n    return _sums(searchOps(s));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.describe', arity: 1,\r\n  sig: '(string nameOrId) -> string',\r\n  doc: '单条指令的完整一行描述（id / name / doc / sig / 参考 / 不变量）',\r\n  ref: 'ONNX Operator Registry op 文档',\r\n  inv: '输出包含 op.id 与 op.name，且与 describeOp 一致',\r\n  impl: (nameOrId) => describeOp(String(nameOrId)),\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.exists', arity: 1,\r\n  sig: '(string nameOrId) -> boolean',\r\n  doc: '判断指令是否已注册（按 id 或 name）',\r\n  ref: 'ONNX Operator Registry 存在性查询',\r\n  inv: 'exists(x) 为真当且仅当 getOp(x) 不抛错',\r\n  impl: (nameOrId) => (typeof nameOrId === 'string' ? hasOp(nameOrId) : false),\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.signature', arity: 1,\r\n  sig: '(string nameOrId) -> string',\r\n  doc: '取指令签名字符串',\r\n  ref: 'ONNX Operator Schema（输入输出签名）',\r\n  inv: 'signature(x) = getOp(x).sig',\r\n  impl: (nameOrId) => _findOp(null, nameOrId).sig,\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.catalogHash', arity: 1,\r\n  sig: '(boolean? includeDocs) -> string',\r\n  doc: '全目录指纹：FNV-1a 64 位，按 id 排序后对 id|domain|name|arity|sig(+doc+ref+inv) 求哈希',\r\n  ref: 'FNV-1a（Fowler–Noll–Vo 哈希）/ MurmurHash3',\r\n  inv: '相同目录两次调用结果相同；任一 op 改名 / 改签名 / 新增一条都会改变哈希',\r\n  impl: (includeDocs) => {\r\n    const withDocs = includeDocs === undefined ? true : Boolean(includeDocs);\r\n    const ops = listOps().slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));\r\n    const parts = ops.map(o => withDocs\r\n      ? `${o.id}|${o.domain}|${o.name}|${o.arity}|${o.sig}|${o.doc}|${o.ref}|${o.inv}`\r\n      : `${o.id}|${o.domain}|${o.name}|${o.arity}|${o.sig}`);\r\n    return _hex64(fnv1a64(parts.join('\\n')));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.version', arity: 0,\r\n  sig: '() -> object',\r\n  doc: '内核版本与目录版本',\r\n  ref: 'ONNX opset 版本化约定',\r\n  inv: 'version().kernel = KERNEL_VERSION；version().catalog = CATALOG_VERSION',\r\n  impl: () => ({ kernel: KERNEL_VERSION, catalog: CATALOG_VERSION }),\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.nameIndex', arity: 0,\r\n  sig: '() -> object',\r\n  doc: 'name -> {id, domain, arity} 的索引表，供 O(1) 反查',\r\n  ref: 'PyTorch aten native_functions 名称索引',\r\n  inv: '索引键集合等于全部指令 name 集合，且每个 name 唯一',\r\n  impl: () => {\r\n    const out = {};\r\n    for (const o of listOps()) out[o.name] = { id: o.id, domain: o.domain, arity: o.arity };\r\n    return out;\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.opIds', arity: 1,\r\n  sig: '(number? domain) -> string[]',\r\n  doc: '排序后的指令 id 列表（可选按域过滤）',\r\n  ref: 'ONNX Operator Registry 稳定标识',\r\n  inv: '列表按字典序升序；无重复；过滤后条数等于该域条数',\r\n  impl: (domain) => {\r\n    const ops = (domain === undefined || domain === null) ? listOps() : opsByDomain(Number(domain));\r\n    return ops.map(o => o.id).sort();\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.reg.domainStats', arity: 0,\r\n  sig: '() -> object[]',\r\n  doc: '每个域的统计：条数、占比、首个/末个 id',\r\n  ref: 'Prometheus 指标模型（分组计数 + 占比）',\r\n  inv: '各域 count 之和 = countOps()；ratio ∈ [0,1] 且总和为 1',\r\n  impl: () => {\r\n    const total = countOps() || 1;\r\n    return Object.keys(DOMAINS).map(Number).sort((a, b) => a - b).map((d) => {\r\n      const ops = opsByDomain(d);\r\n      const ids = ops.map(o => o.id).sort();\r\n      return {\r\n        domain: d, code: DOMAINS[d].code, name: DOMAINS[d].name,\r\n        count: ops.length, ratio: ops.length / total,\r\n        firstId: ids[0] ?? null, lastId: ids[ids.length - 1] ?? null,\r\n      };\r\n    });\r\n  },\r\n});\r\n\r\n// =====================================================================\r\n// 二、遥测 sys.tel.*（8 条）\r\n// =====================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.summary', arity: 1,\r\n  sig: '(number? k) -> row[]',\r\n  doc: '遥测汇总：每行 {id, name, calls, errors, ms}，按调用次数降序；k 限定行数',\r\n  ref: 'Prometheus 指标模型（counter / summary）',\r\n  inv: '按 calls 降序；k 给定时行数 ≤ k；每行 calls ≥ errors ≥ 0',\r\n  impl: (k) => {\r\n    const rows = _mergedRows().sort((a, b) => b.calls - a.calls || (a.id < b.id ? -1 : 1));\r\n    const n = (k === undefined || k === null) ? rows.length : Math.max(0, Math.floor(Number(k)));\r\n    return rows.slice(0, n);\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.hotOps', arity: 1,\r\n  sig: '(number k) -> row[]',\r\n  doc: '调用最频繁的 k 条指令（热点分析）',\r\n  ref: 'Prometheus TopK 查询语义',\r\n  inv: '返回行数 = min(k, 总行数)，且是 summary 的前缀',\r\n  impl: (k) => {\r\n    const rows = _mergedRows().sort((a, b) => b.calls - a.calls || (a.id < b.id ? -1 : 1));\r\n    const n = Math.max(0, Math.floor(Number(k === undefined ? 10 : k)));\r\n    return rows.slice(0, n);\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.reset', arity: 0,\r\n  sig: '() -> boolean',\r\n  doc: '清空内核遥测与域10 本地观测表',\r\n  ref: 'Prometheus 指标重置语义',\r\n  inv: 'reset 后 totalCalls() 中来自内核的部分为 0',\r\n  impl: () => { telemetry.reset(); _obs.clear(); _lat.clear(); return true; },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.totalCalls', arity: 0,\r\n  sig: '() -> number',\r\n  doc: '累计调用次数（内核遥测 + 本地观测）',\r\n  ref: 'Prometheus counter 单调递增语义',\r\n  inv: 'totalCalls() = 各行 calls 之和；reset 后归零',\r\n  impl: () => telemetry.totalCalls() + [..._obs.values()].reduce((a, v) => a + v.calls, 0),\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.record', arity: 2,\r\n  sig: '(string opName, boolean ok) -> object',\r\n  doc: '手动记录一次调用观测（成功/失败各计一次调用，失败额外计一次错误）',\r\n  ref: 'OpenTelemetry 指标规范（手动埋点）',\r\n  inv: 'ok=false 使该指令 errors+1；ok=true 仅使 calls+1',\r\n  impl: (opName, ok) => {\r\n    const key = String(opName);\r\n    const e = _obsGet(key);\r\n    e.calls += 1;\r\n    if (!ok) e.errors += 1;\r\n    return { op: key, calls: e.calls, errors: e.errors };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.errorRate', arity: 1,\r\n  sig: '(string? opName) -> number',\r\n  doc: '错误率 = 错误数 / 调用数；无调用时返回 0',\r\n  ref: 'Prometheus 比率指标（errors / total）',\r\n  inv: 'errorRate ∈ [0,1]；分母为 0 时返回 0',\r\n  impl: (opName) => {\r\n    const rows = _rowsByIdOrName(_mergedRows(), opName);\r\n    let c = 0, e = 0;\r\n    for (const r of rows) { c += r.calls; e += r.errors; }\r\n    return c === 0 ? 0 : e / c;\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.latencyStats', arity: 0,\r\n  sig: '() -> object',\r\n  doc: '延迟统计（min/mean/max/p50/p95），样本来自 sys.exec.call / sys.exec.timed / sys.bench.*',\r\n  ref: 'Prometheus Summary 分位数语义',\r\n  inv: '样本升序后 p50 ≤ p95 ≤ max；无样本时全部为 0',\r\n  impl: () => {\r\n    const xs = [];\r\n    for (const arr of _lat.values()) for (const v of arr) xs.push(v);\r\n    for (const r of _mergedRows()) if (r.ms > 0) xs.push(r.ms);\r\n    if (xs.length === 0) return { n: 0, min: 0, max: 0, mean: 0, p50: 0, p95: 0 };\r\n    const s = xs.slice().sort((a, b) => a - b);\r\n    const q = (p) => s[Math.min(s.length - 1, Math.max(0, Math.ceil(p * s.length) - 1))];\r\n    const sum = s.reduce((a, v) => a + v, 0);\r\n    return {\r\n      n: s.length, min: s[0], max: s[s.length - 1],\r\n      mean: sum / s.length, p50: q(0.5), p95: q(0.95),\r\n    };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.tel.topErrors', arity: 1,\r\n  sig: '(number k) -> row[]',\r\n  doc: '错误次数最多的 k 条指令',\r\n  ref: 'Prometheus TopK 查询语义',\r\n  inv: '按 errors 降序；errors 为 0 的行排在末尾',\r\n  impl: (k) => {\r\n    const rows = _mergedRows().sort((a, b) => b.errors - a.errors || (a.id < b.id ? -1 : 1));\r\n    const n = Math.max(0, Math.floor(Number(k === undefined ? 10 : k)));\r\n    return rows.slice(0, n);\r\n  },\r\n});\r\n\r\n// =====================================================================\r\n// 三、执行与组合 sys.exec.*（9 条）\r\n// =====================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.call', arity: 2,\r\n  sig: '(string name, any[] args) -> any',\r\n  doc: '统一调度执行：额外把本次耗时记入域10 延迟表',\r\n  ref: 'LLVM Pass Manager 统一 pass 调度入口',\r\n  inv: '返回值等于 exec(name, args)；耗时被记录到 latencyStats 样本集',\r\n  impl: (name, args) => {\r\n    const list = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n    const t0 = _now();\r\n    const v = exec(String(name), list);\r\n    _latAdd(String(name), _now() - t0);\r\n    return v;\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.try', arity: 2,\r\n  sig: '(string name, any[] args) -> object',\r\n  doc: '不抛错执行，返回 {ok, value|error}；error 被折叠为 {code, message}',\r\n  ref: 'LLVM Pass Manager 的可失败调度 / Rust Result 语义',\r\n  inv: '永不抛出；ok=true 时含 value，ok=false 时含 error.code',\r\n  impl: (name, args) => {\r\n    const list = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n    const r = tryExec(String(name), list);\r\n    if (r.ok) return { ok: true, value: r.value, error: null };\r\n    return { ok: false, value: null, error: { code: _errCodeOf(r.error), message: r.error.message } };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.batch', arity: 1,\r\n  sig: '(call[] calls) -> object[]',\r\n  doc: '批量执行：calls 为 [[name, args], ...] 或 [{op, args}, ...]；逐条 try，不中断',\r\n  ref: 'LLVM Pass Manager 批处理调度',\r\n  inv: '输出长度等于输入长度；失败项 ok=false 且不影响其它项',\r\n  impl: (calls) => {\r\n    const list = Array.isArray(calls) ? calls : [];\r\n    return list.map((c) => {\r\n      let name, args;\r\n      if (Array.isArray(c)) { name = c[0]; args = c[1]; }\r\n      else if (c && typeof c === 'object') { name = c.op ?? c.name; args = c.args; }\r\n      else throw new ForgeError('E_TYPE', `batch 元素无法解析: ${String(c)}`);\r\n      const list2 = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n      const t0 = _now();\r\n      const r = tryExec(String(name), list2);\r\n      const ms = _now() - t0;\r\n      return r.ok\r\n        ? { ok: true, op: String(name), value: r.value, ms, error: null }\r\n        : { ok: false, op: String(name), value: null, ms, error: { code: _errCodeOf(r.error), message: r.error.message } };\r\n    });\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.pipe', arity: 2,\r\n  sig: '(step[] steps, any x) -> any',\r\n  doc: '管道串联：steps 为 [{op, args?}]，每步以「上一步输出 + args」为入参调用',\r\n  ref: 'LLVM Pass Manager 流水线 / Unix 管道语义',\r\n  inv: 'pipe([s1,s2], x) = exec(s2.op, [exec(s1.op, [x, ...s1.args]), ...s2.args])',\r\n  impl: (steps, x) => {\r\n    const list = Array.isArray(steps) ? steps : [];\r\n    let cur = x;\r\n    for (const st of list) {\r\n      const name = typeof st === 'string' ? st : (st && (st.op ?? st.name));\r\n      if (!name) throw new ForgeError('E_VALUE', 'pipe 步骤缺少 op 名');\r\n      const extra = (st && st.args === undefined) ? [] : (Array.isArray(st.args) ? st.args : [st.args]);\r\n      cur = exec(String(name), [cur, ...extra]);\r\n    }\r\n    return cur;\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.map', arity: 2,\r\n  sig: '(string opName, any[] xs) -> any[]',\r\n  doc: '把单参指令映射到数组每个元素',\r\n  ref: 'PyTorch FX 图变换中的逐节点映射',\r\n  inv: '输出长度等于 xs 长度；第 i 项 = exec(opName, [xs[i]])',\r\n  impl: (opName, xs) => {\r\n    const list = Array.isArray(xs) ? xs : [];\r\n    return list.map(v => exec(String(opName), [v]));\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.timed', arity: 2,\r\n  sig: '(string name, any[] args) -> object',\r\n  doc: '带耗时返回：{value, ms}',\r\n  ref: 'Prometheus 直方图观测语义',\r\n  inv: 'ms ≥ 0；value 等于 exec(name, args)',\r\n  impl: (name, args) => {\r\n    const list = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n    const t0 = _now();\r\n    const v = exec(String(name), list);\r\n    const ms = _now() - t0;\r\n    _latAdd(String(name), ms);\r\n    return { value: v, ms };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.retry', arity: 3,\r\n  sig: '(string opName, any[] args, object cfg) -> object',\r\n  doc: '失败重试：只对可重试错误码（E_NUMERICAL / E_LIMIT）重试；cfg={retries, backoffMs}',\r\n  ref: 'Decandia et al. 2007 Dynamo 重试与退避策略',\r\n  inv: '不可重试错误码时 attempts=1；全部失败后 ok=false 且 attempts=retries+1',\r\n  impl: (opName, args, cfg) => {\r\n    const c = (cfg === undefined || cfg === null) ? {} : cfg;\r\n    const retries = Math.max(0, Math.floor(c.retries === undefined ? 2 : Number(c.retries)));\r\n    const backoff = Math.max(0, Number(c.backoffMs === undefined ? 0 : c.backoffMs));\r\n    const list = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n    let attempts = 0;\r\n    let lastCode = null, lastMsg = null;\r\n    for (let i = 0; i <= retries; i++) {\r\n      attempts = i + 1;\r\n      const r = tryExec(String(opName), list);\r\n      if (r.ok) return { ok: true, value: r.value, attempts, error: null };\r\n      lastCode = _errCodeOf(r.error);\r\n      lastMsg = r.error.message;\r\n      if (!ERR_RETRYABLE[lastCode]) break;\r\n      if (backoff > 0 && i < retries) { const t0 = _now(); while (_now() - t0 < backoff) { /* 忙等退避 */ } }\r\n    }\r\n    return { ok: false, value: null, attempts, error: { code: lastCode, message: lastMsg } };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.memo', arity: 2,\r\n  sig: '(string opName, any[] args) -> object',\r\n  doc: '记忆化：以 name + 稳定序列化(args) 为键缓存，返回 {value, hit}',\r\n  ref: 'LLVM Pass Manager 结果缓存 / Bellman 1957 动态规划备忘',\r\n  inv: '首次 hit=false；同参再次调用 hit=true 且 value 与首次稳定序列化相同',\r\n  impl: (opName, args) => {\r\n    const list = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n    const key = `${String(opName)}#${_stable(list)}`;\r\n    if (_memo.has(key)) return { value: _memo.get(key), hit: true };\r\n    const v = exec(String(opName), list);\r\n    _memo.set(key, v);\r\n    return { value: v, hit: false };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.exec.assertOp', arity: 3,\r\n  sig: '(string name, any[] args, function|string predicate) -> boolean',\r\n  doc: '执行后断言：predicate 为函数（接收 value）或已注册指令名（以 [value] 调用）',\r\n  ref: 'Hypothesis 属性测试框架（不变量断言）',\r\n  inv: '返回布尔；predicate 抛错时按 E_VALUE 归一化后向上抛出',\r\n  impl: (name, args, predicate) => {\r\n    const list = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n    const v = exec(String(name), list);\r\n    let r;\r\n    if (typeof predicate === 'function') r = predicate(v);\r\n    else if (typeof predicate === 'string') r = exec(predicate, [v]);\r\n    else throw new ForgeError('E_TYPE', 'predicate 需为函数或已注册指令名');\r\n    return Boolean(r);\r\n  },\r\n});\r\n\r\n// =====================================================================\r\n// 四、验证 sys.verify.*（12 条）—— 全部以 ops 数组为第一入参\r\n// =====================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.catalog', arity: 2,\r\n  sig: '(op[] ops, object opt) -> object',\r\n  doc: '目录级综合校验：名字唯一 / id 连续 / arity 一致 / doc 与 ref 齐备 / 域计数',\r\n  ref: 'ONNX Operator Registry 一致性检查（checker）',\r\n  inv: 'ok = (issues.length === 0)；total = ops.length；checks 覆盖 5 个子项',\r\n  impl: (ops, opt) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const o = (opt === undefined || opt === null) ? {} : opt;\r\n    const minLen = o.minLen === undefined ? 4 : Number(o.minLen);\r\n    const issues = [];\r\n    const seen = new Map();\r\n    for (const op of list) {\r\n      const nm = op && op.name;\r\n      if (seen.has(nm)) issues.push({ kind: 'dupName', name: nm }); else seen.set(nm, op);\r\n      if (!op || !op.doc || String(op.doc).length < minLen) issues.push({ kind: 'doc', name: nm });\r\n      if (!op || !op.ref || String(op.ref).length < minLen) issues.push({ kind: 'ref', name: nm });\r\n      if (op && op.arity != null && typeof op.impl === 'function' && op.arity !== op.impl.length) {\r\n        issues.push({ kind: 'arity', name: nm, arity: op.arity, impl: op.impl.length });\r\n      }\r\n    }\r\n    const byDomain = {};\r\n    for (const op of list) { const d = op && op.domain; byDomain[d] = (byDomain[d] || 0) + 1; }\r\n    const ids = list.map(op => op && String(op.id || '')).sort();\r\n    for (let i = 0; i < ids.length; i++) {\r\n      if (i > 0 && ids[i] === ids[i - 1]) issues.push({ kind: 'dupId', id: ids[i] });\r\n    }\r\n    return { ok: issues.length === 0, total: list.length, byDomain, issues };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.invariants', arity: 1,\r\n  sig: '(op[] ops) -> object',\r\n  doc: '检查每条指令都声明了非空不变量（长度 ≥ minLen），并统计未声明项',\r\n  ref: 'Hypothesis 属性测试框架（不变量声明）',\r\n  inv: 'checked = ops.length；ok 为真当且仅当每条 op.inv 非空且长度 ≥ 5',\r\n  impl: (ops) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const failures = [];\r\n    for (const op of list) {\r\n      const inv = op && op.inv;\r\n      if (!inv || String(inv).length < 5) failures.push({ name: op && op.name, id: op && op.id });\r\n    }\r\n    return { checked: list.length, ok: failures.length === 0, failures };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.determinism', arity: 4,\r\n  sig: '(op[] ops, string opName, any[] args, number n) -> boolean',\r\n  doc: '确定性检验：同参重复调用 n 次，稳定序列化逐位相同则为 true',\r\n  ref: 'IEEE 754-2019 确定性运算 / Hypothesis 可复现性要求',\r\n  inv: '对纯函数指令返回 true；任两次结果序列化不同即返回 false',\r\n  impl: (ops, opName, args, n) => {\r\n    _findOp(ops, opName);\r\n    const list = Array.isArray(args) ? args : (args === undefined ? [] : [args]);\r\n    const count = Math.max(1, Math.floor(Number(n === undefined ? 3 : n)));\r\n    let base = null;\r\n    for (let i = 0; i < count; i++) {\r\n      const r = tryExec(String(opName), list);\r\n      if (!r.ok) throw r.error;\r\n      const s = _stable(r.value);\r\n      if (base === null) base = s;\r\n      else if (s !== base) return false;\r\n    }\r\n    return true;\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.fuzz', arity: 2,\r\n  sig: '(op[] ops, string opName, object cfg={}) -> object',\r\n  doc: '模糊测试：按签名推导类型生成随机入参反复调用，捕获但不抛出异常',\r\n  ref: 'Hypothesis 属性测试框架（MacIver & Donaldson et al.）',\r\n  inv: '返回 {trials, failures}；同 seed 下 trials 序列可复现；健壮指令 failures 为空',\r\n  impl: (ops, opName, cfg = undefined) => {\r\n    const op = _findOp(ops, opName);\r\n    const c = (cfg === undefined || cfg === null) ? {} : cfg;\r\n    const trials = Math.max(1, Math.floor(Number(c.trials === undefined ? 20 : c.trials)));\r\n    const seed = Number(c.seed === undefined ? 20261014 : c.seed);\r\n    const rng = createRng(seed);\r\n    const failures = [];\r\n    for (let i = 0; i < trials; i++) {\r\n      const args = _genArgs(op, rng);\r\n      const r = tryExec(String(opName), args);\r\n      if (!r.ok) failures.push({ trial: i, args: _plain(args), code: _errCodeOf(r.error), message: r.error.message });\r\n    }\r\n    return { op: String(opName), trials, failures, seed };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.smoke', arity: 2,\r\n  sig: '(op[] ops, object argsTable) -> object',\r\n  doc: '冒烟：按 argsTable[name] 给出的入参逐条 tryExec，统计失败项',\r\n  ref: 'LLVM lit 冒烟测试框架',\r\n  inv: 'total = ops.length；ok 为真当且仅当 failures 为空；永不抛出',\r\n  impl: (ops, argsTable) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const tbl = (argsTable && typeof argsTable === 'object') ? argsTable : {};\r\n    const failures = [];\r\n    let okCount = 0;\r\n    for (const op of list) {\r\n      const nm = op && op.name;\r\n      const args = Array.isArray(tbl[nm]) ? tbl[nm] : (tbl[nm] === undefined ? [] : [tbl[nm]]);\r\n      const r = tryExec(String(nm), args);\r\n      if (r.ok) okCount++;\r\n      else failures.push({ name: nm, code: _errCodeOf(r.error), message: r.error.message });\r\n    }\r\n    return { total: list.length, ok: okCount, failures };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.docCoverage', arity: 2,\r\n  sig: '(op[] ops, number minLen) -> object',\r\n  doc: '文档覆盖率：doc 非空且长度 ≥ minLen 视为已覆盖',\r\n  ref: 'ONNX Operator Registry 文档完备性要求',\r\n  inv: 'ratio = covered/total ∈ [0,1]；全覆盖时 missing 为空且 ok 为真',\r\n  impl: (ops, minLen) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const m = Math.max(0, Math.floor(Number(minLen === undefined ? 4 : minLen)));\r\n    const missing = [];\r\n    let covered = 0;\r\n    for (const op of list) {\r\n      const d = op && op.doc;\r\n      if (d && String(d).length >= m) covered++;\r\n      else missing.push(op && (op.name ?? op.id));\r\n    }\r\n    return { total: list.length, covered, ratio: list.length ? covered / list.length : 1, missing, ok: missing.length === 0 };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.refCoverage', arity: 2,\r\n  sig: '(op[] ops, number minLen) -> object',\r\n  doc: '参考出处覆盖率：ref 非空且长度 ≥ minLen 视为已覆盖',\r\n  ref: 'ONNX Operator Registry 出处可追溯性要求',\r\n  inv: 'ratio = covered/total ∈ [0,1]；全覆盖时 missing 为空且 ok 为真',\r\n  impl: (ops, minLen) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const m = Math.max(0, Math.floor(Number(minLen === undefined ? 4 : minLen)));\r\n    const missing = [];\r\n    let covered = 0;\r\n    for (const op of list) {\r\n      const d = op && op.ref;\r\n      if (d && String(d).length >= m) covered++;\r\n      else missing.push(op && (op.name ?? op.id));\r\n    }\r\n    return { total: list.length, covered, ratio: list.length ? covered / list.length : 1, missing, ok: missing.length === 0 };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.idContinuity', arity: 1,\r\n  sig: '(op[] ops) -> object',\r\n  doc: 'id 连续性：每域 id 形如 D<d>-NNN，且序号 001..N 无缺号无重复',\r\n  ref: 'ONNX Operator Registry 稳定标识约定',\r\n  inv: 'ok 为真当且仅当每域序号集合恰为 {1..count} 且前缀与 domain 一致',\r\n  impl: (ops) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const groups = new Map();\r\n    const issues = [];\r\n    for (const op of list) {\r\n      const id = op && String(op.id || '');\r\n      const m = /^D(\\d+)-(\\d+)$/.exec(id);\r\n      if (!m) { issues.push({ kind: 'format', id }); continue; }\r\n      const d = Number(m[1]);\r\n      if (op.domain != null && Number(op.domain) !== d) issues.push({ kind: 'prefixMismatch', id, domain: op.domain });\r\n      if (!groups.has(d)) groups.set(d, []);\r\n      groups.get(d).push(Number(m[2]));\r\n    }\r\n    const byDomain = {};\r\n    for (const [d, nums] of groups) {\r\n      const s = nums.slice().sort((a, b) => a - b);\r\n      const dup = s.filter((v, i) => i > 0 && v === s[i - 1]);\r\n      if (dup.length) issues.push({ kind: 'dup', domain: d, seq: dup });\r\n      for (let i = 0; i < s.length; i++) {\r\n        if (s[i] !== i + 1) { issues.push({ kind: 'gap', domain: d, expected: i + 1, got: s[i] }); break; }\r\n      }\r\n      byDomain[d] = s.length;\r\n    }\r\n    return { ok: issues.length === 0, count: list.length, byDomain, issues };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.nameUnique', arity: 1,\r\n  sig: '(op[] ops) -> object',\r\n  doc: '指令名唯一性检查',\r\n  ref: 'ONNX Operator Registry 命名唯一性约束',\r\n  inv: 'ok 为真当且仅当 name 集合无重复；dupes 列出全部重名',\r\n  impl: (ops) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const seen = new Map();\r\n    const dupes = [];\r\n    for (const op of list) {\r\n      const nm = op && op.name;\r\n      if (seen.has(nm)) dupes.push(nm);\r\n      else seen.set(nm, true);\r\n    }\r\n    return { ok: dupes.length === 0, total: list.length, unique: seen.size, dupes: [...new Set(dupes)] };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.arityCheck', arity: 1,\r\n  sig: '(op[] ops) -> object',\r\n  doc: 'arity 一致性：注册的 arity 必须等于由 impl 形参表推导出的「必需参数个数」',\r\n  ref: 'ONNX Operator Schema 元数校验；arity 由实现反推以避免元数据漂移',\r\n  inv: 'ok 为真当且仅当每条指令的 arity = requiredParams(impl)，且 0 ≤ arity ≤ impl.length',\r\n  impl: (ops) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const issues = [];\r\n    let checked = 0, unchecked = 0;\r\n    for (const op of list) {\r\n      const fn = op && typeof op.impl === 'function' ? op.impl : null;\r\n      if (!fn) { unchecked++; continue; }\r\n      const req = requiredParams(fn);\r\n      const n = fn.length;\r\n      if (op.arity == null) { unchecked++; continue; }\r\n      checked++;\r\n      if (Number(op.arity) !== req) issues.push({ name: op.name, arity: op.arity, required: req, impl: n });\r\n      else if (req > n) issues.push({ name: op.name, arity: op.arity, required: req, impl: n });\r\n    }\r\n    return { ok: issues.length === 0, checked, unchecked, issues };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.domainCounts', arity: 2,\r\n  sig: '(op[] ops, number|object expected) -> object',\r\n  doc: '域计数校验：expected 为数字则每域都须等于它；为对象则逐域比对',\r\n  ref: 'forge-1024 目录规约：每域恰好 102 条',\r\n  inv: 'ok 为真当且仅当每个出现过的域条数都符合 expected',\r\n  impl: (ops, expected) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const exp = (expected === undefined || expected === null) ? 102 : expected;\r\n    const counts = {};\r\n    for (const op of list) { const d = op && op.domain; counts[d] = (counts[d] || 0) + 1; }\r\n    const issues = [];\r\n    for (const d of Object.keys(counts)) {\r\n      const want = (typeof exp === 'number') ? exp : (exp[d] ?? exp[String(d)]);\r\n      if (want == null) continue;\r\n      if (counts[d] !== Number(want)) issues.push({ domain: Number(d), got: counts[d], want: Number(want) });\r\n    }\r\n    return { ok: issues.length === 0, counts, issues };\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.verify.errorTaxonomy', arity: 1,\r\n  sig: '(op[] ops) -> object',\r\n  doc: '错误分类学自洽性：每个 CODES 都有类别与建议；分类映射无未知码',\r\n  ref: 'forge-1024 错误分类学（Rust error kinds 风格）',\r\n  inv: 'ok 为真当且仅当 codes 全覆盖且 classify 对每个码返回非 unknown 类别',\r\n  impl: (ops) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const codes = Object.keys(CODES);\r\n    const unknown = [];\r\n    for (const c of codes) {\r\n      if (!ERR_CATEGORY[c] || !ERR_SUGGEST[c]) unknown.push(c);\r\n    }\r\n    return {\r\n      ok: unknown.length === 0, count: codes.length, codes,\r\n      categories: { ...ERR_CATEGORY }, retryable: { ...ERR_RETRYABLE },\r\n      unknown, scanned: list.length,\r\n    };\r\n  },\r\n});\r\n\r\n// =====================================================================\r\n// 五、文档生成 sys.doc.*（9 条）—— 全部返回字符串，不写文件\r\n// =====================================================================\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.doc.opMarkdown', arity: 2,\r\n  sig: '(op[] ops, string nameOrId) -> string',\r\n  doc: '单条指令的 Markdown 卡片',\r\n  ref: 'ONNX Operator Registry 文档格式',\r\n  inv: '输出以 \"### \" 开头，并包含该指令的 name / sig / doc / ref / inv',\r\n  impl: (ops, nameOrId) => {\r\n    const op = _findOp(ops, nameOrId);\r\n    return [\r\n      `### \\`${op.name}\\` · \\`${op.id}\\``,\r\n      '',\r\n      `- 域：D${op.domain}${DOMAINS[op.domain] ? ` (${DOMAINS[op.domain].code} ${DOMAINS[op.domain].name})` : ''}`,\r\n      `- 元数：${op.arity}`,\r\n      `- 签名：\\`${op.sig}\\``,\r\n      `- 说明：${op.doc}`,\r\n      `- 参考：${op.ref}`,\r\n      `- 不变量：${op.inv}`,\r\n      '',\r\n    ].join('\\n');\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.doc.domainMarkdown', arity: 2,\r\n  sig: '(op[] ops, number domain) -> string',\r\n  doc: '单个域的 Markdown 指令表',\r\n  ref: 'ONNX Operator Registry 域文档',\r\n  inv: '表格行数 = 该域条数 + 2（表头与分隔行）；标题含域编号',\r\n  impl: (ops, domain) => {\r\n    const d = Number(domain);\r\n    const rows = (Array.isArray(ops) ? ops : []).filter(o => o && Number(o.domain) === d);\r\n    const meta = DOMAINS[d];\r\n    const head = `## 域${d} ${meta ? `${meta.code} ${meta.name}` : ''}${meta ? ` — ${meta.desc}` : ''}`;\r\n    const out = [head, '', `共 ${rows.length} 条。`, '', '| id | name | 签名 | 说明 |', '| --- | --- | --- | --- |'];\r\n    for (const o of rows) {\r\n      out.push(`| \\`${o.id}\\` | \\`${o.name}\\` | \\`${_csvCell(o.sig)}\\` | ${_csvCell(o.doc)} |`);\r\n    }\r\n    out.push('');\r\n    return out.join('\\n');\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.doc.catalogMarkdown', arity: 2,\r\n  sig: '(op[] ops, string title) -> string',\r\n  doc: '全目录 Markdown（按域分组 + 计数）',\r\n  ref: 'ONNX Operator Registry 全量文档',\r\n  inv: '包含全部传入指令的 name；域标题数量等于出现的域个数',\r\n  impl: (ops, title) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const t = (title === undefined || title === null) ? 'forge-1024 指令目录' : String(title);\r\n    const groups = new Map();\r\n    for (const o of list) {\r\n      const d = o && o.domain;\r\n      if (!groups.has(d)) groups.set(d, []);\r\n      groups.get(d).push(o);\r\n    }\r\n    const ds = [...groups.keys()].sort((a, b) => a - b);\r\n    const out = [`# ${t}`, '', `内核 ${KERNEL_VERSION} · 目录 ${CATALOG_VERSION} · 共 ${list.length} 条`, ''];\r\n    for (const d of ds) {\r\n      const meta = DOMAINS[d];\r\n      const rows = groups.get(d);\r\n      out.push(`## 域${d} ${meta ? `${meta.code} ${meta.name}` : ''}（${rows.length} 条）`, '');\r\n      for (const o of rows) out.push(`- \\`${o.id}\\` **${o.name}** \\`${o.sig}\\` — ${o.doc}`);\r\n      out.push('');\r\n    }\r\n    return out.join('\\n');\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.doc.jsonExport', arity: 2,\r\n  sig: '(op[] ops, boolean pretty) -> string',\r\n  doc: '目录 JSON 导出（可被 JSON.parse 还原）',\r\n  ref: 'RFC 8259 JSON 交换格式',\r\n  inv: 'JSON.parse(输出).ops.length = ops.length；pretty 为真时带 2 空格缩进',\r\n  impl: (ops, pretty) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const obj = {\r\n      kernel: KERNEL_VERSION, catalog: CATALOG_VERSION, count: list.length,\r\n      ops: _plain(_sums(list)),\r\n    };\r\n    return JSON.stringify(obj, null, (pretty === undefined ? true : Boolean(pretty)) ? 2 : 0);\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.doc.csvExport', arity: 2,\r\n  sig: '(op[] ops, string delimiter) -> string',\r\n  doc: '目录 CSV 导出（RFC 4180 引号转义）',\r\n  ref: 'RFC 4180 CSV 格式',\r\n  inv: '行数 = ops.length + 1；列数恒为 7；字段含分隔符时被双引号包裹',\r\n  impl: (ops, delimiter) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const sep = (delimiter === undefined || delimiter === null) ? ',' : String(delimiter);\r\n    const lines = [['id', 'domain', 'name', 'arity', 'sig', 'doc', 'ref'].map(_csvCell).join(sep)];\r\n    for (const o of _sums(list)) {\r\n      lines.push([o.id, o.domain, o.name, o.arity, o.sig, o.doc, o.ref].map(_csvCell).join(sep));\r\n    }\r\n    return lines.join('\\n');\r\n  },\r\n});\r\n\r\ndefineOp({\r\n  id: nid(), domain: D, name: 'sys.doc.htmlExport', arity: 2,\r\n  sig: '(op[] ops, string title) -> string',\r\n  doc: '目录 HTML 导出（单文件，含内联样式）',\r\n  ref: 'RFC 1866 HTML 2.0 / HTML5 表格元素',\r\n  inv: '输出以 <html 开头且以 </html> 收尾；每行指令出现在 <tr> 中',\r\n  impl: (ops, title) => {\r\n    const list = Array.isArray(ops) ? ops : [];\r\n    const t = (title === undefined || title === null) ? 'forge-1024 指令目录' : String(title);\r\n    const out = [];\r\n    out.push('<!doctype html>');\r\n    out.push('<html lang=\"zh-CN\">');\r\n    out.push('<head><meta charset=\"utf-8\">');\r\n    out.push(`<title>${_esc(t)}</title>`);\r\n    out.push('<style>body{font-family:system-ui,sans-serif;margin:2rem}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:4px 8px;text-align:left}th{background:#f3f4f6}</style>');\r\n    out.push('</head><body>');\r\n    out.push(`<h1>${_esc(t)}</h1>`);\r\n    out.push(`<p>内核 ${_esc(KERNEL_VERSION)} · 目录 ${_esc(CATALOG_VERSION)} · 共 ${list.length} 条</p>`);\r\n    out.push('<table><thead><tr><th>id</th><th>domain</th><th>name</th><th>元数</th><th>签名</th><th>说明</th></tr></thead><tbody>');\r\n    for (const o of _sums(list)) {\r\n      out.push(`<tr><td>${_esc(o.id)}</td><td>${_esc(o.domain)}</td><td><code>${_esc(o.name)}</code></td><td>${_esc(o.arity)}</td><td>
